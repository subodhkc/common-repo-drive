<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluate · Support Agent v2 — HAIEC Assurance Engine</title>
<style>
:root{
  --bg:#FAFBFC; --card:#FFFFFF; --card-soft:#F5F7FA;
  --border:#E7E9EE; --border-hover:#D0D4DD; --border-strong:#B8BFCC;
  --text:#0F1729; --text-secondary:#414A5E; --text-muted:#667085; --text-dim:#98A2B3;
  --primary:#4338CA; --primary-hover:#3730A3; --primary-light:#EEF2FF; --primary-border:#C7D2FE; --primary-ring:rgba(67,56,202,0.12);
  --success:#067647; --success-bg:#ECFDF3; --success-border:#ABEFC6;
  --amber:#B54708; --amber-bg:#FFFAEB; --amber-border:#FEDF89;
  --danger:#B42318; --danger-bg:#FEF3F2; --danger-border:#FECDCA;
  --info:#175CD3; --info-bg:#EFF8FF; --info-border:#B2DDFF;
  --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  --sh-1:0 1px 2px rgba(16,24,40,0.04);
  --sh-2:0 2px 6px rgba(16,24,40,0.06),0 1px 2px rgba(16,24,40,0.04);
  --sh-3:0 8px 24px rgba(16,24,40,0.08);
  --sh-4:0 24px 56px rgba(16,24,40,0.18);
  --sans:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--sans);font-size:14.5px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{color:var(--primary);text-decoration:none;}
a:hover{text-decoration:underline;text-underline-offset:2px;}
code,.mono{font-family:var(--mono);font-size:0.92em;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-hover);border-radius:5px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong);}

/* PAGE */
.page{max-width:1400px;margin:0 auto;padding:24px 32px 80px;}

/* SLIM HEADER */
.page-header{display:flex;align-items:center;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:28px;flex-wrap:wrap;}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);flex-wrap:wrap;}
.crumb .org{font-weight:500;color:var(--text);}
.crumb .sep{color:var(--text-dim);}
.crumb .current{font-weight:600;color:var(--text);}
.crumb .env{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);font-weight:600;letter-spacing:0.03em;text-transform:uppercase;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.synthetic-chip{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:5px;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);letter-spacing:0.02em;text-transform:uppercase;}
.basis-control{display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--card);}
.basis-btn{padding:5px 12px;font-size:12px;font-weight:500;color:var(--text-muted);}
.basis-btn.active{background:var(--text);color:white;}
.basis-asof{padding:0 10px;font-size:11px;color:var(--text-muted);font-family:var(--mono);border-left:1px solid var(--border);background:var(--card);}

/* TYPOGRAPHY */
h1{font-size:24px;font-weight:600;letter-spacing:-0.02em;line-height:1.3;color:var(--text);margin-bottom:6px;}
h2{font-size:16px;font-weight:600;letter-spacing:-0.01em;line-height:1.4;color:var(--text);margin-bottom:4px;}
h3{font-size:13px;font-weight:600;color:var(--text);}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;}
.lead{font-size:15.5px;line-height:1.6;color:var(--text-secondary);margin-bottom:4px;}
.helper{font-size:13px;line-height:1.55;color:var(--text-muted);}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;border:1px solid transparent;transition:all 0.12s;display:inline-flex;align-items:center;gap:6px;letter-spacing:-0.005em;}
.btn-primary{background:var(--primary);color:white;box-shadow:var(--sh-1);}
.btn-primary:hover{background:var(--primary-hover);box-shadow:var(--sh-2);}
.btn-secondary{background:var(--card);color:var(--text);border-color:var(--border);}
.btn-secondary:hover{background:var(--card-soft);border-color:var(--border-hover);}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:var(--border);}
.btn-ghost:hover{background:var(--card-soft);color:var(--text);}
.btn-sm{padding:5px 12px;font-size:12.5px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

/* CHIPS */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;letter-spacing:0.02em;white-space:nowrap;}
.chip-success{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);}
.chip-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.chip-danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);}
.chip-neutral{background:var(--card-soft);color:var(--text-muted);border:1px solid var(--border);}
.chip-info{background:var(--info-bg);color:var(--info);border:1px solid var(--info-border);}
.chip-mono{font-family:var(--mono);font-size:10.5px;letter-spacing:0;text-transform:none;}
.chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.chip-success .chip-dot{background:var(--success);}
.chip-amber .chip-dot{background:var(--amber);}
.chip-danger .chip-dot{background:var(--danger);}
.chip-neutral .chip-dot{background:var(--text-dim);}

/* DISPOSITION BANNER — hero */
.disposition-banner{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px 32px;margin-bottom:20px;position:relative;overflow:hidden;border-left:5px solid var(--amber);}
.disposition-banner.allow{border-left-color:var(--success);}
.disposition-banner.review{border-left-color:var(--amber);}
.disposition-banner.block{border-left-color:var(--danger);}
.disposition-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:16px;}
.disposition-left{flex:1;min-width:280px;}
.disposition-eyebrow{font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;}
.disposition-main{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
.disposition-badge{font-size:18px;font-weight:700;letter-spacing:0.02em;padding:6px 16px;border-radius:8px;}
.disposition-badge.allow{background:var(--success-bg);color:var(--success);border:1.5px solid var(--success-border);}
.disposition-badge.review{background:var(--amber-bg);color:var(--amber);border:1.5px solid var(--amber-border);}
.disposition-badge.block{background:var(--danger-bg);color:var(--danger);border:1.5px solid var(--danger-border);}
.disposition-meta{font-size:13px;color:var(--text-muted);font-family:var(--mono);}
.disposition-headline{font-size:15.5px;line-height:1.6;color:var(--text-secondary);max-width:820px;}
.disposition-headline strong{color:var(--text);font-weight:600;}
.disposition-caveat{padding:14px 16px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--r-sm);max-width:340px;flex-shrink:0;}
.disposition-caveat.allow{background:var(--success-bg);border-color:var(--success-border);}
.disposition-caveat-title{font-size:10.5px;font-weight:600;letter-spacing:0.06em;color:var(--amber);text-transform:uppercase;margin-bottom:6px;}
.disposition-caveat.allow .disposition-caveat-title{color:var(--success);}
.disposition-caveat-body{font-size:12.5px;line-height:1.55;color:var(--text);}
.disposition-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--border);}

/* NOT ESTABLISHED — always visible, prominent */
.not-established{background:var(--card);border:1.5px dashed var(--border-strong);border-radius:var(--r-md);padding:20px 24px;margin-bottom:28px;}
.not-established-title{font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.not-established-title .icon{width:20px;height:20px;border-radius:50%;background:var(--card-soft);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted);}
.not-established-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;}
.not-established-item{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.55;color:var(--text-secondary);}
.not-established-item .icon{color:var(--text-dim);font-weight:700;flex-shrink:0;margin-top:1px;}
.not-established-item strong{color:var(--text);font-weight:600;}

/* GRID */
.grid-2col{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;}
.main-col{display:flex;flex-direction:column;gap:24px;min-width:0;}
.side-col{display:flex;flex-direction:column;gap:16px;position:sticky;top:24px;}

/* SECTION */
.section{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);}
.section-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.section-title{font-size:13px;font-weight:600;letter-spacing:0.02em;text-transform:uppercase;color:var(--text-muted);}
.section-sub{font-size:12.5px;color:var(--text-muted);margin-top:3px;text-transform:none;letter-spacing:0;font-weight:400;line-height:1.5;}
.section-pad{padding:20px 22px;}
.section-action{font-size:12.5px;color:var(--primary);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px;white-space:nowrap;}

/* EVALUATED SCOPE — analyzer participation */
.scope-summary{display:flex;gap:16px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--border);}
.scope-stat{display:flex;flex-direction:column;gap:3px;}
.scope-stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);}
.scope-stat-value{font-size:14px;font-weight:500;color:var(--text);}
.scope-stat-value.mono{font-family:var(--mono);font-size:12.5px;}
.analyzer-list{display:flex;flex-direction:column;gap:8px;}
.analyzer{background:var(--card-soft);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;border-left:2px solid var(--border);transition:all 0.12s;}
.analyzer.ran{border-left-color:var(--success);}
.analyzer.partial{border-left-color:var(--amber);}
.analyzer.not-run{border-left-color:var(--danger);background:#FEFBFA;}
.analyzer.held{border-left-color:var(--text-dim);}
.analyzer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
.analyzer-name{font-weight:600;font-size:13px;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.analyzer-version{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);font-weight:500;padding:1px 5px;background:var(--card);border-radius:3px;border:1px solid var(--border);}
.analyzer-status{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap;}
.analyzer-status.ran{background:var(--success-bg);color:var(--success);}
.analyzer-status.partial{background:var(--amber-bg);color:var(--amber);}
.analyzer-status.not-run{background:var(--danger-bg);color:var(--danger);}
.analyzer-status.held{background:var(--card-soft);color:var(--text-muted);}
.analyzer-facts{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 20px;font-size:12px;padding-top:8px;border-top:1px solid var(--border);}
.analyzer-fact{display:flex;gap:8px;align-items:baseline;}
.analyzer-fact-label{color:var(--text-muted);font-size:11.5px;min-width:90px;flex-shrink:0;}
.analyzer-fact-value{color:var(--text);font-weight:500;}
.analyzer-fact-value.mono{font-family:var(--mono);font-size:11px;}
.analyzer-note{margin-top:8px;font-size:11.5px;color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-border);padding:6px 10px;border-radius:5px;line-height:1.5;}
.analyzer.not-run .analyzer-note{color:var(--danger);background:var(--danger-bg);border-color:var(--danger-border);}

/* CLAIMS */
.claims-list{display:flex;flex-direction:column;gap:10px;}
.claim-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-md);overflow:hidden;border-left:3px solid var(--border);transition:all 0.12s;cursor:pointer;}
.claim-card:hover{border-color:var(--primary);box-shadow:var(--sh-1);}
.claim-card.supported{border-left-color:var(--success);}
.claim-card.partial{border-left-color:var(--amber);}
.claim-card.contradicted{border-left-color:var(--danger);}
.claim-card.not-assessed{border-left-color:var(--text-dim);}
.claim-head{padding:16px 18px;display:flex;align-items:flex-start;gap:14px;}
.claim-status-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px;}
.claim-status-icon.supported{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);}
.claim-status-icon.partial{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.claim-status-icon.contradicted{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);}
.claim-status-icon.not-assessed{background:var(--card-soft);color:var(--text-muted);border:1px solid var(--border);}
.claim-body{flex:1;min-width:0;}
.claim-title{font-size:14.5px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.4;}
.claim-summary{font-size:13px;color:var(--text-muted);line-height:1.55;margin-bottom:8px;}
.claim-meta{display:flex;gap:10px;font-size:11px;color:var(--text-dim);flex-wrap:wrap;align-items:center;}
.claim-meta .chip{font-size:10px;padding:1px 6px;}
.claim-arrow{color:var(--text-dim);font-size:16px;flex-shrink:0;align-self:center;transition:transform 0.15s;}
.claim-card:hover .claim-arrow{color:var(--primary);transform:translateX(2px);}

/* FINDINGS */
.findings-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.filter-chip{padding:4px 10px;border-radius:var(--r-sm);font-size:12px;border:1px solid var(--border);background:var(--card);color:var(--text-muted);cursor:pointer;font-weight:500;}
.filter-chip:hover{background:var(--card-soft);color:var(--text);}
.filter-chip.active{background:var(--primary-light);color:var(--primary);border-color:var(--primary-border);}
.findings-list{display:flex;flex-direction:column;gap:8px;}
.finding{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;transition:all 0.12s;cursor:pointer;}
.finding:hover{border-color:var(--primary);background:var(--primary-light);}
.sev-badge{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px;}
.sev-high{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);}
.sev-med{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.sev-low{background:var(--card-soft);color:var(--text-muted);border:1px solid var(--border);}
.finding-body{flex:1;min-width:0;}
.finding-title{font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.finding-id{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);font-weight:500;}
.finding-summary{font-size:12.5px;color:var(--text-muted);line-height:1.55;}
.finding-meta{display:flex;gap:10px;font-size:11px;color:var(--text-dim);margin-top:6px;flex-wrap:wrap;align-items:center;}
.finding-meta .chip{font-size:10px;padding:1px 6px;}
.finding-arrow{color:var(--text-dim);font-size:16px;flex-shrink:0;align-self:center;}

/* DAI IN SCOPE */
.dai-list{display:flex;flex-direction:column;gap:8px;}
.dai-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;cursor:pointer;transition:all 0.12s;display:flex;align-items:center;gap:14px;}
.dai-item:hover{border-color:var(--primary);background:var(--primary-light);}
.dai-item-body{flex:1;min-width:0;}
.dai-item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px;flex-wrap:wrap;}
.dai-item-route{font-size:13.5px;font-weight:500;color:var(--text);}
.dai-item-meta{display:flex;gap:10px;font-size:11px;color:var(--text-dim);flex-wrap:wrap;}
.dai-item-dims{display:flex;gap:2px;margin-top:6px;}
.dai-dim-dot{width:8px;height:8px;border-radius:2px;background:var(--success);}
.dai-dim-dot.mismatch{background:var(--danger);}
.dai-dim-dot.unknown{background:var(--border-hover);}

/* MISSING EVIDENCE */
.missing-list{display:flex;flex-direction:column;gap:8px;}
.missing{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--r-sm);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;}
.missing-icon{width:22px;height:22px;border-radius:50%;background:white;border:1px solid var(--amber-border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--amber);font-weight:700;flex-shrink:0;margin-top:1px;}
.missing-body{flex:1;min-width:0;}
.missing-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;}
.missing-detail{font-size:12px;color:var(--text-muted);line-height:1.5;}
.missing-consequence{font-size:11.5px;color:var(--amber);margin-top:4px;font-style:italic;}
.missing-action{font-size:12px;font-weight:500;color:var(--amber);white-space:nowrap;padding:5px 10px;border:1px solid var(--amber-border);background:white;border-radius:var(--r-xs);flex-shrink:0;transition:all 0.12s;}
.missing-action:hover{background:var(--amber);color:white;border-color:var(--amber);}

/* HISTORY */
.history-table{width:100%;border-collapse:collapse;font-size:13px;}
.history-table th,.history-table td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
.history-table th{font-size:10.5px;font-weight:600;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;background:var(--card-soft);padding:8px 12px;}
.history-table tbody tr:hover{background:var(--card-soft);}
.history-table tr.clickable{cursor:pointer;}
.history-table tbody tr:last-child td{border-bottom:none;}
.history-table tr.current{background:var(--primary-light);}
.history-table .mono-cell{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);}

/* SIDE CARDS */
.side-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 20px;}
.side-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:12px;}
.side-actions{display:flex;flex-direction:column;gap:8px;}
.side-action{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--card);text-align:left;transition:all 0.12s;font-size:13px;color:var(--text);}
.side-action:hover{border-color:var(--primary);background:var(--primary-light);}
.side-action-icon{font-size:14px;}
.side-action-body{flex:1;}
.side-action-title{font-weight:500;font-size:13px;}
.side-action-detail{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
.side-action-arrow{color:var(--text-dim);font-size:13px;}
.side-action:hover .side-action-arrow{color:var(--primary);}
.next-action{background:linear-gradient(135deg,var(--primary-light) 0%,var(--card) 100%);border:1px solid var(--primary-border);}
.next-action-eyebrow{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--primary);margin-bottom:8px;}
.next-action-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.35;}
.next-action-detail{font-size:12.5px;color:var(--text-secondary);line-height:1.55;margin-bottom:12px;}
.next-action-btn{width:100%;padding:9px 12px;background:var(--primary);color:white;border-radius:8px;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.15s;}
.next-action-btn:hover{background:var(--primary-hover);}

.meta-list{display:flex;flex-direction:column;gap:10px;}
.meta-row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;align-items:baseline;}
.meta-label{color:var(--text-muted);flex-shrink:0;}
.meta-value{color:var(--text);font-weight:500;text-align:right;word-break:break-word;}
.meta-value.mono{font-family:var(--mono);font-size:11.5px;}

/* INSPECTOR */
.inspector-backdrop{position:fixed;inset:0;background:rgba(15,23,41,0.42);opacity:0;pointer-events:none;transition:opacity 0.22s;z-index:40;}
.inspector-backdrop.open{opacity:1;pointer-events:auto;}
.inspector{position:fixed;top:0;right:0;bottom:0;width:min(720px,calc(100vw - 40px));background:var(--card);box-shadow:var(--sh-4);transform:translateX(100%);transition:transform 0.28s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;z-index:50;}
.inspector.open{transform:translateX(0);}
.inspector-head{padding:20px 26px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
.inspector-crumb{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
.inspector-crumb .sep{color:var(--text-dim);}
.inspector-title{font-size:18px;font-weight:600;letter-spacing:-0.015em;line-height:1.35;margin-bottom:3px;}
.inspector-sub{font-size:12.5px;color:var(--text-muted);}
.inspector-close{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-muted);flex-shrink:0;}
.inspector-close:hover{background:var(--card-soft);color:var(--text);}
.inspector-body{flex:1;overflow-y:auto;padding:22px 26px;}
.inspector-section{margin-bottom:24px;}
.inspector-section:last-child{margin-bottom:0;}
.inspector-section-title{font-size:10.5px;font-weight:600;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.inspector-section-title .badge{background:var(--card-soft);color:var(--text-muted);font-size:10px;padding:1px 6px;border-radius:8px;font-family:var(--mono);letter-spacing:0;text-transform:none;}
.inspector-foot{padding:14px 26px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);flex-wrap:wrap;}
.inspector-foot-info{font-size:11.5px;color:var(--text-muted);}

/* CALLOUT */
.callout{padding:14px 18px;border-radius:var(--r-sm);font-size:13px;line-height:1.55;}
.callout-info{background:var(--primary-light);border:1px solid var(--primary-border);color:var(--text);}
.callout-info strong{color:var(--primary);font-weight:600;}
.callout-warn{background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber);}
.callout-success{background:var(--success-bg);border:1px solid var(--success-border);color:var(--success);}
.callout-danger{background:var(--danger-bg);border:1px solid var(--danger-border);color:var(--danger);}

/* STATE BLOCK */
.state-block{padding:12px 14px;border-radius:var(--r-sm);display:flex;flex-direction:column;gap:4px;border:1px solid var(--border);}
.state-block.success{background:var(--success-bg);border-color:var(--success-border);}
.state-block.amber{background:var(--amber-bg);border-color:var(--amber-border);}
.state-block.danger{background:var(--danger-bg);border-color:var(--danger-border);}
.state-block.neutral{background:var(--card-soft);}
.state-block.info{background:var(--info-bg);border-color:var(--info-border);}
.state-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;}
.state-block.success .state-title{color:var(--success);}
.state-block.amber .state-title{color:var(--amber);}
.state-block.danger .state-title{color:var(--danger);}
.state-block.info .state-title{color:var(--info);}
.state-block.neutral .state-title{color:var(--text);}
.state-detail{font-size:12.5px;color:var(--text-muted);line-height:1.55;}

/* EV LIST */
.ev-list{display:flex;flex-direction:column;gap:8px;}
.ev-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--card-soft);border:1px solid var(--border);border-radius:var(--r-xs);}
.ev-ref{font-family:var(--mono);font-size:10.5px;color:var(--primary);background:var(--primary-light);padding:1px 6px;border-radius:3px;flex-shrink:0;margin-top:1px;}
.ev-summary{flex:1;font-size:12px;color:var(--text-muted);line-height:1.5;}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,41,0.5);opacity:0;pointer-events:none;transition:opacity 0.2s;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.open{opacity:1;pointer-events:auto;}
.modal{background:var(--card);border-radius:var(--r-lg);max-width:560px;width:100%;box-shadow:var(--sh-4);transform:scale(0.96);transition:transform 0.2s;overflow:hidden;}
.modal-backdrop.open .modal{transform:scale(1);}
.modal-head{padding:22px 26px 14px;}
.modal-title{font-size:17px;font-weight:600;margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--text-muted);line-height:1.55;}
.modal-body{padding:18px 26px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:13px;line-height:1.6;}
.modal-foot{padding:14px 26px;display:flex;gap:8px;justify-content:flex-end;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:white;padding:11px 20px;border-radius:var(--r-sm);font-size:13px;z-index:100;box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:all 0.2s;max-width:520px;text-align:center;line-height:1.5;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* PRINT */
@media print{
  body{background:white;}
  .page{padding:0;max-width:none;}
  .header-right,.disposition-actions,.not-established,.side-col,.inspector,.inspector-backdrop,.modal-backdrop,.toast,.section-action,.missing-action{display:none !important;}
  .section,.disposition-banner,.not-established{box-shadow:none;border-color:#ccc;page-break-inside:avoid;}
}

/* RESPONSIVE */
@media (max-width:1100px){
  .grid-2col{grid-template-columns:1fr;}
  .side-col{position:static;flex-direction:row;flex-wrap:wrap;}
  .side-col > *{flex:1;min-width:260px;}
  .analyzer-facts{grid-template-columns:1fr;}
}
@media (max-width:900px){
  .page{padding:16px;}
  .disposition-top{flex-direction:column;gap:14px;}
  .disposition-caveat{max-width:none;}
  .disposition-actions{flex-direction:column;}
  .disposition-actions .btn{width:100%;justify-content:center;}
  .analyzer-facts{grid-template-columns:1fr;gap:6px;}
  .scope-summary{gap:12px;}
  .inspector{width:100vw;}
}
@media (max-width:600px){
  h1{font-size:20px;}
  .disposition-banner{padding:20px 18px;}
  .disposition-badge{font-size:15px;padding:5px 12px;}
  .disposition-headline{font-size:14px;}
  .history-table{font-size:12px;}
  .finding{padding:12px 14px;}
  .side-col{flex-direction:column;}
}

const state = {

function currentEval() { return EVALUATIONS[state.evalId]; }

/* ═══════════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════════ */

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),3200);
}

function setBasis(b){
  state.basis=b;
  document.querySelectorAll('.basis-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.basis===b));
  document.getElementById('basis-asof').textContent=b==='current'?'14:22 UTC':'10:42 UTC';
  if(b==='current'){
    toast('Current state — not an evaluation snapshot. Select a frozen evaluation below to view disposition.');
  }
  render();
}

function selectEval(id){
  state.evalId=id;
  state.findingsFilter='all';
  render();
  document.getElementById('main-content').scrollIntoView({behavior:'smooth',block:'start'});
}

}

        <div class="not-established-item"><span class="icon">·</span><div><strong>Neither is</strong> an operational execution authorization. Deployment approval is a separate human decision.</div></div>
      </div>
    </div>

      <div class="section-head"><div><div class="section-title">Frozen evaluations for this system</div><div class="section-sub">Switch to one to see its full evaluation.</div></div></div>
      <table class="history-table">
        <thead><tr><th>Evaluation</th><th>As-of</th><th>Disposition</th><th>Findings</th><th></th></tr></thead>
        <tbody>
          ${EVAL_ORDER.map(id=>{
            const e=EVALUATIONS[id];
            return `<tr class="clickable" onclick="setBasis('evaluation');selectEval('${id}')">
              <td class="mono-cell">${esc(e.id)}</td>
              <td class="mono-cell">${esc(e.asOf)}</td>
              <td><span class="chip chip-${e.dispositionTone==='allow'?'success':e.dispositionTone==='block'?'danger':'amber'}">${esc(e.disposition)}</span></td>

            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function openClaimInspector(claimId){
  const ev=currentEval();
  const claim=ev.claims.find(c=>c.id===claimId);
  if(!claim)return;
  const relatedFindings=ev.findings.filter(f=>claim.relatedFindings.includes(f.id));
  const statusLabel=claim.status==='supported'?'Supported':claim.status==='partial'?'Partially supported':claim.status==='contradicted'?'Contradicted':'Not assessed';
  const body=`
    <div class="callout callout-${claim.status==='supported'?'success':claim.status==='contradicted'?'danger':'info'}" style="margin-bottom:18px;">
      <strong>${claim.status==='supported'?'✓':claim.status==='contradicted'?'⚠':'◐'} ${esc(statusLabel)}</strong>
      <div style="margin-top:6px;font-size:12.5px;line-height:1.55;">${esc(claim.summary)}</div>
    </div>

    <div class="inspector-section">
      <div class="inspector-section-title">Evidence basis <span class="badge">${claim.evidenceCount}</span></div>
      <div class="ev-list">
        ${claim.sources.map((src,i)=>`
          <div class="ev-item">
            <span class="ev-ref">${esc(src).toLowerCase().replace(/\s+/g,'.')}</span>
            <span class="ev-summary">Evidence from ${esc(src)} contributing to this claim's support status.</span>
          </div>
        `).join('')}
        ${claim.evidenceCount>claim.sources.length?`
          <div style="font-size:11.5px;color:var(--text-muted);font-style:italic;padding-left:8px;">+ ${claim.evidenceCount-claim.sources.length} additional reference${claim.evidenceCount-claim.sources.length===1?'':'s'} in full evidence packet</div>
        `:''}
      </div>
    </div>

    ${relatedFindings.length?`
      <div class="inspector-section">
        <div class="inspector-section-title">Related findings <span class="badge">${relatedFindings.length}</span></div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${relatedFindings.map(f=>`
            <div style="padding:10px 12px;background:var(--card-soft);border:1px solid var(--border);border-radius:var(--r-xs);font-size:12.5px;">
              <strong style="color:var(--text);">${esc(f.id)} · ${esc(f.title)}</strong>
              <div style="color:var(--text-muted);margin-top:2px;">${esc(f.summary)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `:''}

    <div class="inspector-section">
      <div class="inspector-section-title">What would strengthen this claim</div>
      ${claim.status==='supported'?`
        <div class="state-block success">
          <div class="state-title"><span>✓</span>Fully supported at this evaluation</div>
          <div class="state-detail">All in-scope evidence supports this claim. No specific enrichment required.</div>
        </div>
      `:claim.status==='partial'?`
        <div class="state-block amber">
          <div class="state-title"><span>◐</span>Partially supported</div>
          <div class="state-detail">Add evidence to close remaining gaps. See the "Missing evidence" section on the evaluation.</div>
        </div>
      `:claim.status==='contradicted'?`
        <div class="state-block danger">
          <div class="state-title"><span>!</span>Contradicted by evidence</div>
          <div class="state-detail">This claim is contradicted by evidence. Consider a scope review, remediation, or updating the Operating Envelope.</div>
        </div>
      `:`
        <div class="state-block neutral">
          <div class="state-title"><span>·</span>Not assessed</div>
          <div class="state-detail">This claim was not evaluated. Add the source listed in "Missing evidence" to include it in the next evaluation.</div>
        </div>
      `}
    </div>
  `;
  setInspector({
    crumb:`Support Agent v2 › Evaluate › Claims`,
    title:`${esc(claim.id)} · ${esc(claim.title)}`,
    sub:`${statusLabel} · ${claim.evidenceCount} evidence ref${claim.evidenceCount===1?'':'s'}`,
    body,
    foot:`<div class="inspector-foot-info">Claim ${esc(claim.id)} · ${esc(ev.id)}</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="toast('View full evidence packet — would open in stage 2')">Full evidence packet</button>
        <button class="btn btn-primary btn-sm" onclick="closeInspector()">Done</button>
      </div>`
  });
}

function previewCompare(){
  const currentIdx=EVAL_ORDER.indexOf(state.evalId);
  const priorId=EVAL_ORDER[currentIdx+1];
  if(!priorId){
    toast('No prior evaluation to compare with');
    return;
  }
  const cur=EVALUATIONS[state.evalId];
  const prior=EVALUATIONS[priorId];
  const added=cur.findings.filter(f=>!prior.findings.find(pf=>pf.title===f.title)).length;
  const resolved=prior.findings.filter(f=>!cur.findings.find(cf=>cf.title===f.title)).length;
  const persisted=cur.findings.filter(f=>prior.findings.find(pf=>pf.title===f.title)).length;

  openModal({
    title:`Compare ${cur.id.slice(0,12)} with ${prior.id.slice(0,12)}`,
    sub:`${cur.asOf} vs ${prior.asOf}`,
    body:`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:13px;">
        <div>
          <div style="font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:4px;">Current</div>
          <div style="font-family:var(--mono);font-size:12px;margin-bottom:8px;">${esc(cur.id)}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span class="chip chip-${cur.dispositionTone==='allow'?'success':cur.dispositionTone==='block'?'danger':'amber'}">${cur.disposition}</span><span style="color:var(--text-muted);">${esc(cur.asOf)}</span></div>
          <div style="color:var(--text-muted);">${cur.findings.length} findings · ${cur.claims.length} claims</div>
        </div>
        <div>
          <div style="font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:4px;">Prior</div>
          <div style="font-family:var(--mono);font-size:12px;margin-bottom:8px;">${esc(prior.id)}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span class="chip chip-${prior.dispositionTone==='allow'?'success':prior.dispositionTone==='block'?'danger':'amber'}">${prior.disposition}</span><span style="color:var(--text-muted);">${esc(prior.asOf)}</span></div>
          <div style="color:var(--text-muted);">${prior.findings.length} findings · ${prior.claims.length} claims</div>
        </div>
      </div>
      <div style="margin-top:16px;padding:14px;background:var(--card-soft);border-radius:var(--r-sm);">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;"><span style="color:var(--text-muted);">Added</span><strong style="color:var(--amber);">+${added}</strong></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;"><span style="color:var(--text-muted);">Resolved</span><strong style="color:var(--success);">−${resolved}</strong></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;"><span style="color:var(--text-muted);">Persisted</span><strong>${persisted}</strong></div>
      </div>
      <div style="margin-top:14px;padding:10px 12px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--r-xs);font-size:12px;color:var(--amber);line-height:1.55;">
        <strong>Note:</strong> A delta between two evaluations is not an aggregate score — it is a comparison of specific facts at two frozen moments. Different source availability can affect comparability.
      </div>
    `,
    buttons:[
      {label:'Close',style:'ghost',action:closeModal},
      {label:'Open side-by-side (preview)',style:'primary',disabled:true}
    ]
  });
}

function setInspector({crumb,title,sub,body,foot}){
  document.getElementById('inspector-crumb').innerHTML=crumb;
  document.getElementById('inspector-title').textContent=title;
  document.getElementById('inspector-sub').textContent=sub;
  document.getElementById('inspector-body').innerHTML=body;
  document.getElementById('inspector-foot').innerHTML=foot||'';
  document.getElementById('inspector').classList.add('open');
  document.getElementById('inspector-backdrop').classList.add('open');
}

function closeInspector(){
  document.getElementById('inspector').classList.remove('open');
  document.getElementById('inspector-backdrop').classList.remove('open');
}

function openModal({title,sub,body,buttons}){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-sub').textContent=sub;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-foot').innerHTML=buttons.map(b=>`<button class="btn btn-${b.style==='primary'?'primary':b.style==='ghost'?'ghost':'secondary'}" ${b.disabled?'disabled style="opacity:0.5;cursor:not-allowed;"':''} onclick="${b.disabled?'':(b.action===closeModal?'closeModal()':b.action)}">${esc(b.label)}</button>`).join('');
  document.getElementById('modal-backdrop').classList.add('open');
}

function closeModal(){
  document.getElementById('modal-backdrop').classList.remove('open');
}

/* ═══════════════════════════════════════════════
   BIND & INIT
   ═══════════════════════════════════════════════ */

function bindEvents(){}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('inspector').classList.contains('open'))closeInspector();
    else if(document.getElementById('modal-backdrop').classList.contains('open'))closeModal();
  }
});

(function init(){
  document.querySelectorAll('.basis-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.basis===state.basis));
  document.getElementById('basis-asof').textContent='10:42 UTC';
  render();
})();
</script>

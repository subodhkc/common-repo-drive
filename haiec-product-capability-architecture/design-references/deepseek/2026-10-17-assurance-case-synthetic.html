<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assurance Case — Support Agent v2 · HAIEC</title>
<style>
:root {
  --bg:#FAFBFC; --card:#FFFFFF; --card-soft:#F5F7FA;
  --border:#E7E9EE; --border-hover:#D0D4DD; --border-strong:#B8BFCC;
  --text:#0F1729; --text-secondary:#414A5E; --text-muted:#667085; --text-dim:#98A2B3;
  --primary:#4338CA; --primary-hover:#3730A3; --primary-light:#EEF2FF; --primary-border:#C7D2FE; --primary-ring:rgba(67,56,202,0.12);
  --success:#067647; --success-bg:#ECFDF3; --success-border:#ABEFC6;
  --amber:#B54708; --amber-bg:#FFFAEB; --amber-border:#FEDF89;
  --danger:#B42318; --danger-bg:#FEF3F2; --danger-border:#FECDCA;
  --info:#175CD3; --info-bg:#EFF8FF; --info-border:#B2DDFF;
  --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  --sh-1:0 1px 2px rgba(16,24,40,0.04);
  --sh-2:0 2px 6px rgba(16,24,40,0.06),0 1px 2px rgba(16,24,40,0.04);
  --sh-3:0 8px 24px rgba(16,24,40,0.08);
  --sh-4:0 24px 56px rgba(16,24,40,0.18);
  --sans:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--sans);font-size:14.5px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{color:var(--primary);text-decoration:none;}
a:hover{text-decoration:underline;text-underline-offset:2px;}
code,.mono{font-family:var(--mono);font-size:0.92em;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-hover);border-radius:5px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong);}

/* SHELL */
.app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:56px 1fr;height:100vh;grid-template-areas:"topbar topbar" "sidebar main";}
.topbar{grid-area:topbar;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--border);z-index:30;}
.topbar-org{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;font-weight:500;background:var(--card);cursor:pointer;}
.topbar-org:hover{background:var(--card-soft);}
.org-mark{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,#4338CA,#6366F1);color:white;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:-0.02em;}
.topbar-sep{width:1px;height:20px;background:var(--border);}
.topbar-system{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 8px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;background:var(--card);cursor:pointer;position:relative;}
.topbar-system:hover{background:var(--card-soft);}
.sys-name{font-weight:500;color:var(--text);}
.sys-env{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);font-weight:600;letter-spacing:0.03em;text-transform:uppercase;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.synthetic-chip{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:5px;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);letter-spacing:0.02em;text-transform:uppercase;}
.basis-control{display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--card);}
.basis-btn{padding:5px 12px;font-size:12px;font-weight:500;color:var(--text-muted);}
.basis-btn.active{background:var(--text);color:white;}
.basis-asof{padding:0 10px;font-size:11px;color:var(--text-muted);font-family:var(--mono);border-left:1px solid var(--border);background:var(--card);}
.persona-select{padding:5px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;background:var(--card);color:var(--text-secondary);cursor:pointer;}
.topbar-search{width:200px;padding:5px 10px 5px 28px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12.5px;background:var(--card);color:var(--text);}
.topbar-search:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring);}
.search-wrap{position:relative;}
.search-wrap::before{content:'⌕';position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:14px;pointer-events:none;}
.dev-chip{padding:4px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:11.5px;font-family:var(--mono);color:var(--text-secondary);background:var(--card);font-weight:500;}
.dev-chip:hover{background:var(--card-soft);}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:pointer;}

/* SIDEBAR */
.sidebar{grid-area:sidebar;background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:12px 8px 20px;}
.nav-group{margin-bottom:16px;}
.nav-group-title{padding:8px 12px 4px;font-size:10.5px;font-weight:600;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:1px 0;border-radius:var(--r-sm);font-size:13.5px;color:var(--text-secondary);cursor:pointer;transition:all 0.1s;text-decoration:none;}
.nav-item:hover{background:var(--card-soft);color:var(--text);text-decoration:none;}
.nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:500;}
.nav-icon{width:16px;text-align:center;font-size:13px;flex-shrink:0;opacity:0.75;}
.nav-item.active .nav-icon{opacity:1;}
.nav-badge{margin-left:auto;font-size:10.5px;padding:1px 6px;border-radius:8px;background:var(--amber-bg);color:var(--amber);font-weight:600;}

/* MAIN */
.main{grid-area:main;overflow-y:auto;background:var(--bg);position:relative;}
.main-inner{max-width:1320px;margin:0 auto;padding:0 32px 100px;}

/* SUB-NAV */
.subnav{position:sticky;top:0;background:rgba(250,251,252,0.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:10px 0 12px;z-index:15;margin-bottom:24px;}
.subnav-inner{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.subnav-label{font-size:10.5px;font-weight:600;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;margin-right:12px;}
.subnav-link{padding:4px 10px;border-radius:var(--r-xs);font-size:12.5px;color:var(--text-muted);cursor:pointer;transition:all 0.1s;white-space:nowrap;}
.subnav-link:hover{background:var(--card-soft);color:var(--text);}
.subnav-link.active{background:var(--primary-light);color:var(--primary);font-weight:500;}

/* TYPOGRAPHY */
h1{font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.3;color:var(--text);margin-bottom:4px;}
h2{font-size:16px;font-weight:600;letter-spacing:-0.01em;line-height:1.4;color:var(--text);margin-bottom:4px;}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;}
.lead{font-size:15.5px;line-height:1.6;color:var(--text-secondary);margin-bottom:4px;}
.helper{font-size:13px;line-height:1.55;color:var(--text-muted);}

/* GUIDE */
.guide{background:var(--card-soft);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 18px;margin-bottom:20px;display:flex;gap:14px;align-items:flex-start;}
.guide-icon{width:24px;height:24px;border-radius:6px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;margin-top:1px;}
.guide-body{flex:1;font-size:13px;line-height:1.6;color:var(--text-secondary);}
.guide-body strong{color:var(--text);font-weight:600;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);}
.card-pad{padding:20px 22px;}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.card-title{font-size:13px;font-weight:600;letter-spacing:0.02em;text-transform:uppercase;color:var(--text-muted);}
.card-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;text-transform:none;letter-spacing:0;font-weight:400;}
.card-action{font-size:12.5px;color:var(--primary);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;border:1px solid transparent;transition:all 0.12s;display:inline-flex;align-items:center;gap:6px;letter-spacing:-0.005em;}
.btn-primary{background:var(--primary);color:white;box-shadow:var(--sh-1);}
.btn-primary:hover{background:var(--primary-hover);box-shadow:var(--sh-2);}
.btn-secondary{background:var(--card);color:var(--text);border-color:var(--border);}
.btn-secondary:hover{background:var(--card-soft);border-color:var(--border-hover);}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:var(--border);}
.btn-ghost:hover{background:var(--card-soft);color:var(--text);}
.btn-sm{padding:5px 12px;font-size:12.5px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

/* CHIPS */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;letter-spacing:0.02em;white-space:nowrap;}
.chip-success{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);}
.chip-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.chip-danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);}
.chip-neutral{background:var(--card-soft);color:var(--text-muted);border:1px solid var(--border);}
.chip-info{background:var(--info-bg);color:var(--info);border:1px solid var(--info-border);}
.chip-mono{font-family:var(--mono);font-size:10.5px;letter-spacing:0;text-transform:none;}
.chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.chip-success .chip-dot{background:var(--success);}
.chip-amber .chip-dot{background:var(--amber);}
.chip-danger .chip-dot{background:var(--danger);}
.chip-neutral .chip-dot{background:var(--text-dim);}

/* TABLES */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl th{font-size:10.5px;font-weight:600;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;background:var(--card-soft);padding:8px 12px;}
.tbl tbody tr:hover{background:var(--card-soft);}
.tbl tr.clickable{cursor:pointer;}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl .mono-cell{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);}

/* LADDER */
.ladder{display:inline-flex;gap:3px;align-items:center;}
.ladder-dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--border-hover);background:transparent;}
.ladder-dot.filled{background:var(--primary);border-color:var(--primary);}
.ladder-label{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);margin-left:6px;}

/* HERO */
.hero-case{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:32px 36px;margin-bottom:24px;position:relative;overflow:hidden;}
.hero-case::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--amber);opacity:0.4;}
.hero-eyebrow-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.hero-eyebrow{font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;}
.hero-question{font-size:14px;font-weight:600;color:var(--text-muted);letter-spacing:-0.005em;margin-bottom:10px;}
.hero-answer{font-size:24px;line-height:1.4;color:var(--text);letter-spacing:-0.02em;font-weight:500;margin-bottom:16px;max-width:880px;}
.hero-answer strong{font-weight:600;}
.hero-exposure{font-size:14.5px;line-height:1.65;color:var(--text-muted);margin-bottom:24px;max-width:880px;}
.hero-exposure strong{color:var(--text);font-weight:500;}
.hero-status-row{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:20px 0;margin-bottom:20px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.hero-stat{display:flex;flex-direction:column;gap:3px;}
.hero-stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);}
.hero-stat-value{font-size:13.5px;font-weight:500;color:var(--text);}
.hero-stat-value.mono{font-family:var(--mono);font-size:12.5px;}
.hero-stat-sep{color:var(--text-dim);font-size:16px;}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* PLANES */
.planes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.plane{padding:14px 16px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--card-soft);cursor:pointer;transition:all 0.12s;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:124px;position:relative;}
.plane:hover{border-color:var(--primary);background:var(--primary-light);transform:translateY(-1px);box-shadow:var(--sh-2);}
.plane-name{font-size:9.5px;font-weight:700;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;display:flex;align-items:center;gap:5px;}
.plane-indicator{width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;}
.plane-indicator.est{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);}
.plane-indicator.part{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.plane-indicator.na{background:var(--card);color:var(--text-dim);border:1px solid var(--border);}
.plane-state{font-size:12px;font-weight:600;}
.plane-state.est{color:var(--success);}
.plane-state.part{color:var(--amber);}
.plane-state.na{color:var(--text-dim);}
.plane-source{font-size:11.5px;color:var(--text-muted);line-height:1.4;margin-top:auto;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.plane-fresh{font-size:10px;color:var(--text-dim);font-family:var(--mono);padding-top:6px;border-top:1px solid var(--border);display:flex;align-items:center;gap:4px;}

/* CONSEQUENCE */
.consequence{padding:16px 18px;border:1px solid var(--border);border-radius:var(--r-sm);display:flex;align-items:flex-start;gap:14px;cursor:pointer;transition:all 0.12s;background:var(--card);width:100%;text-align:left;margin-bottom:8px;}
.consequence:hover{border-color:var(--primary);background:var(--primary-light);}
.sev-badge{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px;}
.sev-high{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);}
.sev-med{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.sev-low{background:var(--card-soft);color:var(--text-muted);border:1px solid var(--border);}
.sev-res{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);}
.consequence-body{flex:1;min-width:0;}
.consequence-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px;}
.consequence-detail{font-size:13px;color:var(--text-muted);line-height:1.55;margin-bottom:8px;}
.consequence-meta{display:flex;gap:10px;font-size:11px;color:var(--text-dim);flex-wrap:wrap;align-items:center;}
.consequence-meta .chip{font-size:10px;padding:1px 6px;}
.consequence-arrow{color:var(--text-dim);font-size:16px;flex-shrink:0;margin-top:2px;transition:transform 0.15s;}
.consequence:hover .consequence-arrow{color:var(--primary);transform:translateX(2px);}
.consequence.resolved{opacity:0.85;}
.consequence.resolved .consequence-title{color:var(--text-muted);}

/* DELTA */
.delta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.delta-stat{padding:16px 18px;background:var(--card-soft);border:1px solid var(--border);border-radius:var(--r-sm);display:flex;flex-direction:column;gap:4px;}
.delta-stat-label{font-size:10.5px;font-weight:600;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;}
.delta-stat-value{font-size:22px;font-weight:600;letter-spacing:-0.02em;}
.delta-stat-value.added{color:var(--amber);}
.delta-stat-value.resolved{color:var(--success);}
.delta-stat-value.changed{color:var(--text);}
.delta-stat-value.mono{font-family:var(--mono);font-size:14px;}
.delta-stat-detail{font-size:11.5px;color:var(--text-muted);margin-top:2px;line-height:1.4;}

/* CONTROLS */
.controls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
.control-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;cursor:pointer;transition:all 0.12s;text-align:left;display:flex;flex-direction:column;gap:8px;}
.control-card:hover{border-color:var(--primary);background:var(--primary-light);}
.control-id-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.control-id{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:0.02em;}
.control-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.4;}
.control-facets-mini{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:2px;}
.control-facet-dot{height:4px;border-radius:1px;background:var(--border-hover);}
.control-facet-dot.success{background:var(--success);}
.control-facet-dot.amber{background:var(--amber);}
.control-facet-dot.danger{background:var(--danger);}
.control-facet-dot.neutral{background:var(--text-dim);}

/* RIGHT RAIL */
.content-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start;}
.main-col{display:flex;flex-direction:column;gap:28px;min-width:0;}
.sidebar-rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:100px;}
.side-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 20px;}
.side-card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:12px;}
.next-action{background:linear-gradient(135deg,var(--primary-light) 0%,var(--card) 100%);border:1px solid var(--primary-border);}
.next-action-eyebrow{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--primary);margin-bottom:8px;}
.next-action-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.35;}
.next-action-detail{font-size:12.5px;color:var(--text-secondary);line-height:1.55;margin-bottom:14px;}
.next-action-btn{width:100%;padding:9px 12px;background:var(--primary);color:white;border-radius:8px;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.15s;}
.next-action-btn:hover{background:var(--primary-hover);}
.jobs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.job-btn{padding:12px 8px;background:var(--card-soft);border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;font-weight:500;color:var(--text);transition:all 0.12s;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;}
.job-btn:hover{border-color:var(--primary);background:var(--primary-light);}
.job-btn-icon{font-size:16px;}
.job-btn-name{font-size:11px;color:var(--text-muted);}
.usage-card{background:var(--card-soft);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;cursor:pointer;transition:all 0.12s;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px;}
.usage-card:hover{border-color:var(--primary);background:var(--primary-light);}
.usage-provider{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);font-weight:600;}
.usage-stats{display:flex;justify-content:space-between;font-size:13px;color:var(--text);}
.usage-stats strong{font-weight:600;}
.usage-asof{font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between;font-family:var(--mono);}

/* SECTION HEADER */
.section-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;}
.section-header-left{flex:1;}
.section-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:3px;}
.section-sub{font-size:13px;color:var(--text-muted);line-height:1.5;}

/* FILTER BAR */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.filter-chip{padding:4px 10px;border-radius:var(--r-sm);font-size:12px;border:1px solid var(--border);background:var(--card);color:var(--text-muted);cursor:pointer;font-weight:500;}
.filter-chip:hover{background:var(--card-soft);color:var(--text);}
.filter-chip.active{background:var(--primary-light);color:var(--primary);border-color:var(--primary-border);}

/* INSPECTOR */
.inspector-backdrop{position:fixed;inset:0;background:rgba(15,23,41,0.42);opacity:0;pointer-events:none;transition:opacity 0.22s;z-index:40;}
.inspector-backdrop.open{opacity:1;pointer-events:auto;}
.inspector{position:fixed;top:0;right:0;bottom:0;width:min(760px,calc(100vw - 40px));background:var(--card);box-shadow:var(--sh-4);transform:translateX(100%);transition:transform 0.28s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;z-index:50;}
.inspector.open{transform:translateX(0);}
.inspector-head{padding:20px 26px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
.inspector-crumb{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
.inspector-crumb .sep{color:var(--text-dim);}
.inspector-title{font-size:18px;font-weight:600;letter-spacing:-0.015em;line-height:1.35;margin-bottom:3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.inspector-sub{font-size:12.5px;color:var(--text-muted);}
.inspector-close{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-muted);flex-shrink:0;transition:all 0.12s;}
.inspector-close:hover{background:var(--card-soft);color:var(--text);}
.inspector-body{flex:1;overflow-y:auto;padding:22px 26px;}
.inspector-section{margin-bottom:24px;}
.inspector-section:last-child{margin-bottom:0;}
.inspector-section-title{font-size:10.5px;font-weight:600;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.inspector-section-title .badge{background:var(--card-soft);color:var(--text-muted);font-size:10px;padding:1px 6px;border-radius:8px;font-family:var(--mono);letter-spacing:0;text-transform:none;}
.inspector-foot{padding:14px 26px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);flex-wrap:wrap;}
.inspector-foot-info{font-size:11.5px;color:var(--text-muted);}

/* CALLOUT */
.callout{padding:14px 18px;border-radius:var(--r-sm);font-size:13px;line-height:1.55;}
.callout-info{background:var(--primary-light);border:1px solid var(--primary-border);color:var(--text);}
.callout-info strong{color:var(--primary);font-weight:600;}
.callout-warn{background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber);}
.callout-success{background:var(--success-bg);border:1px solid var(--success-border);color:var(--success);}
.callout-danger{background:var(--danger-bg);border:1px solid var(--danger-border);color:var(--danger);}

/* STATE BLOCK */
.state-block{padding:12px 14px;border-radius:var(--r-sm);display:flex;flex-direction:column;gap:4px;border:1px solid var(--border);}
.state-block.success{background:var(--success-bg);border-color:var(--success-border);}
.state-block.amber{background:var(--amber-bg);border-color:var(--amber-border);}
.state-block.danger{background:var(--danger-bg);border-color:var(--danger-border);}
.state-block.neutral{background:var(--card-soft);}
.state-block.info{background:var(--info-bg);border-color:var(--info-border);}
.state-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;}
.state-block.success .state-title{color:var(--success);}
.state-block.amber .state-title{color:var(--amber);}
.state-block.danger .state-title{color:var(--danger);}
.state-block.info .state-title{color:var(--info);}
.state-block.neutral .state-title{color:var(--text);}
.state-detail{font-size:12.5px;color:var(--text-muted);line-height:1.55;}

/* DAI */
.dai-chain{display:flex;flex-direction:column;}
.hop{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-md);padding:16px 20px;position:relative;scroll-margin-top:20px;}
.hop.pivot{border-color:var(--amber);box-shadow:0 0 0 3px rgba(181,71,8,0.08);}
.hop.pivot.danger{border-color:var(--danger);box-shadow:0 0 0 3px rgba(180,35,24,0.08);}
.hop.pulse{animation:hopPulse 1.2s ease;}
@keyframes hopPulse{0%{box-shadow:0 0 0 0 rgba(67,56,202,0.4);}70%{box-shadow:0 0 0 12px rgba(67,56,202,0);}100%{box-shadow:0 0 0 0 rgba(67,56,202,0);}}
.hop-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;}
.hop-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--card-soft);border:1px solid var(--border);}
.hop-meta{flex:1;min-width:0;}
.hop-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:1px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.hop-sub{font-size:12px;color:var(--text-muted);}
.hop-badges{display:flex;gap:6px;flex-wrap:wrap;}
.hop-means{font-size:12.5px;color:var(--text);padding:9px 12px;background:var(--card-soft);border-radius:var(--r-xs);margin-bottom:10px;line-height:1.55;}
.hop-means strong{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);display:block;margin-bottom:3px;}
.hop.pivot .hop-means{background:var(--amber-bg);}
.hop.pivot.danger .hop-means{background:var(--danger-bg);}
.hop-facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-bottom:8px;}
.hop-fact{display:flex;gap:8px;align-items:baseline;font-size:12px;}
.hop-fact-label{color:var(--text-muted);min-width:90px;flex-shrink:0;}
.hop-fact-value{color:var(--text);font-weight:500;word-break:break-word;}
.hop-fact-value.mono{font-family:var(--mono);font-size:11px;}
.hop-evidence-toggle{width:100%;padding:7px 12px;background:transparent;border:1px solid var(--border);border-radius:var(--r-xs);font-size:12px;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all 0.12s;}
.hop-evidence-toggle:hover{background:var(--card-soft);color:var(--text);}
.hop-evidence{margin-top:8px;padding:10px 12px;background:var(--card-soft);border:1px solid var(--border);border-radius:var(--r-xs);}
.ev-item{display:flex;gap:10px;font-size:12px;align-items:flex-start;margin-bottom:6px;}
.ev-item:last-child{margin-bottom:0;}
.ev-ref{font-family:var(--mono);font-size:10.5px;color:var(--primary);background:var(--primary-light);padding:1px 6px;border-radius:3px;flex-shrink:0;}
.ev-summary{color:var(--text-muted);line-height:1.5;}
.connector{padding:4px 0 4px 44px;display:flex;align-items:center;gap:12px;position:relative;min-height:44px;font-size:12px;color:var(--text-muted);}
.connector-line{position:absolute;left:21px;top:0;bottom:0;width:2px;}
.connector-line.q{background:var(--success);}
.connector-line.c{background:repeating-linear-gradient(to bottom,var(--amber) 0,var(--amber) 5px,transparent 5px,transparent 10px);}
.connector-line.p{background:repeating-linear-gradient(to bottom,var(--text-dim) 0,var(--text-dim) 3px,transparent 3px,transparent 7px);}
.connector-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--border-hover);display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;z-index:1;}
.connector:has(.q) .connector-icon{border-color:var(--success);color:var(--success);}
.connector:has(.c) .connector-icon{border-color:var(--amber);color:var(--amber);}
.connector:has(.p) .connector-icon{border-color:var(--text-dim);color:var(--text-dim);}
.connector-text{flex:1;}
.connector-main{font-weight:500;color:var(--text);}
.connector-sub{font-size:11px;color:var(--text-muted);}
.connector-dur{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);padding:1px 6px;background:var(--card);border:1px solid var(--border);border-radius:3px;}

/* DAI TABLE */
.dai-table{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
.dai-row{display:grid;grid-template-columns:130px 1fr 1fr 32px;gap:16px;padding:11px 16px;border-bottom:1px solid var(--border);align-items:center;font-size:13px;transition:background 0.1s;}
.dai-row:last-child{border-bottom:none;}
.dai-row.header{background:var(--card-soft);font-size:10.5px;font-weight:600;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;padding:8px 16px;}
.dai-row.mismatch{background:var(--danger-bg);}
.dai-row.mismatch.clickable:hover{background:#fde8e5;cursor:pointer;}
.dai-dim{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text);}
.dai-value{font-size:12.5px;color:var(--text-muted);}
.dai-value.match{color:var(--success);}
.dai-value.mismatch{color:var(--danger);font-weight:500;}
.dai-icon{text-align:right;font-weight:700;font-size:13px;}
.dai-icon.match{color:var(--success);}
.dai-icon.mismatch{color:var(--danger);}

/* FACETS */
.facet{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-md);margin-bottom:8px;overflow:hidden;border-left:3px solid var(--border);}
.facet.success{border-left-color:var(--success);}
.facet.amber{border-left-color:var(--amber);}
.facet.danger{border-left-color:var(--danger);}
.facet.neutral{border-left-color:var(--text-dim);}
.facet-head{width:100%;padding:12px 16px;text-align:left;display:flex;align-items:center;gap:12px;}
.facet-head:hover{background:var(--card-soft);}
.facet-num{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-dim);width:18px;}
.facet-icon{font-size:15px;}
.facet-label{flex:1;font-size:13.5px;font-weight:500;color:var(--text);}
.facet-state{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;}
.facet-state.success{background:var(--success-bg);color:var(--success);}
.facet-state.amber{background:var(--amber-bg);color:var(--amber);}
.facet-state.danger{background:var(--danger-bg);color:var(--danger);}
.facet-state.neutral{background:var(--card-soft);color:var(--text-muted);}
.facet-chev{color:var(--text-dim);transition:transform 0.15s;font-size:11px;}
.facet.open .facet-chev{transform:rotate(180deg);}
.facet-body{display:none;padding:0 16px 16px 46px;}
.facet.open .facet-body{display:block;}
.facet-summary{font-size:12.5px;color:var(--text-secondary);line-height:1.55;padding:10px 12px;background:var(--card-soft);border-radius:var(--r-xs);margin-bottom:12px;}
.facet-facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-bottom:12px;}
.facet-fact{display:flex;gap:8px;font-size:12px;align-items:baseline;}
.facet-fact-label{color:var(--text-muted);min-width:110px;flex-shrink:0;}
.facet-fact-value{color:var(--text);font-weight:500;}
.facet-fact-value.mono{font-family:var(--mono);font-size:11px;}
.facet-next{margin-top:10px;padding:9px 12px;background:var(--primary-light);border:1px dashed var(--primary-border);border-radius:var(--r-xs);font-size:12px;color:var(--text);line-height:1.5;}
.facet-next strong{color:var(--primary);}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,41,0.5);opacity:0;pointer-events:none;transition:opacity 0.2s;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.open{opacity:1;pointer-events:auto;}
.modal{background:var(--card);border-radius:var(--r-lg);max-width:540px;width:100%;box-shadow:var(--sh-4);transform:scale(0.96);transition:transform 0.2s;overflow:hidden;}
.modal-backdrop.open .modal{transform:scale(1);}
.modal-head{padding:22px 26px 14px;}
.modal-title{font-size:17px;font-weight:600;margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--text-muted);line-height:1.55;}
.modal-body{padding:18px 26px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:13px;line-height:1.6;}
.modal-foot{padding:14px 26px;display:flex;gap:8px;justify-content:flex-end;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:white;padding:11px 20px;border-radius:var(--r-sm);font-size:13px;z-index:100;box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:all 0.2s;max-width:520px;text-align:center;line-height:1.5;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* EMPTY */
.empty{padding:36px 24px;text-align:center;color:var(--text-muted);}
.empty-icon{font-size:32px;margin-bottom:12px;opacity:0.5;}
.empty-title{font-size:14px;font-weight:500;color:var(--text-secondary);margin-bottom:4px;}
.empty-desc{font-size:12.5px;line-height:1.55;max-width:400px;margin:0 auto;}

/* COVERAGE */
.coverage-list{display:flex;flex-direction:column;gap:8px;}
.coverage-item{padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;}
.coverage-item.success{background:var(--success-bg);border-color:var(--success-border);}
.coverage-item.amber{background:var(--amber-bg);border-color:var(--amber-border);}
.coverage-item.neutral{background:var(--card-soft);}
.coverage-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
.coverage-body{flex:1;}
.coverage-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;}
.coverage-detail{font-size:12px;color:var(--text-muted);line-height:1.5;}
.coverage-count{font-size:11px;color:var(--text-dim);font-family:var(--mono);}

/* RECEIPT */
.receipt-block{padding:14px 16px;border-radius:var(--r-sm);border:1px solid var(--border);margin-bottom:8px;}
.receipt-block strong{font-weight:600;color:var(--text);font-size:13px;}
.receipt-digest{font-family:var(--mono);font-size:11px;color:var(--text-muted);word-break:break-all;line-height:1.5;background:var(--card-soft);padding:8px 10px;border-radius:var(--r-xs);}

/* RESPONSIVE */
@media (max-width:1200px){.content-grid{grid-template-columns:minmax(0,1fr);}.sidebar-rail{position:static;display:grid;grid-template-columns:repeat(2,1fr);}}
@media (max-width:1100px){
  .app{grid-template-columns:64px 1fr;}
  .nav-item span:not(.nav-icon){display:none;}
  .nav-item{justify-content:center;}
  .nav-group-title{display:none;}
  .nav-badge{display:none;}
  .topbar-search{width:120px;}
  .planes{grid-template-columns:repeat(3,1fr);}
}
@media (max-width:900px){
  .app{grid-template-columns:0 1fr;grid-template-areas:"topbar topbar" ". main";}
  .sidebar{display:none;}
  .main-inner{padding:0 16px 60px;}
  .planes{grid-template-columns:repeat(2,1fr);}
  .hero-case{padding:24px 20px;}
  .hero-answer{font-size:20px;}
  .hop-facts,.facet-facts{grid-template-columns:1fr;}
  .dai-row{grid-template-columns:100px 1fr 1fr 28px;gap:8px;padding:8px 10px;font-size:12px;}
  .inspector{width:100vw;}
  .topbar-search,.dev-chip{display:none;}
  .delta-grid{grid-template-columns:1fr 1fr;}
  .sidebar-rail{grid-template-columns:1fr;}
  .subnav{overflow-x:auto;white-space:nowrap;}
  .subnav::-webkit-scrollbar{display:none;}
}
@media (max-width:600px){
  .basis-control{display:none;}
  .topbar-org span{display:none;}
  .topbar{padding:0 12px;gap:8px;}
  .hero-answer{font-size:18px;}
  .delta-grid{grid-template-columns:1fr;}
  .hero-status-row{gap:14px;}
  .hero-stat-sep{display:none;}
  .controls-grid{grid-template-columns:1fr;}
}

/* PRINT */
@media print{
  .topbar,.sidebar,.subnav,.hero-actions,.inspector-backdrop,.inspector,.modal-backdrop,.toast,.next-action-btn{display:none !important;}
  body{overflow:visible;background:white;}
  .app{display:block;height:auto;}
  .main{overflow:visible;}
  .main-inner{max-width:none;padding:0;}
  .card,.hero-case{box-shadow:none;border-color:#ccc;page-break-inside:avoid;}
  .consequence:hover,.plane:hover{background:initial;}
}
</style>
</head>

<div class="app">

  <!-- TOPBAR -->
  <header class="topbar">

  <!-- SIDEBAR -->
  <nav class="sidebar">

    <div class="nav-group">
      <div class="nav-group-title">Understand</div>
      <a class="nav-item" onclick="toast('Overview — separate screen')"><span class="nav-icon">◎</span><span>Overview</span></a>
      <a class="nav-item" onclick="toast('AI Estate — separate screen')"><span class="nav-icon">▦</span><span>AI Estate</span></a>
      <a class="nav-item active"><span class="nav-icon">▣</span><span>Assurance Case</span><span class="nav-badge" id="nav-badge">4</span></a>
      <a class="nav-item" onclick="toast('Action Topology — separate screen')"><span class="nav-icon">❋</span><span>Action Topology</span></a>
    </div>
    <div class="nav-group">
      <div class="nav-group-title">Assure</div>
      <a class="nav-item" onclick="toast('Evaluate — separate screen')"><span class="nav-icon">✓</span><span>Evaluate</span></a>
      <a class="nav-item" onclick="toast('Sources — separate screen')"><span class="nav-icon">⬚</span><span>Sources</span></a>
      <a class="nav-item" onclick="toast('Reports — separate screen')"><span class="nav-icon">◫</span><span>Reports</span></a>
    </div>
    <div class="nav-group">
      <div class="nav-group-title">Govern & Operate</div>
      <a class="nav-item" onclick="toast('Controls — separate screen')"><span class="nav-icon">⌘</span><span>Controls</span></a>
      <a class="nav-item" onclick="toast('Governance — separate screen')"><span class="nav-icon">⚖</span><span>Governance</span></a>
      <a class="nav-item" onclick="toast('Monitoring — separate screen')"><span class="nav-icon">◉</span><span>Monitoring</span></a>
      <a class="nav-item" onclick="toast('Usage & Cost — separate screen')"><span class="nav-icon">◈</span><span>Usage & Cost</span></a>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main" id="main">
    <div class="main-inner" id="main-inner">
      <!-- rendered by JS -->
    </div>
  </main>
</div>

<!-- INSPECTOR -->
<div class="inspector-backdrop" id="inspector-backdrop" onclick="closeInspector()"></div>
<aside class="inspector" id="inspector" role="dialog" aria-modal="true">
  <div class="inspector-head">
    <div>
      <div class="inspector-crumb" id="inspector-crumb"></div>
      <div class="inspector-title" id="inspector-title"></div>
      <div class="inspector-sub" id="inspector-sub"></div>
    </div>
    <button class="inspector-close" onclick="closeInspector()" aria-label="Close">×</button>
  </div>
  <div class="inspector-body" id="inspector-body"></div>
  <div class="inspector-foot" id="inspector-foot"></div>
</aside>

<!-- MODAL -->
<div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="modal-title"></div><div class="modal-sub" id="modal-sub"></div></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ladder(count,max=7){let h='<span class="ladder" aria-hidden="true">';for(let i=0;i<max;i++)h+=`<span class="ladder-dot ${i<=count?'filled':''}"></span>`;return h+'</span>';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3200);}

function setBasis(b){
  state.basis=b;
  document.querySelectorAll('.basis-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.basis===b));
  document.getElementById('basis-asof').textContent=b==='current'?'14:22 UTC':'10:42 UTC';
  updateHash();
  render();
}

function setPersona(p){
  state.persona=p;
  updateHash();
  render();
}

function cycleSystem(){
  const ids=Object.keys(SYSTEMS);
  const i=ids.indexOf(state.systemId);
  state.systemId=ids[(i+1)%ids.length];
  updateHash();
  render();
}

function selectSystem(id){
  state.systemId=id;
  updateHash();
  render();
  document.getElementById('main').scrollTop=0;
}

function updateHash(){
  const params=new URLSearchParams();
  params.set('sys',state.systemId);
  params.set('basis',state.basis);
  params.set('persona',state.persona);
  location.hash=params.toString();
}

function readHash(){
  const hash=location.hash.replace('#','');
  if(!hash)return;
  const p=new URLSearchParams(hash);
  if(p.get('sys')&&SYSTEMS[p.get('sys')])state.systemId=p.get('sys');
  if(p.get('basis')==='current'||p.get('basis')==='evaluation')state.basis=p.get('basis');
  if(p.get('persona')&&PERSONAS[p.get('persona')])state.persona=p.get('persona');
}

function render(){
  const el=document.getElementById('main-inner');
  el.innerHTML=renderScreen();
  document.getElementById('sys-name').textContent=currentSystem().name;
  document.getElementById('sys-env').textContent=currentSystem().env;
  document.getElementById('nav-badge').textContent=currentSystem().attention;
  document.getElementById('persona-select').value=state.persona;
  document.querySelectorAll('.basis-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.basis===state.basis));
  document.getElementById('basis-asof').textContent=state.basis==='current'?'14:22 UTC':'10:42 UTC';
  bindEvents();
}

function bindEvents(){
  document.querySelectorAll('[data-facet]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.facet;
      if(state.openFacets.has(id))state.openFacets.delete(id);else state.openFacets.add(id);
      render();
    });
  });
  document.querySelectorAll('[data-hop]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.hop;
      if(state.openHops.has(id))state.openHops.delete(id);else state.openHops.add(id);
      renderInspector();
    });
  });
}

function scrollToSection(id){

let currentInspectorState=null;

function openInspector(kind,opts={}){
  currentInspectorState={kind,opts};
  renderInspector();
  document.getElementById('inspector').classList.add('open');
  document.getElementById('inspector-backdrop').classList.add('open');
}

function openDaiInspector(scenario){
  state.daiScenario=scenario||'widened';
  openInspector('dai',{scenario:state.daiScenario});
}

function openControlInspector(scenario){
  openInspector('control',{scenario:scenario||'mixed'});
}

function openCoverageInspector(plane){
  openInspector('coverage',{plane:plane||null});
}

function openReceiptInspector(){
  const lastEval=currentSystem().lastEval;
  const receipt=RECEIPTS.find(r=>r.system===currentSystem().name)||RECEIPTS[0];
  state.activeReceipt=receipt.id;
  openInspector('receipt',{receiptId:receipt.id});
}

function closeInspector(){
  document.getElementById('inspector').classList.remove('open');
  document.getElementById('inspector-backdrop').classList.remove('open');
  currentInspectorState=null;
}

function renderInspector(){
  if(!currentInspectorState)return;
  const {kind,opts}=currentInspectorState;
  const result=({
    dai:renderInspectorDai,
    control:renderInspectorControl,
    coverage:renderInspectorCoverage,
    navigator:renderInspectorNavigator,
    usage:renderInspectorUsage,
    receipt:renderInspectorReceipt
  }[kind]||renderInspectorFallback)(opts);
  document.getElementById('inspector-crumb').innerHTML=result.crumb;
  document.getElementById('inspector-title').innerHTML=result.title;
  document.getElementById('inspector-sub').textContent=result.sub;
  document.getElementById('inspector-body').innerHTML=result.body;
  document.getElementById('inspector-foot').innerHTML=result.foot||'';
  bindInspectorEvents();
}

function bindInspectorEvents(){
  document.querySelectorAll('[data-hop]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.hop;
      if(state.openHops.has(id))state.openHops.delete(id);else state.openHops.add(id);
      renderInspector();
    });
  });
}

function renderInspectorFallback(){
  return {crumb:'Preview',title:'Preview only',sub:'',body:'<p>This drilldown ships in a later stage.</p>',foot:''};
}

function renderInspectorDai(opts){
  const sc=DAI_SCENARIOS[opts.scenario||'widened'];
  const chainHtml=sc.hops.map((hop,i)=>{
    const isPivot=sc.pivot===i;
    const hopId='dai-hop-'+i;
    const open=state.openHops.has(hopId);
    return `
      <div class="hop ${isPivot?'pivot':''} ${sc.tone==='danger'?'danger':''}" id="${hopId}">
        <div class="hop-head">
          <div class="hop-icon">${hop.icon}</div>
          <div class="hop-meta">
            <div class="hop-title">${esc(hop.title)} ${isPivot?'<span class="chip chip-amber" style="font-size:9px;">PIVOT</span>':''}</div>
            <div class="hop-sub">${esc(hop.sub)}</div>
          </div>
          <div class="hop-badges"><span class="chip chip-${hop.tone} chip-mono">${esc(hop.state)}</span></div>
        </div>
        <div class="hop-means"><strong>What this means</strong>${esc(hop.means)}</div>
        <div class="hop-facts">
          ${hop.facts.map(f=>`<div class="hop-fact"><span class="hop-fact-label">${esc(f.l)}</span><span class="hop-fact-value ${f.m?'mono':''}">${esc(f.v)}</span></div>`).join('')}
        </div>
        ${hop.evidence.length?`
          <button class="hop-evidence-toggle" data-hop="${hopId}">
            <span>${hop.evidence.length} evidence reference${hop.evidence.length===1?'':'s'}</span>
            <span>${open?'▲':'▼'}</span>
          </button>
          ${open?`<div class="hop-evidence">${hop.evidence.map(ev=>`<div class="ev-item"><span class="ev-ref">${esc(ev.ref)}</span><span class="ev-summary">${esc(ev.s)}</span></div>`).join('')}</div>`:''}
        `:`<div style="padding:10px 12px;border:1px dashed var(--border);border-radius:var(--r-xs);font-size:11.5px;color:var(--text-muted);font-style:italic;">Awaiting readback — evidence will attach once the next scheduled pull completes.</div>`}
      </div>
      ${i<sc.hops.length-1?`
        <div class="connector">
          <div class="connector-line ${sc.links[i].tone}"></div>
          <div class="connector-icon">${sc.links[i].tone==='q'?'✓':sc.links[i].tone==='c'?'◇':'⋯'}</div>
          <div class="connector-text">
            <div class="connector-main">${esc(sc.links[i].main)}</div>
            <div class="connector-sub">${esc(sc.links[i].sub)}</div>
          </div>
          <div class="connector-dur">${esc(sc.links[i].dur)}</div>
        </div>
      `:''}
    `;
  }).join('');

  const daiHtml=`
    <div class="dai-table">
      <div class="dai-row header"><div>Dimension</div><div>Parent scope</div><div>Child scope</div><div></div></div>
      ${sc.dai.map(d=>`
        <div class="dai-row ${d.match?'':'mismatch'} ${!d.match&&d.hop!==undefined?'clickable':''}" ${!d.match&&d.hop!==undefined?`onclick="document.getElementById('dai-hop-${d.hop}').scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('dai-hop-${d.hop}').classList.add('pulse');setTimeout(()=>document.getElementById('dai-hop-${d.hop}').classList.remove('pulse'),1300)"`:''}>
          <div class="dai-dim">${d.d}</div>
          <div class="dai-value ${d.match?'match':'mismatch'}">${esc(d.p)}</div>
          <div class="dai-value ${d.match?'match':'mismatch'}">${esc(d.c)}</div>
          <div class="dai-icon ${d.match?'match':'mismatch'}">${d.match?'✓':'⚠'}</div>
        </div>
      `).join('')}
    </div>
  `;

  const unverifiedHtml=sc.unverified.length?`
    <div class="inspector-section">
      <div class="inspector-section-title">What is unverified <span class="badge">${sc.unverified.length}</span></div>
      ${sc.unverified.map(u=>`
        <div class="state-block ${sc.tone==='danger'?'danger':'amber'}" style="margin-bottom:8px;">
          <div class="state-title"><span>!</span>${esc(u.title)}</div>
          <div class="state-detail">${esc(u.detail)}</div>
        </div>
      `).join('')}
    </div>
  `:`
    <div class="inspector-section">
      <div class="inspector-section-title">What is unverified</div>
      <div class="state-block success">
        <div class="state-title"><span>✓</span>All steps qualified</div>
        <div class="state-detail">No unverified steps in this chain. The evidence basis is complete and frozen.</div>
      </div>
    </div>
  `;

  const scenarioSwitcher=`
    <div class="inspector-section">
      <div class="inspector-section-title">Switch scenario (synthetic)</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${Object.entries(DAI_SCENARIOS).map(([id,s])=>`<button class="filter-chip ${state.daiScenario===id?'active':''}" onclick="state.daiScenario='${id}';currentInspectorState={kind:'dai',opts:{scenario:'${id}'}};renderInspector()">${esc(s.label)}</button>`).join('')}
      </div>
    </div>
  `;

  return {
    crumb:`Support Agent v2 <span class="sep">›</span> Agent / Action <span class="sep">›</span> Delegated actions`,
    title:`Delegated action chain · ${sc.label}`,
    sub:`${sc.chainId} · ${sc.integrity} · ${sc.duration}`,
    body:`
      <div class="callout callout-${sc.tone==='success'?'success':sc.tone==='danger'?'danger':'info'}" style="margin-bottom:18px;">
        <strong>${sc.tone==='success'?'✓':'⚠'} ${esc(sc.headline)}</strong>
        <div class="mono" style="margin-top:6px;font-size:11px;">${esc(sc.stateLabel)}</div>
      </div>
      ${scenarioSwitcher}
      <div class="inspector-section">
        <div class="inspector-section-title">Chain</div>
        <div class="dai-chain">${chainHtml}</div>
      </div>
      <div class="inspector-section">
        <div class="inspector-section-title">DAI nine-dimension comparison <span class="badge">${sc.dai.filter(d=>d.match).length}/9 match</span></div>
        ${daiHtml}
      </div>
      ${unverifiedHtml}
    `,
    foot:`<div class="inspector-foot-info">Synthetic fixture · not a live HAIEC assessment</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="toast('Receipt export — would produce a frozen PDF in production')">Export receipt</button>
        <button class="btn btn-primary btn-sm" onclick="closeInspector()">Done</button>
      </div>`
  };
}

function renderInspectorControl(opts){
  const sc=CONTROL_SCENARIOS[opts.scenario||'mixed'];
  return {
    crumb:`Support Agent v2 <span class="sep">›</span> Controls <span class="sep">›</span> ${sc.id}`,
    title:`${sc.id} · ${sc.title}`,
    sub:sc.verdictLabel,
    body:`
      <div class="callout callout-info" style="margin-bottom:18px;">
        <strong>Each facet is qualified independently.</strong> A control with ${sc.qualified}/${sc.facets.length} facets qualified is not "${Math.round(sc.qualified/sc.facets.length*100)}% passed" — it is in a specific operational state that depends on which facets.
      </div>
      ${sc.facets.map((f,i)=>`
        <div class="facet ${f.tone} open" style="margin-bottom:8px;">
          <div class="facet-head">
            <span class="facet-num">${String(i+1).padStart(2,'0')}</span>
            <span class="facet-icon">${f.icon}</span>
            <span class="facet-label">${esc(f.label)}</span>
            <span class="facet-state ${f.tone}">${esc(f.state)}</span>
          </div>
          <div class="facet-body">
            <div class="facet-summary">${esc(f.summary)}</div>
            <div class="facet-facts">${f.facts.map(x=>`<div class="facet-fact"><span class="facet-fact-label">${esc(x.l)}</span><span class="facet-fact-value ${x.m?'mono':''}">${esc(x.v)}</span></div>`).join('')}</div>
            ${f.evidence&&f.evidence.length?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">${f.evidence.map(ev=>`<div class="ev-item"><span class="ev-ref">${esc(ev.ref)}</span><span class="ev-summary">${esc(ev.s)}</span></div>`).join('')}</div>`:''}
            ${f.next?`<div class="facet-next"><strong>Next step:</strong> ${esc(f.next.text)}</div>`:''}
          </div>
        </div>
      `).join('')}
    `,
    foot:`<div class="inspector-foot-info">${sc.qualified}/${sc.facets.length} facets qualified</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="toast('Open config — requires authenticated write')">Open config</button>
        <button class="btn btn-primary btn-sm" onclick="closeInspector()">Done</button>
      </div>`
  };
}

function renderInspectorCoverage(opts){
  return {
    crumb:`Support Agent v2 <span class="sep">›</span> Assurance Case <span class="sep">›</span> Detection coverage`,
    title:`Detection coverage${opts.plane?' · '+opts.plane:''}`,
    sub:'What was analyzed in eval-2f4a-9d3b, per analyzer',
    body:`
      <div class="callout callout-info" style="margin-bottom:18px;">
        <strong>Coverage differs by source mode.</strong> A static rule existing in another analyzer does not prove this path exercises it. Missing source category ≠ clean result.
      </div>
      <div class="inspector-section">
        <div class="inspector-section-title">Facets in this evaluation</div>
        <div class="coverage-list">
          ${COVERAGE_FACETS.map(f=>`
            <div class="coverage-item ${f.state}">
              <div class="coverage-icon">${f.icon}</div>
              <div class="coverage-body">
                <div class="coverage-title">${esc(f.name)}</div>
                <div class="coverage-detail">${esc(f.detail)}</div>
              </div>
              <div class="coverage-count">${esc(f.count)}</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="inspector-section">
        <div class="inspector-section-title">What this does not establish</div>
        <div class="state-block amber">
          <div class="state-title"><span>!</span>Runtime empirical results</div>
          <div class="state-detail">Runtime attack simulation did not run in this evaluation. It is opt-in and requires authorized endpoint access.</div>
        </div>
      </div>
    `,
    foot:`<div class="inspector-foot-info">Per-scan coverage · 14/16 analyzers ran</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="closeInspector();openInspector('navigator')">+ Add source</button>
        <button class="btn btn-primary btn-sm" onclick="closeInspector()">Done</button>
      </div>`
  };
}

function renderInspectorNavigator(opts){
  const sys=currentSystem();
  const sources=[
    {icon:'📊',name:'Runtime traces',detail:'OTLP or typed JSONL · strengthens OBSERVED'},
    {icon:'🔑',name:'AWS IAM export',detail:'Live observer or JSON · strengthens EFFECTIVELY_GRANTED'},
    {icon:'📁',name:'CycloneDX SBOM',detail:'JSON 1.4–1.6 · adds supply-chain context'},
    {icon:'🧪',name:'Runtime endpoint test',detail:'Authorized endpoint · BETA'}
  ];
  return {
    crumb:`Support Agent v2 <span class="sep">›</span> Evidence`,
    title:'Add evidence to strengthen this assessment',
    sub:`Currently at ${sys.ladderLabel} · ${sys.planes.filter(p=>p.state==='est').length}/5 planes established`,
    body:`
      <div class="callout callout-info" style="margin-bottom:18px;">
        <strong>Every source qualifies differently.</strong> Pick the sources you have. HAIEC will show the exact ladder climb before you commit — no source is required.
      </div>
      <div class="inspector-section">
        <div class="inspector-section-title">Recommended for this system</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${sources.map(s=>`
            <div style="padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-sm);display:flex;align-items:center;gap:12px;">
              <span style="font-size:20px;">${s.icon}</span>
              <div style="flex:1;">
                <div style="font-size:13px;font-weight:500;color:var(--text);">${esc(s.name)}</div>
                <div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">${esc(s.detail)}</div>
              </div>
              <button class="btn btn-secondary btn-sm" onclick="toast('Connect ${esc(s.name)} — preview only. Real connection requires authenticated exchange.')">Add</button>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="inspector-section">
        <div class="inspector-section-title">Source packages</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${[
            {name:'Static starter',desc:'Source code + SBOM · reaches ASSURANCE_EVALUATED'},
            {name:'Runtime first',desc:'OTLP traces + logs · completes OBSERVED'},
            {name:'Authority first',desc:'Policy + IAM + Delegation · completes POLICY_AUTHORIZED and EFFECTIVELY_GRANTED'}
          ].map(p=>`
            <button class="filter-chip" style="text-align:left;padding:10px 12px;" onclick="toast('Package preview — would pre-select ${esc(p.name)} sources')">
              <div style="font-weight:600;color:var(--text);margin-bottom:2px;">${esc(p.name)}</div>
              <div style="font-size:11.5px;color:var(--text-muted);font-weight:400;">${esc(p.desc)}</div>
            </button>
          `).join('')}
        </div>
      </div>
    `,
    foot:`<div class="inspector-foot-info">Synthetic preview · no source is actually connected</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="closeInspector()">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="closeInspector();toast('Preview only — no assessment executed')">Preview assessment</button>
      </div>`
  };
}

function renderInspectorUsage(opts){
  return {
    crumb:`Support Agent v2 <span class="sep">›</span> Usage & Cost`,
    title:'Provider usage & cost',
    sub:'An independent input class — separate from IAM, telemetry or evaluation verdicts',
    body:`
      <div class="callout callout-info" style="margin-bottom:18px;">
        <strong>What usage is and isn't.</strong> Provider usage establishes cost and (sometimes) token consumption. It does not establish IAM authority, individual agent behavior, or target effect.
      </div>
      ${Object.values(PROVIDERS).map(p=>`
        <div class="inspector-section">
          <div class="inspector-section-title">${esc(p.name)} · ${esc(p.model)}</div>
          <div class="state-block ${p.tokensKnown?'info':'amber'}">
            <div class="state-title"><span>${p.tokensKnown?'◈':'◐'}</span>${p.tokensKnown?`${esc(p.tokens)} tokens`:'Token count unavailable'}</div>
            <div class="state-detail">${p.tokensKnown?`Cost: ${esc(p.cost)} · ${esc(p.asOf)}`:`Cost: ${esc(p.cost)} · ${esc(p.asOf)}. The provider admin API did not return token counts for this window. This is not zero — it is unknown.`}</div>
          </div>
          <div style="margin-top:10px;font-size:12px;color:var(--text-muted);line-height:1.55;">
            <div><strong style="color:var(--text);">Sync:</strong> ${esc(p.sync)}</div>
            <div style="margin-top:4px;"><strong style="color:var(--text);">Attribution:</strong> ${esc(p.attribution)}</div>
            <div style="margin-top:4px;"><strong style="color:var(--text);">Data source:</strong> <span class="mono">${esc(p.dataSource)}</span></div>
          </div>
        </div>
      `).join('')}
      <div class="inspector-section">
        <div class="inspector-section-title">What this does not establish</div>
        <div class="state-block neutral">
          <div class="state-detail">Provider usage does not establish IAM authority, individual agent behavior, delegated authority, target effect for any action, or any security verdict.</div>
        </div>
      </div>
    `,
    foot:`<div class="inspector-foot-info">Independent input class · not a security verdict</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="toast('Sync preview — real sync requires authenticated admin API call')">Preview sync</button>
        <button class="btn btn-primary btn-sm" onclick="closeInspector()">Done</button>
      </div>`
  };
}

function renderInspectorReceipt(opts){
  const r=RECEIPTS.find(x=>x.id===opts.receiptId)||RECEIPTS[0];
  return {
    crumb:`Reports <span class="sep">›</span> ${r.id}`,
    title:`Assurance Receipt · ${r.id}`,
    sub:`${r.system} · ${r.asOf} · ${r.disposition}`,
    body:`
      <div class="callout callout-info" style="margin-bottom:18px;">
        <strong>This is a frozen receipt.</strong> The digest below identifies the exact evidence basis that was evaluated. Changing any byte of the underlying evidence would invalidate this digest.
      </div>
      <div class="inspector-section">
        <div class="inspector-section-title">Receipt identity</div>
        <div class="facet-facts">
          <div class="facet-fact"><span class="facet-fact-label">Receipt</span><span class="facet-fact-value mono">${esc(r.id)}</span></div>
          <div class="facet-fact"><span class="facet-fact-label">Issued to</span><span class="facet-fact-value mono">${esc(r.issuedTo)}</span></div>
        </div>
        <div style="margin-top:10px;">
          <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:4px;">Digest</div>
          <div class="receipt-digest">${esc(r.digest)}</div>
        </div>
      </div>
      <div class="inspector-section">
        <div class="inspector-section-title">Evidence sources <span class="badge">${r.sources.length}</span></div>
        ${r.sources.map(s=>`<div class="state-block success" style="margin-bottom:6px;"><div class="state-title"><span>✓</span>${esc(s.name)}</div><div class="state-detail">${esc(s.scope)}</div></div>`).join('')}
      </div>
      ${r.missing.length?`
        <div class="inspector-section">
          <div class="inspector-section-title">Missing evidence <span class="badge">${r.missing.length}</span></div>
          ${r.missing.map(m=>`<div class="state-block amber" style="margin-bottom:6px;"><div class="state-title"><span>◐</span>${esc(m.name)}</div><div class="state-detail">${esc(m.reason)}</div></div>`).join('')}
        </div>
      `:''}
      <div class="inspector-section">
        <div class="inspector-section-title">Human review attestations</div>
        ${r.attestations.map(a=>`<div class="state-block info" style="margin-bottom:6px;"><div class="state-title"><span>✍</span>${esc(a.by)}</div><div class="state-detail">${esc(a.attests)} · ${esc(a.at)}</div></div>`).join('')}
        <div class="callout callout-warn" style="margin-top:10px;font-size:12px;">
          <strong>Review ≠ verification.</strong> These signatures attest to review of the evidence basis. They are not a technical verification of the systems evaluated.
        </div>
      </div>
      <div class="inspector-section">
        <div class="inspector-section-title">Framework mappings <span class="badge">context only</span></div>
        ${r.frameworks.map(f=>`
          <div class="receipt-block">
            <strong>${esc(f.name)}</strong>
            <div style="font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-top:2px;">${esc(f.ref)}</div>
            <div style="font-size:11.5px;color:var(--text-dim);font-style:italic;margin-top:3px;">${esc(f.note)}</div>
          </div>
        `).join('')}
      </div>
    `,
    foot:`
      <div class="inspector-foot-info">Frozen · ${esc(r.asOf)}</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="toast('Verify — would recompute digest in production')">Verify digest</button>
        <button class="btn btn-ghost btn-sm" onclick="toast('Export PDF — would produce a signed receipt in production')">Export PDF</button>
        <button class="btn btn-primary btn-sm" onclick="closeInspector()">Done</button>
      </div>`
  };
}

/* ═══════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════ */

function previewReevaluation(){
  openModal({
    title:'Re-evaluate this system?',
    sub:'This is a preview. In production, re-evaluation would run the HAIEC Assurance Engine against currently qualified sources and produce a new frozen snapshot.',
    body:`
      <div style="font-size:13px;">
        <strong>Sources that would be evaluated:</strong>
        <ul style="padding-left:18px;line-height:1.6;margin-top:6px;">
          <li>GitHub App · main branch (2h ago)</li>
          <li>AWS IAM observer (6h ago — stale)</li>
          <li>OTLP collector (12m ago)</li>
          <li>SBOM source (1h ago)</li>
        </ul>
        <div style="padding-top:10px;border-top:1px solid var(--border);color:var(--text-muted);font-size:12px;margin-top:10px;">
          <strong>Note:</strong> A stale IAM source would limit EFFECTIVELY_GRANTED qualification. Re-evaluation is not a fix — it's a fresh read of what's already connected.
        </div>
      </div>
    `,
    buttons:[
      {label:'Cancel',style:'ghost',action:closeModal},
      {label:'Preview only — not executed',style:'primary',disabled:true}
    ]
  });
}

function openModal({title,sub,body,buttons}){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-sub').textContent=sub;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-foot').innerHTML=buttons.map(b=>`<button class="btn btn-${b.style==='primary'?'primary':b.style==='ghost'?'ghost':'secondary'}" ${b.disabled?'disabled style="opacity:0.5;cursor:not-allowed;"':''} onclick="${b.disabled?'':(b.action===closeModal?'closeModal()':b.action)}">${esc(b.label)}</button>`).join('');
  document.getElementById('modal-backdrop').classList.add('open');
}

function closeModal(){
  document.getElementById('modal-backdrop').classList.remove('open');
}

/* ═══════════════════════════════════════════════
   KEYBOARD
   ═══════════════════════════════════════════════ */

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('inspector').classList.contains('open'))closeInspector();
    else if(document.getElementById('modal-backdrop').classList.contains('open'))closeModal();
  }
});

   INIT
   ═══════════════════════════════════════════════ */

(function init(){
  readHash();
  document.getElementById('persona-select').value=state.persona;
  render();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAIEC — Unified Product UX Atlas</title>
<style>
:root {
  --bg: #FAFBFC; --card: #FFFFFF; --card-soft: #F5F7FA;
  --border: #E7E9EE; --border-hover: #D0D4DD; --border-strong: #B8BFCC;
  --text: #0F1729; --text-secondary: #414A5E; --text-muted: #667085; --text-dim: #98A2B3;
  --primary: #4338CA; --primary-hover: #3730A3; --primary-light: #EEF2FF; --primary-border: #C7D2FE;
  --primary-ring: rgba(67,56,202,0.12);
  --success: #067647; --success-bg: #ECFDF3; --success-border: #ABEFC6;
  --amber: #B54708; --amber-bg: #FFFAEB; --amber-border: #FEDF89;
  --danger: #B42318; --danger-bg: #FEF3F2; --danger-border: #FECDCA;
  --info: #175CD3; --info-bg: #EFF8FF; --info-border: #B2DDFF;
  --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px;
  --sh-1: 0 1px 2px rgba(16,24,40,0.04);
  --sh-2: 0 2px 6px rgba(16,24,40,0.06), 0 1px 2px rgba(16,24,40,0.04);
  --sh-3: 0 8px 24px rgba(16,24,40,0.08);
  --sh-4: 0 24px 56px rgba(16,24,40,0.18);
  --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--sans); font-size: 14.5px; line-height: 1.55; color: var(--text);
  background: var(--bg); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow: hidden; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 0.92em; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 5px; border: 2px solid var(--bg); }

/* SHELL */
.app { display: grid; grid-template-columns: 248px 1fr; grid-template-rows: 56px 1fr; height: 100vh; grid-template-areas: "topbar topbar" "sidebar main"; }
.topbar { grid-area: topbar; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: var(--card); border-bottom: 1px solid var(--border); z-index: 30; }
.topbar-org { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 13px; font-weight: 500; background: var(--card); cursor: pointer; }
.topbar-org:hover { background: var(--card-soft); }
.org-mark { width: 20px; height: 20px; border-radius: 5px; background: linear-gradient(135deg, #4338CA, #6366F1); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; letter-spacing: -0.02em; }
.topbar-sep { width: 1px; height: 20px; background: var(--border); }
.topbar-system { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 8px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 13px; background: var(--card); cursor: pointer; }
.topbar-system:hover { background: var(--card-soft); }
.sys-name { font-weight: 500; color: var(--text); }
.sys-env { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.synthetic-chip { font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 5px; background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); letter-spacing: 0.02em; text-transform: uppercase; }
.basis-control { display: flex; align-items: center; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; background: var(--card); }
.basis-btn { padding: 5px 12px; font-size: 12px; font-weight: 500; color: var(--text-muted); }
.basis-btn.active { background: var(--text); color: white; }
.basis-asof { padding: 0 10px; font-size: 11px; color: var(--text-muted); font-family: var(--mono); border-left: 1px solid var(--border); background: var(--card); }
.persona-select { padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 12px; background: var(--card); color: var(--text-secondary); cursor: pointer; }
.topbar-search { width: 200px; padding: 5px 10px 5px 28px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 12.5px; background: var(--card); color: var(--text); }
.topbar-search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); }
.search-wrap { position: relative; }
.search-wrap::before { content: '⌕'; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 14px; pointer-events: none; }
.dev-chip { padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 11.5px; font-family: var(--mono); color: var(--text-secondary); background: var(--card); font-weight: 500; }
.dev-chip:hover { background: var(--card-soft); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; cursor: pointer; }

/* SIDEBAR */
.sidebar { grid-area: sidebar; background: var(--card); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 8px 20px; }
.nav-group { margin-bottom: 16px; }
.nav-group-title { padding: 8px 12px 4px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-dim); text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin: 1px 0; border-radius: var(--r-sm); font-size: 13.5px; color: var(--text-secondary); cursor: pointer; transition: all 0.1s; text-decoration: none; }
.nav-item:hover { background: var(--card-soft); color: var(--text); text-decoration: none; }
.nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 500; }
.nav-icon { width: 16px; text-align: center; font-size: 13px; flex-shrink: 0; opacity: 0.75; }
.nav-item.active .nav-icon { opacity: 1; }
.nav-badge { margin-left: auto; font-size: 10.5px; padding: 1px 6px; border-radius: 8px; background: var(--amber-bg); color: var(--amber); font-weight: 600; }

/* MAIN */
.main { grid-area: main; overflow-y: auto; background: var(--bg); position: relative; }
.main-inner { max-width: 1280px; margin: 0 auto; padding: 28px 36px 80px; }
.main-inner.wide { max-width: 1440px; }
.main-inner.narrow { max-width: 900px; }

/* TYPOGRAPHY */
h1.display { font-size: 32px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.15; color: var(--text); margin-bottom: 8px; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.3; color: var(--text); margin-bottom: 4px; }
h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.4; color: var(--text); margin-bottom: 4px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
.lead { font-size: 15.5px; line-height: 1.6; color: var(--text-secondary); margin-bottom: 4px; }
.helper { font-size: 13px; line-height: 1.55; color: var(--text-muted); }

/* GUIDE */
.guide { background: var(--card-soft); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px 18px; margin-bottom: 24px; display: flex; gap: 14px; align-items: flex-start; }
.guide-icon { width: 24px; height: 24px; border-radius: 6px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
.guide-body { flex: 1; font-size: 13px; line-height: 1.6; color: var(--text-secondary); }
.guide-body strong { color: var(--text); font-weight: 600; }

/* CARDS */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); }
.card-pad { padding: 20px 22px; }
.card-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.card-title { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: var(--text-muted); }
.card-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; text-transform: none; letter-spacing: 0; font-weight: 400; }
.card-action { font-size: 12.5px; color: var(--primary); font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* BUTTONS */
.btn { padding: 8px 16px; border-radius: var(--r-sm); font-size: 13.5px; font-weight: 500; border: 1px solid transparent; transition: all 0.12s; display: inline-flex; align-items: center; gap: 6px; letter-spacing: -0.005em; }
.btn-primary { background: var(--primary); color: white; box-shadow: var(--sh-1); }
.btn-primary:hover { background: var(--primary-hover); box-shadow: var(--sh-2); }
.btn-secondary { background: var(--card); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--card-soft); border-color: var(--border-hover); }
.btn-ghost { background: transparent; color: var(--text-muted); border-color: var(--border); }
.btn-ghost:hover { background: var(--card-soft); color: var(--text); }
.btn-sm { padding: 5px 12px; font-size: 12.5px; }

/* CHIPS */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 5px; letter-spacing: 0.02em; white-space: nowrap; }
.chip-success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
.chip-amber { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
.chip-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
.chip-neutral { background: var(--card-soft); color: var(--text-muted); border: 1px solid var(--border); }
.chip-info { background: var(--info-bg); color: var(--info); border: 1px solid var(--info-border); }
.chip-mono { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0; text-transform: none; }

/* TABLES */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl th { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-dim); text-transform: uppercase; background: var(--card-soft); padding: 8px 12px; }
.tbl tbody tr:hover { background: var(--card-soft); }
.tbl tr.clickable { cursor: pointer; }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl .mono-cell { font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); }

/* LADDER */
.ladder { display: inline-flex; gap: 3px; align-items: center; }
.ladder-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--border-hover); background: transparent; }
.ladder-dot.filled { background: var(--primary); border-color: var(--primary); }
.ladder-label { font-family: var(--mono); font-size: 10.5px; color: var(--text-muted); margin-left: 6px; }

/* PLANES */
.planes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.plane { padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--card-soft); cursor: pointer; transition: all 0.12s; text-align: left; display: flex; flex-direction: column; gap: 5px; min-height: 104px; }
.plane:hover { border-color: var(--primary); background: var(--primary-light); }
.plane-name { font-size: 9.5px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
.plane-indicator { width: 12px; height: 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; }
.plane-indicator.est { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
.plane-indicator.part { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
.plane-indicator.na { background: var(--card); color: var(--text-dim); border: 1px solid var(--border); }
.plane-state { font-size: 11.5px; font-weight: 500; }
.plane-state.est { color: var(--success); }
.plane-state.part { color: var(--amber); }
.plane-state.na { color: var(--text-dim); }
.plane-source { font-size: 11px; color: var(--text-muted); line-height: 1.35; margin-top: auto; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* CONSEQUENCE */
.consequence { padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--r-sm); display: flex; align-items: flex-start; gap: 12px; cursor: pointer; transition: all 0.12s; background: var(--card); width: 100%; text-align: left; margin-bottom: 8px; }
.consequence:hover { border-color: var(--primary); background: var(--primary-light); }
.sev-badge { width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.sev-high { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
.sev-med { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
.sev-low { background: var(--card-soft); color: var(--text-muted); border: 1px solid var(--border); }
.sev-res { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
.consequence-body { flex: 1; min-width: 0; }
.consequence-title { font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.consequence-detail { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }
.consequence-meta { display: flex; gap: 10px; margin-top: 6px; font-size: 11px; color: var(--text-dim); }
.consequence-arrow { color: var(--text-dim); font-size: 16px; flex-shrink: 0; margin-top: 2px; }

/* CALLOUT */
.callout { padding: 14px 18px; border-radius: var(--r-sm); font-size: 13px; line-height: 1.55; }
.callout-info { background: var(--primary-light); border: 1px solid var(--primary-border); color: var(--text); }
.callout-info strong { color: var(--primary); font-weight: 600; }
.callout-warn { background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber); }
.callout-success { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success); }
.callout-danger { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); }

/* STATE BLOCK */
.state-block { padding: 12px 14px; border-radius: var(--r-sm); display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--border); }
.state-block.success { background: var(--success-bg); border-color: var(--success-border); }
.state-block.amber { background: var(--amber-bg); border-color: var(--amber-border); }
.state-block.danger { background: var(--danger-bg); border-color: var(--danger-border); }
.state-block.neutral { background: var(--card-soft); }
.state-block.info { background: var(--info-bg); border-color: var(--info-border); }
.state-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.state-block.success .state-title { color: var(--success); }
.state-block.amber .state-title { color: var(--amber); }
.state-block.danger .state-title { color: var(--danger); }
.state-block.info .state-title { color: var(--info); }
.state-block.neutral .state-title { color: var(--text); }
.state-detail { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }

/* START */
.start-wrap { max-width: 1080px; margin: 0 auto; padding: 80px 32px 60px; }
.start-header { text-align: center; margin-bottom: 56px; }
.start-header h1.display { font-size: 38px; margin-bottom: 14px; }
.start-header .lead { font-size: 17px; max-width: 640px; margin: 0 auto; }
.start-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 40px; }
.start-card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r-lg); padding: 28px 24px; text-align: left; transition: all 0.15s; cursor: pointer; display: flex; flex-direction: column; gap: 12px; min-height: 260px; }
.start-card:hover { border-color: var(--primary); box-shadow: var(--sh-3); transform: translateY(-2px); }
.start-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 4px; }
.start-icon.a { background: var(--primary-light); color: var(--primary); }
.start-icon.b { background: var(--info-bg); color: var(--info); }
.start-icon.c { background: var(--amber-bg); color: var(--amber); }
.start-title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); }
.start-desc { font-size: 13.5px; line-height: 1.55; color: var(--text-muted); flex: 1; }
.start-example { font-size: 12px; color: var(--text-dim); padding-top: 12px; border-top: 1px solid var(--border); font-style: italic; line-height: 1.5; }
.start-recent { padding: 20px 24px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); }
.start-recent-title { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; }
.recent-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-sm); cursor: pointer; transition: background 0.12s; }
.recent-row:hover { background: var(--card-soft); }

/* HERO CASE */
.hero-case { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); padding: 28px 32px; margin-bottom: 24px; }
.hero-question { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; margin-bottom: 16px; color: var(--text); }
.hero-answer { font-size: 16px; line-height: 1.65; color: var(--text); margin-bottom: 10px; max-width: 900px; }
.hero-answer strong { font-weight: 600; }
.hero-exposure { font-size: 14px; line-height: 1.6; color: var(--text-muted); margin-bottom: 20px; max-width: 900px; }
.hero-status-row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding: 20px 0; margin-bottom: 18px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.hero-stat { display: flex; flex-direction: column; gap: 2px; }
.hero-stat-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); }
.hero-stat-value { font-size: 13px; font-weight: 500; color: var(--text); }
.hero-stat-value.mono { font-family: var(--mono); font-size: 12px; }
.hero-stat-sep { color: var(--text-dim); font-size: 16px; }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* SECTION */
.section { margin-bottom: 24px; }
.section-gap { margin-bottom: 20px; }

/* DAI */
.dai-chain { display: flex; flex-direction: column; }
.hop { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r-md); padding: 16px 20px; position: relative; scroll-margin-top: 20px; }
.hop.pivot { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(181,71,8,0.08); }
.hop.pivot.danger { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(180,35,24,0.08); }
.hop.pulse { animation: hopPulse 1.2s ease; }
@keyframes hopPulse { 0% { box-shadow: 0 0 0 0 rgba(67,56,202,0.4); } 70% { box-shadow: 0 0 0 12px rgba(67,56,202,0); } 100% { box-shadow: 0 0 0 0 rgba(67,56,202,0); } }
.hop-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.hop-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; background: var(--card-soft); border: 1px solid var(--border); }
.hop-meta { flex: 1; min-width: 0; }
.hop-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 1px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hop-sub { font-size: 12px; color: var(--text-muted); }
.hop-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.hop-means { font-size: 12.5px; color: var(--text); padding: 8px 12px; background: var(--card-soft); border-radius: var(--r-xs); margin-bottom: 10px; line-height: 1.5; }
.hop-means strong { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); display: block; margin-bottom: 3px; }
.hop.pivot .hop-means { background: var(--amber-bg); }
.hop.pivot.danger .hop-means { background: var(--danger-bg); }
.hop-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; margin-bottom: 8px; }
.hop-fact { display: flex; gap: 8px; align-items: baseline; font-size: 12px; }
.hop-fact-label { color: var(--text-muted); min-width: 90px; flex-shrink: 0; }
.hop-fact-value { color: var(--text); font-weight: 500; word-break: break-word; }
.hop-fact-value.mono { font-family: var(--mono); font-size: 11px; }
.hop-evidence-toggle { width: 100%; padding: 7px 12px; background: transparent; border: 1px solid var(--border); border-radius: var(--r-xs); font-size: 12px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
.hop-evidence-toggle:hover { background: var(--card-soft); color: var(--text); }
.hop-evidence { margin-top: 8px; padding: 10px 12px; background: var(--card-soft); border: 1px solid var(--border); border-radius: var(--r-xs); }
.ev-item { display: flex; gap: 10px; font-size: 12px; align-items: flex-start; margin-bottom: 6px; }
.ev-item:last-child { margin-bottom: 0; }
.ev-ref { font-family: var(--mono); font-size: 10.5px; color: var(--primary); background: var(--primary-light); padding: 1px 6px; border-radius: 3px; flex-shrink: 0; }
.ev-summary { color: var(--text-muted); line-height: 1.5; }
.connector { padding: 4px 0 4px 44px; display: flex; align-items: center; gap: 12px; position: relative; min-height: 44px; font-size: 12px; color: var(--text-muted); }
.connector-line { position: absolute; left: 21px; top: 0; bottom: 0; width: 2px; }
.connector-line.q { background: var(--success); }
.connector-line.c { background: repeating-linear-gradient(to bottom, var(--amber) 0, var(--amber) 5px, transparent 5px, transparent 10px); }
.connector-line.p { background: repeating-linear-gradient(to bottom, var(--text-dim) 0, var(--text-dim) 3px, transparent 3px, transparent 7px); }
.connector-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; border-radius: 50%; background: var(--card); border: 2px solid var(--border-hover); display: flex; align-items: center; justify-content: center; font-size: 7px; font-weight: 700; z-index: 1; }
.connector:has(.q) .connector-icon { border-color: var(--success); color: var(--success); }
.connector:has(.c) .connector-icon { border-color: var(--amber); color: var(--amber); }
.connector:has(.p) .connector-icon { border-color: var(--text-dim); color: var(--text-dim); }
.connector-text { flex: 1; }
.connector-main { font-weight: 500; color: var(--text); }
.connector-sub { font-size: 11px; color: var(--text-muted); }
.connector-dur { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); padding: 1px 6px; background: var(--card); border: 1px solid var(--border); border-radius: 3px; }

/* DAI TABLE */
.dai-table { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.dai-row { display: grid; grid-template-columns: 130px 1fr 1fr 32px; gap: 16px; padding: 11px 16px; border-bottom: 1px solid var(--border); align-items: center; font-size: 13px; transition: background 0.1s; }
.dai-row:last-child { border-bottom: none; }
.dai-row.header { background: var(--card-soft); font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-dim); text-transform: uppercase; padding: 8px 16px; }
.dai-row.mismatch { background: var(--danger-bg); }
.dai-row.mismatch.clickable:hover { background: #fde8e5; cursor: pointer; }
.dai-dim { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--text); }
.dai-value { font-size: 12.5px; color: var(--text-muted); }
.dai-value.match { color: var(--success); }
.dai-value.mismatch { color: var(--danger); font-weight: 500; }
.dai-icon { text-align: right; font-weight: 700; font-size: 13px; }
.dai-icon.match { color: var(--success); }
.dai-icon.mismatch { color: var(--danger); }

/* FACET */
.facet { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r-md); margin-bottom: 8px; overflow: hidden; border-left: 3px solid var(--border); }
.facet.success { border-left-color: var(--success); }
.facet.amber { border-left-color: var(--amber); }
.facet.danger { border-left-color: var(--danger); }
.facet.neutral { border-left-color: var(--text-dim); }
.facet-head { width: 100%; padding: 12px 16px; text-align: left; display: flex; align-items: center; gap: 12px; }
.facet-head:hover { background: var(--card-soft); }
.facet-num { font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: var(--text-dim); width: 18px; }
.facet-icon { font-size: 15px; }
.facet-label { flex: 1; font-size: 13.5px; font-weight: 500; color: var(--text); }
.facet-state { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.facet-state.success { background: var(--success-bg); color: var(--success); }
.facet-state.amber { background: var(--amber-bg); color: var(--amber); }
.facet-state.danger { background: var(--danger-bg); color: var(--danger); }
.facet-state.neutral { background: var(--card-soft); color: var(--text-muted); }
.facet-chev { color: var(--text-dim); transition: transform 0.15s; font-size: 11px; }
.facet.open .facet-chev { transform: rotate(180deg); }
.facet-body { display: none; padding: 0 16px 16px 46px; }
.facet.open .facet-body { display: block; }
.facet-summary { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; padding: 10px 12px; background: var(--card-soft); border-radius: var(--r-xs); margin-bottom: 12px; }
.facet-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; margin-bottom: 12px; }
.facet-fact { display: flex; gap: 8px; font-size: 12px; align-items: baseline; }
.facet-fact-label { color: var(--text-muted); min-width: 110px; flex-shrink: 0; }
.facet-fact-value { color: var(--text); font-weight: 500; }
.facet-fact-value.mono { font-family: var(--mono); font-size: 11px; }
.facet-next { margin-top: 10px; padding: 9px 12px; background: var(--primary-light); border: 1px dashed var(--primary-border); border-radius: var(--r-xs); font-size: 12px; color: var(--text); line-height: 1.5; }
.facet-next strong { color: var(--primary); }

/* INSPECTOR */
.inspector-backdrop { position: fixed; inset: 0; background: rgba(15,23,41,0.42); opacity: 0; pointer-events: none; transition: opacity 0.22s; z-index: 40; }
.inspector-backdrop.open { opacity: 1; pointer-events: auto; }
.inspector { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, calc(100vw - 40px)); background: var(--card); box-shadow: var(--sh-4); transform: translateX(100%); transition: transform 0.28s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; z-index: 50; }
.inspector.open { transform: translateX(0); }
.inspector-head { padding: 20px 24px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.inspector-crumb { font-size: 11.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.inspector-crumb .sep { color: var(--text-dim); }
.inspector-title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.35; margin-bottom: 2px; }
.inspector-sub { font-size: 12.5px; color: var(--text-muted); }
.inspector-close { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--text-muted); flex-shrink: 0; }
.inspector-close:hover { background: var(--card-soft); color: var(--text); }
.inspector-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
.inspector-section { margin-bottom: 22px; }
.inspector-section-title { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.inspector-section-title .badge { background: var(--card-soft); color: var(--text-muted); font-size: 10px; padding: 1px 6px; border-radius: 8px; font-family: var(--mono); letter-spacing: 0; text-transform: none; }
.inspector-foot { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--card); }
.inspector-foot-info { font-size: 11.5px; color: var(--text-muted); }

/* MODAL */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,41,0.5); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-backdrop.open { opacity: 1; pointer-events: auto; }
.modal { background: var(--card); border-radius: var(--r-lg); max-width: 520px; width: 100%; box-shadow: var(--sh-4); transform: scale(0.96); transition: transform 0.2s; overflow: hidden; }
.modal-backdrop.open .modal { transform: scale(1); }
.modal-head { padding: 20px 24px 12px; }
.modal-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.modal-sub { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
.modal-body { padding: 16px 24px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.6; }
.modal-foot { padding: 14px 24px; display: flex; gap: 8px; justify-content: flex-end; }

/* TOAST */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--text); color: white; padding: 10px 18px; border-radius: var(--r-sm); font-size: 13px; z-index: 100; box-shadow: var(--sh-3); opacity: 0; pointer-events: none; transition: all 0.2s; max-width: 480px; text-align: center; line-height: 1.5; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* EMPTY */
.empty { padding: 40px 24px; text-align: center; color: var(--text-muted); }
.empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
.empty-title { font-size: 14px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
.empty-desc { font-size: 12.5px; line-height: 1.55; max-width: 400px; margin: 0 auto; }

/* METRICS */
.metric-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.metric { padding: 14px 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); }
.metric-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 3px; }
.metric-value { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: var(--text); }
.metric-value.mono { font-family: var(--mono); font-size: 18px; }
.metric-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

/* FILTER */
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.filter-chip { padding: 5px 10px; border-radius: var(--r-sm); font-size: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text-muted); cursor: pointer; }
.filter-chip:hover { background: var(--card-soft); color: var(--text); }
.filter-chip.active { background: var(--primary-light); color: var(--primary); border-color: var(--primary-border); font-weight: 500; }

/* SOURCES */
.source-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.source-card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r-md); padding: 18px; display: flex; flex-direction: column; gap: 10px; transition: all 0.15s; }
.source-card:hover { border-color: var(--primary); box-shadow: var(--sh-2); }
.source-head { display: flex; align-items: flex-start; gap: 12px; }
.source-icon-lg { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; background: var(--card-soft); border: 1px solid var(--border); }
.source-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 1px; }
.source-mode { font-size: 11.5px; color: var(--text-muted); }
.source-establishes { font-size: 12px; color: var(--text-muted); line-height: 1.5; padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.source-establishes strong { color: var(--text); font-weight: 600; display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
.source-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* DECISION PACKET */
.decision-split { display: grid; grid-template-columns: minmax(0,1fr) 480px; gap: 24px; }
.scope-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.scope-block { padding: 14px; border-radius: var(--r-sm); }
.scope-allowed { background: var(--success-bg); border: 1px solid var(--success-border); }
.scope-prohibited { background: var(--danger-bg); border: 1px solid var(--danger-border); }
.scope-title { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.scope-allowed .scope-title { color: var(--success); }
.scope-prohibited .scope-title { color: var(--danger); }
.scope-list { list-style: none; font-size: 12.5px; line-height: 1.55; }
.scope-list li { padding-left: 16px; position: relative; margin-bottom: 4px; }
.scope-allowed .scope-list li::before { content: '✓'; position: absolute; left: 0; color: var(--success); font-weight: 700; }
.scope-prohibited .scope-list li::before { content: '×'; position: absolute; left: 0; color: var(--danger); font-weight: 700; }

/* MONITORING */
.monitor-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.status-quad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.status-quad-item { padding: 14px 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); display: flex; flex-direction: column; gap: 4px; }
.status-quad-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); }
.status-quad-value { font-size: 14px; font-weight: 600; color: var(--text); }
.status-quad-detail { font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }

/* PROVIDER USAGE */
.provider-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.provider-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); padding: 20px; }
.provider-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.provider-name { font-size: 15px; font-weight: 600; color: var(--text); }
.provider-model { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.provider-stat { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
.provider-stat-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); }
.provider-stat-value { font-size: 18px; font-weight: 600; color: var(--text); }
.provider-stat-value.unknown { color: var(--amber); font-style: italic; }

/* DEVELOPER */
.dev-layout { display: grid; grid-template-columns: 220px 1fr; gap: 32px; }
.dev-nav { position: sticky; top: 20px; align-self: start; }
.dev-nav-item { display: block; padding: 8px 12px; border-radius: var(--r-sm); font-size: 13px; color: var(--text-secondary); cursor: pointer; margin-bottom: 2px; }
.dev-nav-item:hover { background: var(--card-soft); color: var(--text); }
.dev-nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 500; }
.dev-content { min-width: 0; }
.dev-content h1 { font-size: 26px; margin-bottom: 12px; }
.dev-content h2 { font-size: 18px; margin-top: 28px; margin-bottom: 10px; }
.dev-content p { font-size: 14px; line-height: 1.65; color: var(--text-secondary); margin-bottom: 12px; }
.code-block { background: var(--text); color: #E5E7EB; padding: 14px 18px; border-radius: var(--r-sm); font-family: var(--mono); font-size: 12px; line-height: 1.6; overflow-x: auto; position: relative; margin-bottom: 16px; }
.copy-btn { position: absolute; top: 8px; right: 8px; padding: 3px 8px; font-size: 10px; background: rgba(255,255,255,0.1); color: white; border-radius: 4px; font-family: var(--sans); font-weight: 500; }
.copy-btn:hover { background: rgba(255,255,255,0.2); }

/* CONSTELLATION */
.constellation { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); height: 520px; overflow: hidden; }
.constellation-lenses { position: absolute; top: 16px; left: 16px; display: flex; flex-direction: column; gap: 4px; z-index: 2; background: var(--card); padding: 6px; border: 1px solid var(--border); border-radius: var(--r-sm); }
.lens-chip { padding: 6px 10px; font-size: 11.5px; border-radius: var(--r-xs); cursor: pointer; color: var(--text-muted); }
.lens-chip:hover { background: var(--card-soft); }
.lens-chip.active { background: var(--primary-light); color: var(--primary); font-weight: 500; }
.constellation-canvas { position: absolute; inset: 0; }
.const-node { position: absolute; padding: 8px 14px; background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r-sm); font-size: 11.5px; font-weight: 500; color: var(--text); cursor: pointer; transition: all 0.15s; z-index: 1; white-space: nowrap; }
.const-node:hover { border-color: var(--primary); box-shadow: var(--sh-2); z-index: 3; }
.const-node.agent { background: var(--primary-light); border-color: var(--primary-border); }
.const-node.tool { background: var(--success-bg); border-color: var(--success-border); }
.const-node.target { background: var(--amber-bg); border-color: var(--amber-border); }
.const-node.consequence { background: var(--danger-bg); border-color: var(--danger-border); }
.const-node.capability { background: var(--info-bg); border-color: var(--info-border); }

/* DESIGN NOTES */
.notes-body { max-width: 820px; margin: 0 auto; }
.notes-body h1 { font-size: 28px; margin-bottom: 20px; }
.notes-body h2 { font-size: 18px; margin-top: 32px; margin-bottom: 10px; }
.notes-body p { font-size: 14px; line-height: 1.7; color: var(--text-secondary); margin-bottom: 14px; }
.notes-body ul { font-size: 14px; line-height: 1.7; color: var(--text-secondary); margin-bottom: 14px; padding-left: 20px; }
.notes-body li { margin-bottom: 6px; }
.notes-body strong { color: var(--text); font-weight: 600; }
.notes-body table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
.notes-body th, .notes-body td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; }
.notes-body th { background: var(--card-soft); font-weight: 600; }

/* RESPONSIVE */
@media (max-width: 1100px) {
  .app { grid-template-columns: 64px 1fr; }
  .nav-item span:not(.nav-icon) { display: none; }
  .nav-item { justify-content: center; }
  .nav-group-title { display: none; }
  .nav-badge { display: none; }
  .topbar-search { width: 120px; }
  .source-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 0 1fr; grid-template-areas: "topbar topbar" ". main"; }
  .sidebar { display: none; }
  .main-inner { padding: 20px 16px 60px; }
  .planes { grid-template-columns: repeat(2, 1fr); }
  .start-grid { grid-template-columns: 1fr; }
  .start-wrap { padding: 40px 20px; }
  .start-header h1.display { font-size: 28px; }
  .hero-question { font-size: 20px; }
  .hop-facts, .facet-facts { grid-template-columns: 1fr; }
  .dai-row { grid-template-columns: 100px 1fr 1fr 28px; gap: 8px; padding: 8px 10px; font-size: 12px; }
  .inspector { width: 100vw; }
  .topbar-search, .dev-chip { display: none; }
  .metric-strip, .status-quad { grid-template-columns: 1fr 1fr; }
  .decision-split, .monitor-grid, .provider-grid { grid-template-columns: 1fr; }
  .dev-layout { grid-template-columns: 1fr; }
  .dev-nav { display: none; }
  .scope-compare { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .basis-control { display: none; }
  .topbar-org span { display: none; }
  .topbar { padding: 0 12px; gap: 8px; }
  .hero-question { font-size: 18px; }
  .metric-strip, .status-quad { grid-template-columns: 1fr; }
  .hero-status-row { gap: 12px; }
  .hero-stat-sep { display: none; }
  .hop, .inspector-body { padding-left: 12px; padding-right: 12px; }
  .start-card { min-height: auto; padding: 20px; }
  .source-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="topbar-org" onclick="showToast('Org switcher — single org in this demo')"><div class="org-mark">A</div><span>Acme Corp</span></button>
    <div class="topbar-sep"></div>
    <button class="topbar-system" onclick="cycleSystem()"><span class="sys-name" id="sys-label">Support Agent v2</span><span class="sys-env" id="sys-env-label">production</span></button>
    <div class="topbar-right">
      <span class="synthetic-chip">Synthetic demo</span>
      <div class="basis-control">
        <button class="basis-btn active" data-basis="current" onclick="setBasis('current')">Current</button>
        <button class="basis-btn" data-basis="evaluation" onclick="setBasis('evaluation')">Evaluation</button>
        <span class="basis-asof" id="basis-asof">14:22 UTC</span>
      </div>
      <select class="persona-select" id="persona" onchange="setPersona(this.value)">
        <option value="executive">Executive</option>
        <option value="admin">Org admin</option>
        <option value="developer">AI developer</option>
        <option value="operator">Security operator</option>
        <option value="approver">Human approver</option>
        <option value="auditor">Auditor</option>
      </select>
      <div class="search-wrap"><input class="topbar-search" placeholder="Search systems, agents, evidence…" onkeydown="if(event.key==='Enter')showToast('Search — synthetic demo')"></div>
      <button class="dev-chip" onclick="route('developer')">{ } Developer</button>
      <div class="avatar" onclick="route('governance')">AC</div>
    </div>
  </header>

  <nav class="sidebar">
    <div class="nav-group"><a class="nav-item" data-route="start" onclick="route('start')"><span class="nav-icon">✦</span><span>Start here</span></a></div>
    <div class="nav-group">
      <div class="nav-group-title">Understand</div>
      <a class="nav-item" data-route="overview" onclick="route('overview')"><span class="nav-icon">◎</span><span>Overview</span></a>
      <a class="nav-item" data-route="estate" onclick="route('estate')"><span class="nav-icon">▦</span><span>AI Estate</span></a>
      <a class="nav-item" data-route="case" onclick="route('case')"><span class="nav-icon">▣</span><span>Assurance Case</span><span class="nav-badge">4</span></a>
      <a class="nav-item" data-route="constellation" onclick="route('constellation')"><span class="nav-icon">❋</span><span>Action Topology</span></a>
    </div>
    <div class="nav-group">
      <div class="nav-group-title">Assure</div>

/* ═══════════ UTILITIES ═══════════ */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ladder(count,max=7){let h='<span class="ladder" aria-hidden="true">';for(let i=0;i<max;i++)h+=`<span class="ladder-dot ${i<=count?'filled':''}"></span>`;return h+'</span>';}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3200);}
function cycleSystem(){const ids=Object.keys(SYSTEMS);const i=ids.indexOf(state.systemId);state.systemId=ids[(i+1)%ids.length];document.getElementById('sys-label').textContent=SYSTEMS[state.systemId].name;document.getElementById('sys-env-label').textContent=SYSTEMS[state.systemId].env;render();}

function route(r){
  state.route=r;

  location.hash=r;render();document.getElementById('main').scrollTop=0;
}

function render(){

}

/* ═══════════ SCREEN: CONSTELLATION ═══════════ */
function renderConstellation(){
  const c=CONSTELLATION;
  const showEdges=state.constellationLens==='all'||state.constellationLens==='all';
  const lensFilter={all:()=>true,observed:e=>e.state==='qualified',candidate:e=>e.state==='candidate'};
  const filter=lensFilter[state.constellationLens]||lensFilter.all;
  return `
    <div class="eyebrow">Agent / Action / Constellation</div>
    <h1>${esc(currentSystem().name)} · Action topology</h1>
    <p class="lead" style="margin-bottom:16px;">How this system's agents, capabilities, tools and targets connect — with the evidence frontier marked.</p>
    <div class="guide"><div class="guide-icon">i</div><div class="guide-body"><strong>What you're seeing.</strong> Solid green edges are qualified relationships. Dashed amber edges are candidates — evidence exists but does not fully authorize the connection. A missing edge is not proven absence. Click any node to see its evidence basis.</div></div>
    <div class="filter-bar">
      <span class="filter-chip ${state.constellationLens==='all'?'active':''}" onclick="state.constellationLens='all';render()">All</span>
      <span class="filter-chip ${state.constellationLens==='observed'?'active':''}" onclick="state.constellationLens='observed';render()">Qualified only</span>
      <span class="filter-chip ${state.constellationLens==='candidate'?'active':''}" onclick="state.constellationLens='candidate';render()">Candidates only</span>
      <span style="margin-left:auto;font-size:11.5px;color:var(--text-dim);">${c.nodes.length} nodes · ${c.edges.length} edges</span>
    </div>
    <div class="constellation">
      <div class="constellation-lenses">
        <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);padding:4px 8px;">Lens</div>
        <div class="lens-chip ${state.constellationLens==='all'?'active':''}" onclick="state.constellationLens='all';render()">All relationships</div>
        <div class="lens-chip ${state.constellationLens==='observed'?'active':''}" onclick="state.constellationLens='observed';render()">Qualified only</div>
        <div class="lens-chip ${state.constellationLens==='candidate'?'active':''}" onclick="state.constellationLens='candidate';render()">Candidates only</div>
      </div>
      <svg class="constellation-canvas" viewBox="0 0 1020 520" preserveAspectRatio="xMidYMid meet">
        ${c.edges.filter(filter).map(e=>{
          const from=c.nodes.find(n=>n.id===e.from);
          const to=c.nodes.find(n=>n.id===e.to);
          if(!from||!to)return '';
          const stroke=e.state==='qualified'?'#067647':'#B54708';
          const dash=e.state==='qualified'?'':'stroke-dasharray="6,4"';
          return `<line x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="${stroke}" stroke-width="1.5" ${dash} opacity="0.7"/>`;
        }).join('')}
      </svg>
      ${c.nodes.map(n=>`<button class="const-node ${n.type}" style="left:${n.x}px;top:${n.y}px;transform:translate(-50%,-50%);" onclick="openInspector('constellation',{nodeId:'${n.id}'})"><div style="font-weight:600;">${esc(n.label)}</div><div style="font-size:9.5px;color:var(--text-muted);font-weight:400;margin-top:1px;">${esc(n.sub)}</div></button>`).join('')}

      <div class="card"><table class="tbl"><thead><tr><th>From</th><th>To</th><th>Relationship</th><th>Evidence state</th></tr></thead><tbody>
        ${c.edges.filter(filter).map(e=>{const from=c.nodes.find(n=>n.id===e.from);const to=c.nodes.find(n=>n.id===e.to);return `<tr class="clickable" onclick="openInspector('constellation',{nodeId:'${e.from}'})"><td>${esc(from.label)}</td><td>${esc(to.label)}</td><td>${esc(e.label)}</td><td><span class="chip chip-${e.state==='qualified'?'success':'amber'}">${e.state==='qualified'?'Qualified':'Candidate'}</span></td></tr>`;}).join('')}
      </tbody></table></div>
    </div>`;
}

            <div style="display:flex;justify-content:space-between;font-size:12.5px;"><span style="color:var(--text-muted);">SoD verified</span><span style="font-weight:500;color:var(--success);">✓ Requester ≠ Reviewer</span></div>

function approvalPreview(id,action){
  openModal(
    action==='approve'?'Approve request?':action==='reject'?'Reject request?':'Request changes?',
    `This is a preview. In production, this action would require: role verification, SoD check, digest-bound decision, append-only record. It cannot be completed from this demo.`,
    `<div style="font-size:13px;line-height:1.6;"><div style="margin-bottom:8px;"><strong>Request:</strong> ${esc(id)}</div><div style="margin-bottom:8px;"><strong>Action:</strong> ${action==='approve'?'Approve as scoped':action==='reject'?'Reject with rationale':'Request changes with conditions'}</div><div style="padding:10px 12px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--r-xs);font-size:12px;"><strong style="color:var(--amber);">Approval is not authorization to deploy.</strong> It records a named human's decision on the requested scope. Deployment, target enforcement, and effect verification are separate operations with their own evidence requirements.</div></div>`,

}

/* ═══════════ SCREEN: DESIGN NOTES ═══════════ */
function renderDesignNotes(){

        <tr><td>Action Topology</td><td>Constellation · qualified vs candidate edges · evidence frontier</td></tr>
        <tr><td>Evaluate</td><td>HAIEC Assurance Engine · disposition · claims · missing evidence</td></tr>

        <tr><td>Controls</td><td>Twelve independent facets · Control Proof preserved · no aggregate "control passed"</td></tr>
        <tr><td>Governance</td><td>My Work · decision packets · scoped allowed vs prohibited · SoD · approval ≠ deployment</td></tr>
        <tr><td>Monitoring</td><td>Four separate statuses · passive vs empirical · alerts vs enforcement</td></tr>

      <ul><li>Cross-system delegation verification requires issuer-qualified identities, exact target identity, and independent readback — shown as candidate edges only</li><li>Live source connection, live provider sync, live control test execution, live approval decisions — all preview-only</li><li>Runtime empirical testing — BETA, requires authorized endpoint</li></ul>
      <h2>Disclaimers</h2>
      <p>All data in this atlas is synthetic. All scenario fixtures — including the four DAI scenarios, four control scenarios, and four AI systems — are training fixtures, not live HAIEC customer findings. The synthetic chip in the topbar is permanent.</p>
    </div>`;
}

/* ═══════════ INSPECTOR ═══════════ */
function openInspector(kind,opts={}){
  const insp=document.getElementById('inspector');
  const backdrop=document.getElementById('inspector-backdrop');
  const renderers={dai:()=>renderInspectorDai(opts),control:()=>renderInspectorControl(opts),coverage:()=>renderInspectorCoverage(opts),navigator:()=>renderInspectorNavigator(opts),receipt:()=>renderInspectorReceipt(opts),constellation:()=>renderInspectorConstellation(opts)};
  const result=renderers[kind]?renderers[kind]():{crumb:'Preview',title:'Preview only',sub:'',body:'<p>This drilldown ships in a later stage.</p>',foot:''};
  document.getElementById('inspector-crumb').innerHTML=result.crumb;
  document.getElementById('inspector-title').textContent=result.title;
  document.getElementById('inspector-sub').textContent=result.sub;
  document.getElementById('inspector-body').innerHTML=result.body;
  document.getElementById('inspector-foot').innerHTML=result.foot||'';
  insp.classList.add('open');backdrop.classList.add('open');
}
function closeInspector(){document.getElementById('inspector').classList.remove('open');document.getElementById('inspector-backdrop').classList.remove('open');}

function renderInspectorDai(opts){
  const sc=DAI_SCENARIOS[opts.scenario||'widened'];
  const chainHtml=sc.hops.map((hop,i)=>{const isPivot=sc.pivot===i;const hopId='dai-hop-'+i;const open=state.openHops.has(hopId);return `
    <div class="hop ${isPivot?'pivot':''} ${sc.tone==='danger'?'danger':''}" id="${hopId}">
      <div class="hop-head"><div class="hop-icon">${hop.icon}</div><div class="hop-meta"><div class="hop-title">${esc(hop.title)} ${isPivot?'<span class="chip chip-amber" style="font-size:9px;">PIVOT</span>':''}</div><div class="hop-sub">${esc(hop.sub)}</div></div><div class="hop-badges"><span class="chip chip-${hop.tone} chip-mono">${esc(hop.state)}</span></div></div>
      <div class="hop-means"><strong>What this means</strong>${esc(hop.means)}</div>
      <div class="hop-facts">${hop.facts.map(f=>`<div class="hop-fact"><span class="hop-fact-label">${esc(f.l)}</span><span class="hop-fact-value ${f.m?'mono':''}">${esc(f.v)}</span></div>`).join('')}</div>
      ${hop.evidence.length?`<button class="hop-evidence-toggle" data-hop="${hopId}"><span>${hop.evidence.length} evidence reference${hop.evidence.length===1?'':'s'}</span><span>${open?'▲':'▼'}</span></button>${open?`<div class="hop-evidence">${hop.evidence.map(ev=>`<div class="ev-item"><span class="ev-ref">${esc(ev.ref)}</span><span class="ev-summary">${esc(ev.s)}</span></div>`).join('')}</div>`:''}`:`<div style="padding:10px 12px;border:1px dashed var(--border);border-radius:var(--r-xs);font-size:11.5px;color:var(--text-muted);font-style:italic;">Awaiting readback — evidence will attach once the next scheduled pull completes.</div>`}
    </div>
    ${i<sc.hops.length-1?`<div class="connector"><div class="connector-line ${sc.links[i].tone}"></div><div class="connector-icon">${sc.links[i].tone==='q'?'✓':sc.links[i].tone==='c'?'◇':'⋯'}</div><div class="connector-text"><div class="connector-main">${esc(sc.links[i].main)}</div><div class="connector-sub">${esc(sc.links[i].sub)}</div></div><div class="connector-dur">${esc(sc.links[i].dur)}</div></div>`:''}
  `;}).join('');
  const daiHtml=`<div class="dai-table"><div class="dai-row header"><div>Dimension</div><div>Parent scope</div><div>Child scope</div><div></div></div>${sc.dai.map(d=>`<div class="dai-row ${d.match?'':'mismatch'} ${!d.match&&d.hop!==undefined?'clickable':''}" ${!d.match&&d.hop!==undefined?`onclick="document.getElementById('dai-hop-${d.hop}').scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('dai-hop-${d.hop}').classList.add('pulse');setTimeout(()=>document.getElementById('dai-hop-${d.hop}').classList.remove('pulse'),1300)"`:''}><div class="dai-dim">${d.d}</div><div class="dai-value ${d.match?'match':'mismatch'}">${esc(d.p)}</div><div class="dai-value ${d.match?'match':'mismatch'}">${esc(d.c)}</div><div class="dai-icon ${d.match?'match':'mismatch'}">${d.match?'✓':'⚠'}</div></div>`).join('')}</div>`;
  const unverifiedHtml=sc.unverified.length?`<div class="inspector-section"><div class="inspector-section-title">What is unverified <span class="badge">${sc.unverified.length}</span></div>${sc.unverified.map(u=>`<div class="state-block ${sc.tone==='danger'?'danger':'amber'}" style="margin-bottom:8px;"><div class="state-title"><span>!</span>${esc(u.title)}</div><div class="state-detail">${esc(u.detail)}</div></div>`).join('')}</div>`:`<div class="inspector-section"><div class="inspector-section-title">What is unverified</div><div class="state-block success"><div class="state-title"><span>✓</span>All steps qualified</div><div class="state-detail">No unverified steps in this chain. The evidence basis is complete and frozen.</div></div></div>`;
  const scenarioSwitcher=`<div class="inspector-section"><div class="inspector-section-title">Switch scenario (synthetic)</div><div style="display:flex;gap:6px;flex-wrap:wrap;">${Object.entries(DAI_SCENARIOS).map(([id,s])=>`<button class="filter-chip ${state.daiScenario===id?'active':''}" onclick="state.daiScenario='${id}';closeInspector();openInspector('dai',{scenario:'${id}'})">${esc(s.label)}</button>`).join('')}</div></div>`;
  return {crumb:`Support Agent v2 <span class="sep">›</span> Agent / Action <span class="sep">›</span> Delegated actions`,title:`Delegated action chain · ${sc.label}`,sub:`${sc.chainId} · ${sc.integrity} · ${sc.duration}`,
    body:`<div class="callout callout-${sc.tone==='success'?'success':sc.tone==='danger'?'danger':'info'}" style="margin-bottom:18px;"><strong>${sc.tone==='success'?'✓':'⚠'} ${esc(sc.headline)}</strong><div class="mono" style="margin-top:6px;font-size:11px;">${esc(sc.stateLabel)}</div></div>${scenarioSwitcher}<div class="inspector-section"><div class="inspector-section-title">Chain</div><div class="dai-chain">${chainHtml}</div></div><div class="inspector-section"><div class="inspector-section-title">DAI nine-dimension comparison <span class="badge">${sc.dai.filter(d=>d.match).length}/9 match</span></div>${daiHtml}</div>${unverifiedHtml}`,
    foot:`<div class="inspector-foot-info">Synthetic fixture · not a live HAIEC assessment</div><div style="display:flex;gap:8px;"><button class="btn btn-ghost btn-sm" onclick="showToast('Receipt export — would produce a frozen PDF in production')">Export receipt</button><button class="btn btn-primary btn-sm" onclick="closeInspector()">Done</button></div>`};
}

function renderInspectorControl(opts){
  const sc=CONTROL_SCENARIOS[opts.scenario||'mixed'];
  return {crumb:`Support Agent v2 <span class="sep">›</span> Controls <span class="sep">›</span> ${sc.id}`,title:`${sc.id} · ${sc.title}`,sub:sc.verdictLabel,
    body:`<div class="callout callout-info" style="margin-bottom:18px;"><strong>Each facet is qualified independently.</strong> A control with ${sc.qualified}/${sc.facets.length} facets qualified is not "${Math.round(sc.qualified/sc.facets.length*100)}% passed" — it is in a specific operational state that depends on which facets.</div>${sc.facets.map((f,i)=>`<div class="facet ${f.tone} open" style="margin-bottom:8px;"><div class="facet-head"><span class="facet-num">${String(i+1).padStart(2,'0')}</span><span class="facet-icon">${f.icon}</span><span class="facet-label">${esc(f.label)}</span><span class="facet-state ${f.tone}">${esc(f.state)}</span></div><div class="facet-body"><div class="facet-summary">${esc(f.summary)}</div><div class="facet-facts">${f.facts.map(x=>`<div class="facet-fact"><span class="facet-fact-label">${esc(x.l)}</span><span class="facet-fact-value ${x.m?'mono':''}">${esc(x.v)}</span></div>`).join('')}</div>${f.evidence&&f.evidence.length?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">${f.evidence.map(ev=>`<div class="ev-item"><span class="ev-ref">${esc(ev.ref)}</span><span class="ev-summary">${esc(ev.s)}</span></div>`).join('')}</div>`:''}${f.next?`<div class="facet-next"><strong>Next step:</strong> ${esc(f.next.text)}</div>`:''}</div></div>`).join('')}`,
    foot:`<div class="inspector-foot-info">${sc.qualified}/${sc.facets.length} facets qualified</div><div style="display:flex;gap:8px;"><button class="btn btn-ghost btn-sm" onclick="showToast('Open config — requires authenticated write')">Open config</button><button class="btn btn-primary btn-sm" onclick="closeInspector()">Done</button></div>`};
}

function renderInspectorCoverage(opts){
  const facets=[{icon:'📦',name:'Code / AppSec',state:'full',detail:'Full remote executor · 47 rules · 6 findings'},{icon:'💬',name:'Prompt / RAG',state:'partial',detail:'R1 and R4 static rules ran · observed prompt events not present'},{icon:'🔧',name:'Tool / MCP',state:'full',detail:'Tool-call sinks + MCP registry · 3 findings'},{icon:'🪪',name:'Identity & Access',state:'partial',detail:'IAM observer ran · effective per-action not resolved'},{icon:'📁',name:'Supply chain',state:'full',detail:'SBOM diff + lockfile + registry · 2 findings'},{icon:'🧪',name:'Runtime test',state:'neutral',detail:'Not run in this evaluation · requires authorized endpoint'},{icon:'📊',name:'Telemetry',state:'full',detail:'OTLP + logs + gateway events · sampling 1:100 for prompts'},{icon:'📜',name:'Governance',state:'full',detail:'Envelope v12 approved · control test executed'}];
  return {crumb:`Support Agent v2 <span class="sep">›</span> Assurance Case <span class="sep">›</span> Detection coverage`,title:`Coverage${opts.plane?' · '+opts.plane:''}`,sub:'What was analyzed in eval-2f4a-9d3b, per analyzer',
    body:`<div class="callout callout-info" style="margin-bottom:18px;"><strong>Coverage differs by source mode.</strong> A static rule existing in another analyzer does not prove this path exercises it. Missing source category ≠ clean result.</div><div class="inspector-section"><div class="inspector-section-title">Facets in this evaluation</div><div style="display:flex;flex-direction:column;gap:8px;">${facets.map(f=>`<div class="state-block ${f.state==='full'?'success':f.state==='partial'?'amber':'neutral'}"><div class="state-title"><span>${f.icon}</span>${f.name} — ${f.state==='full'?'Full':f.state==='partial'?'Partial':'Not run'}</div><div class="state-detail">${esc(f.detail)}</div></div>`).join('')}</div></div><div class="inspector-section"><div class="inspector-section-title">What this does not establish</div><div class="state-block amber"><div class="state-title"><span>!</span>Runtime empirical results</div><div class="state-detail">Runtime attack simulation did not run in this evaluation. It is opt-in and requires authorized endpoint access.</div></div></div>`,
    foot:`<div class="inspector-foot-info">Per-scan coverage · 14/16 analyzers ran</div><div style="display:flex;gap:8px;"><button class="btn btn-ghost btn-sm" onclick="closeInspector();openInspector('navigator')">+ Add source</button><button class="btn btn-primary btn-sm" onclick="closeInspector()">Done</button></div>`};
}

function renderInspectorNavigator(opts){
  const sys=currentSystem();
  const sources=[{icon:'📊',name:'Runtime traces',detail:'OTLP or typed JSONL · strengthens OBSERVED'},{icon:'🔑',name:'AWS IAM export',detail:'Live observer or JSON · strengthens EFFECTIVELY_GRANTED'},{icon:'📁',name:'CycloneDX SBOM',detail:'JSON 1.4–1.6 · adds supply-chain context'},{icon:'🧪',name:'Runtime endpoint test',detail:'Authorized endpoint · BETA'}];
  return {crumb:`Support Agent v2 <span class="sep">›</span> Evidence`,title:'Add evidence to strengthen this assessment',sub:`Currently at ${sys.ladderLabel} · ${sys.planes.filter(p=>p.state==='est').length}/5 planes established`,
    body:`<div class="callout callout-info" style="margin-bottom:18px;"><strong>Every source qualifies differently.</strong> Pick the sources you have. HAIEC will show the exact ladder climb before you commit — no source is required.</div><div class="inspector-section"><div class="inspector-section-title">Recommended for this system</div><div style="display:flex;flex-direction:column;gap:8px;">${sources.map(s=>`<div style="padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-sm);display:flex;align-items:center;gap:12px;"><span style="font-size:20px;">${s.icon}</span><div style="flex:1;"><div style="font-size:13px;font-weight:500;color:var(--text);">${esc(s.name)}</div><div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">${esc(s.detail)}</div></div><button class="btn btn-secondary btn-sm" onclick="showToast('Connect ${esc(s.name)} — preview only')">Add</button></div>`).join('')}</div></div><div class="inspector-section"><div class="inspector-section-title">Source packages</div><div style="display:flex;flex-direction:column;gap:6px;">${[{name:'Static starter',desc:'Source code + SBOM · reaches ASSURANCE_EVALUATED'},{name:'Runtime first',desc:'OTLP traces + logs · completes OBSERVED'},{name:'Authority first',desc:'Policy + IAM + Delegation · completes POLICY_AUTHORIZED and EFFECTIVELY_GRANTED'}].map(p=>`<button class="filter-chip" style="text-align:left;padding:10px 12px;" onclick="showToast('Package preview — would pre-select ${esc(p.name)} sources')"><div style="font-weight:600;color:var(--text);margin-bottom:2px;">${esc(p.name)}</div><div style="font-size:11.5px;color:var(--text-muted);font-weight:400;">${esc(p.desc)}</div></button>`).join('')}</div></div>`,
    foot:`<div class="inspector-foot-info">Synthetic preview · no source is actually connected</div><div style="display:flex;gap:8px;"><button class="btn btn-ghost btn-sm" onclick="closeInspector()">Cancel</button><button class="btn btn-primary btn-sm" onclick="closeInspector();showToast('Preview only — no assessment executed')">Preview assessment</button></div>`};
}

function renderInspectorReceipt(opts){
  const r=RECEIPTS.find(x=>x.id===opts.receiptId)||RECEIPTS[0];
  return {crumb:`Reports <span class="sep">›</span> ${r.id}`,title:`Assurance Receipt · ${r.id}`,sub:`${r.system} · ${r.asOf} · ${r.disposition}`,
    body:`<div class="callout callout-info" style="margin-bottom:18px;"><strong>This is a frozen receipt.</strong> The digest below identifies the exact evidence basis that was evaluated. Changing any byte of the underlying evidence would invalidate this digest.</div>
      <div class="inspector-section"><div class="inspector-section-title">Receipt identity</div>
        <div class="facet-facts">
          <div class="facet-fact"><span class="facet-fact-label">Receipt</span><span class="facet-fact-value mono">${esc(r.id)}</span></div>
          <div class="facet-fact"><span class="facet-fact-label">Issued to</span><span class="facet-fact-value mono">${esc(r.issuedTo)}</span></div>
          <div class="facet-fact" style="grid-column:1/-1;"><span class="facet-fact-label">Digest</span><span class="facet-fact-value mono" style="font-size:11px;word-break:break-all;">${esc(r.digest)}</span></div>
        </div>
      </div>
      <div class="inspector-section"><div class="inspector-section-title">Evidence sources <span class="badge">${r.sources.length}</span></div>
        ${r.sources.map(s=>`<div class="state-block success" style="margin-bottom:6px;"><div class="state-title"><span>✓</span>${esc(s.name)}</div><div class="state-detail">${esc(s.scope)}</div></div>`).join('')}
      </div>
      ${r.missing.length?`<div class="inspector-section"><div class="inspector-section-title">Missing evidence <span class="badge">${r.missing.length}</span></div>${r.missing.map(m=>`<div class="state-block amber" style="margin-bottom:6px;"><div class="state-title"><span>◐</span>${esc(m.name)}</div><div class="state-detail">${esc(m.reason)}</div></div>`).join('')}</div>`:''}
      <div class="inspector-section"><div class="inspector-section-title">Human review attestations</div>
        ${r.attestations.map(a=>`<div class="state-block info" style="margin-bottom:6px;"><div class="state-title"><span>✍</span>${esc(a.by)}</div><div class="state-detail">${esc(a.attests)} · ${esc(a.at)}</div></div>`).join('')}
        <div class="callout callout-warn" style="margin-top:10px;font-size:12px;"><strong>Review ≠ verification.</strong> These signatures attest to review of the evidence basis. They are not a technical verification of the systems evaluated.</div>
      </div>
      <div class="inspector-section"><div class="inspector-section-title">Framework mappings <span class="badge">context only</span></div>
        ${r.frameworks.map(f=>`<div style="padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-xs);margin-bottom:6px;"><div style="font-size:13px;font-weight:500;">${esc(f.name)}</div><div style="font-size:11px;font-family:var(--mono);color:var(--text-muted);">${esc(f.ref)}</div><div style="font-size:11.5px;color:var(--text-dim);font-style:italic;margin-top:2px;">${esc(f.note)}</div></div>`).join('')}
      </div>`,
    foot:`<div class="inspector-foot-info">Frozen · ${esc(r.asOf)}</div><div style="display:flex;gap:8px;"><button class="btn btn-ghost btn-sm" onclick="showToast('Verify — would recompute digest in production')">Verify digest</button><button class="btn btn-ghost btn-sm" onclick="showToast('Export PDF — would produce a signed receipt in production')">Export PDF</button><button class="btn btn-primary btn-sm" onclick="closeInspector()">Done</button></div>`};
}

function renderInspectorConstellation(opts){
  const node=CONSTELLATION.nodes.find(n=>n.id===opts.nodeId);
  if(!node)return{crumb:'Topology',title:'Node',sub:'',body:'<p>Node not found.</p>',foot:''};
  const inEdges=CONSTELLATION.edges.filter(e=>e.to===node.id);
  const outEdges=CONSTELLATION.edges.filter(e=>e.from===node.id);
  return {crumb:`Support Agent v2 <span class="sep">›</span> Topology <span class="sep">›</span> ${esc(node.label)}`,title:node.label,sub:`${node.type} · ${node.sub}`,
    body:`<div class="inspector-section"><div class="inspector-section-title">Incoming relationships <span class="badge">${inEdges.length}</span></div>${inEdges.length?inEdges.map(e=>{const from=CONSTELLATION.nodes.find(n=>n.id===e.from);return `<div class="state-block ${e.state==='qualified'?'success':'amber'}" style="margin-bottom:6px;"><div class="state-title"><span>${e.state==='qualified'?'✓':'◇'}</span>${esc(from.label)} → ${esc(node.label)}</div><div class="state-detail">${esc(e.label)} · ${e.state==='qualified'?'Qualified':'Candidate — evidence does not fully authorize'}</div></div>`;}).join(''):'<div class="empty"><div class="empty-desc">No incoming relationships</div></div>'}</div>
    <div class="inspector-section"><div class="inspector-section-title">Outgoing relationships <span class="badge">${outEdges.length}</span></div>${outEdges.length?outEdges.map(e=>{const to=CONSTELLATION.nodes.find(n=>n.id===e.to);return `<div class="state-block ${e.state==='qualified'?'success':'amber'}" style="margin-bottom:6px;"><div class="state-title"><span>${e.state==='qualified'?'✓':'◇'}</span>${esc(node.label)} → ${esc(to.label)}</div><div class="state-detail">${esc(e.label)}</div></div>`;}).join(''):'<div class="empty"><div class="empty-desc">No outgoing relationships</div></div>'}</div>
    <div class="inspector-section"><div class="inspector-section-title">What remains unknown</div><div class="state-block amber"><div class="state-title"><span>◐</span>Full cross-system identity</div><div class="state-detail">Cross-system delegation verification requires issuer-qualified identities and independent target readback. These are shown as candidate edges, not proven relationships.</div></div></div>`,
    foot:`<div class="inspector-foot-info">Synthetic topology</div><div style="display:flex;gap:8px;"><button class="btn btn-primary btn-sm" onclick="closeInspector()">Close</button></div>`};
}

/* ═══════════ MODAL & TOAST ═══════════ */
function openModal(title,sub,body,buttons){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-sub').textContent=sub;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-foot').innerHTML=buttons.map(b=>`<button class="btn btn-${b.style==='primary'?'primary':b.style==='ghost'?'ghost':'secondary'}" ${b.disabled?'disabled style="opacity:0.5;cursor:not-allowed;"':''} onclick="${b.disabled?'':(b.action===closeModal?'closeModal()':b.action)}">${esc(b.label)}</button>`).join('');
  document.getElementById('modal-backdrop').classList.add('open');
}
function closeModal(){document.getElementById('modal-backdrop').classList.remove('open');}

/* ═══════════ KEYBOARD ═══════════ */
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeInspector();closeModal();}});

/* ═══════════ INIT ═══════════ */
(function init(){
  const hash=location.hash.replace('#','');
  if(hash&&document.querySelector(`[data-route="${hash}"]`))state.route=hash;
  document.querySelectorAll('.nav-item').forEach(n=>{if(n.dataset.route===state.route)n.classList.add('active');});
  document.getElementById('persona').value=state.persona;
  render();
})();
</script>
</body>

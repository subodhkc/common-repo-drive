<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controls & Operations — HAIEC</title>
<style>
:root{
  --bg:#FAFBFC; --card:#FFFFFF; --card-soft:#F5F7FA;
  --border:#E7E9EE; --border-hover:#D0D4DD; --border-strong:#B8BFCC;
  --text:#0F1729; --text-secondary:#414A5E; --text-muted:#667085; --text-dim:#98A2B3;
  --primary:#4338CA; --primary-hover:#3730A3; --primary-light:#EEF2FF; --primary-border:#C7D2FE; --primary-ring:rgba(67,56,202,0.12);
  --success:#067647; --success-bg:#ECFDF3; --success-border:#ABEFC6;
  --amber:#B54708; --amber-bg:#FFFAEB; --amber-border:#FEDF89;
  --danger:#B42318; --danger-bg:#FEF3F2; --danger-border:#FECDCA;
  --info:#175CD3; --info-bg:#EFF8FF; --info-border:#B2DDFF;
  --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  --sh-1:0 1px 2px rgba(16,24,40,0.04);
  --sh-2:0 2px 6px rgba(16,24,40,0.06),0 1px 2px rgba(16,24,40,0.04);
  --sh-3:0 8px 24px rgba(16,24,40,0.08);
  --sh-4:0 24px 56px rgba(16,24,40,0.18);
  --sans:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--sans);font-size:14.5px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{color:var(--primary);text-decoration:none;}
a:hover{text-decoration:underline;text-underline-offset:2px;}
code,.mono{font-family:var(--mono);font-size:0.92em;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-hover);border-radius:5px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong);}

.page{max-width:1400px;margin:0 auto;padding:24px 32px 80px;}

/* HEADER */
.page-header{display:flex;align-items:center;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap;}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);flex-wrap:wrap;}
.crumb .org{font-weight:500;color:var(--text);}
.crumb .sep{color:var(--text-dim);}
.crumb .current{font-weight:600;color:var(--text);}
.crumb .env{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);font-weight:600;letter-spacing:0.03em;text-transform:uppercase;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.synthetic-chip{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:5px;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);letter-spacing:0.02em;text-transform:uppercase;}

/* TYPO */
h1{font-size:24px;font-weight:600;letter-spacing:-0.02em;line-height:1.3;color:var(--text);margin-bottom:6px;}
h2{font-size:16px;font-weight:600;letter-spacing:-0.01em;line-height:1.4;color:var(--text);margin-bottom:4px;}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;}
.lead{font-size:15.5px;line-height:1.6;color:var(--text-secondary);margin-bottom:4px;}
.helper{font-size:13px;line-height:1.55;color:var(--text-muted);}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;border:1px solid transparent;transition:all 0.12s;display:inline-flex;align-items:center;gap:6px;letter-spacing:-0.005em;}
.btn-primary{background:var(--primary);color:white;box-shadow:var(--sh-1);}
.btn-primary:hover{background:var(--primary-hover);box-shadow:var(--sh-2);}
.btn-secondary{background:var(--card);color:var(--text);border-color:var(--border);}
.btn-secondary:hover{background:var(--card-soft);border-color:var(--border-hover);}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:var(--border);}
.btn-ghost:hover{background:var(--card-soft);color:var(--text);}
.btn-sm{padding:5px 12px;font-size:12.5px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

/* CHIPS */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;letter-spacing:0.02em;white-space:nowrap;}
.chip-success{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);}
.chip-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.chip-danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);}
.chip-neutral{background:var(--card-soft);color:var(--text-muted);border:1px solid var(--border);}
.chip-info{background:var(--info-bg);color:var(--info);border:1px solid var(--info-border);}
.chip-mono{font-family:var(--mono);font-size:10.5px;letter-spacing:0;text-transform:none;}

/* SCENARIO TABS */
.scenario-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.scenario-tab{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:500;color:var(--text-muted);transition:all 0.15s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;}
.scenario-tab:hover{border-color:var(--border-hover);color:var(--text);}
.scenario-tab.active{background:var(--primary);color:white;border-color:var(--primary);}
.scenario-tab .tab-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.scenario-tab .tab-dot.success{background:var(--success);}
.scenario-tab .tab-dot.amber{background:var(--amber);}
.scenario-tab .tab-dot.danger{background:var(--danger);}
.scenario-tab.active .tab-dot{background:white;}

/* CONTROL SUMMARY */
.control-summary{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:24px 28px;margin-bottom:20px;border-left:4px solid var(--border);}
.control-summary.success{border-left-color:var(--success);}
.control-summary.amber{border-left-color:var(--amber);}
.control-summary.danger{border-left-color:var(--danger);}
.control-summary-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px;flex-wrap:wrap;}
.control-summary-left{flex:1;min-width:280px;}
.control-id-label{font-family:var(--mono);font-size:12px;color:var(--text-muted);font-weight:600;letter-spacing:0.03em;margin-bottom:3px;}
.control-title{font-size:18px;font-weight:600;letter-spacing:-0.015em;line-height:1.35;color:var(--text);margin-bottom:4px;}
.control-summary-desc{font-size:13.5px;color:var(--text-muted);line-height:1.55;max-width:800px;}
.control-verdict-badge{font-size:13px;font-weight:600;padding:6px 14px;border-radius:6px;white-space:nowrap;align-self:flex-start;}
.control-verdict-badge.success{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);}
.control-verdict-badge.amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.control-verdict-badge.danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);}

.control-summary-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-top:16px;border-top:1px solid var(--border);}
.summary-stat{display:flex;flex-direction:column;gap:3px;}
.summary-stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);}
.summary-stat-value{font-size:14px;font-weight:500;color:var(--text);}
.summary-stat-value.mono{font-family:var(--mono);font-size:12.5px;}
.summary-stat-value.qualified{color:var(--success);}
.summary-stat-value.attention{color:var(--amber);}
.summary-stat-value.blocked{color:var(--danger);}

/* COMPASS — 12-facet quick nav */
.compass-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 20px;margin-bottom:20px;}
.compass-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.compass-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);}
.compass-legend{display:flex;gap:12px;font-size:11px;color:var(--text-muted);flex-wrap:wrap;}
.legend-item{display:inline-flex;align-items:center;gap:5px;}
.legend-swatch{width:9px;height:9px;border-radius:2px;}
.legend-swatch.success{background:var(--success);}
.legend-swatch.amber{background:var(--amber);}
.legend-swatch.danger{background:var(--danger);}
.legend-swatch.neutral{background:var(--text-dim);}
.compass{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;}
.compass-cell{background:var(--card-soft);border:1px solid var(--border);border-radius:var(--r-xs);padding:8px 6px;cursor:pointer;text-align:left;transition:all 0.12s;border-left:3px solid var(--border);display:flex;flex-direction:column;gap:2px;min-height:72px;}
.compass-cell:hover{background:var(--primary-light);border-color:var(--primary-border);border-left-color:var(--primary);}
.compass-cell.success{border-left-color:var(--success);}
.compass-cell.amber{border-left-color:var(--amber);}
.compass-cell.danger{border-left-color:var(--danger);}
.compass-cell.neutral{border-left-color:var(--text-dim);}
.compass-num{font-family:var(--mono);font-size:9px;font-weight:600;color:var(--text-dim);}
.compass-icon{font-size:13px;}
.compass-label{font-size:10px;font-weight:500;color:var(--text);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.compass-state{font-size:9px;font-weight:600;color:var(--text-dim);margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.compass-cell.success .compass-state{color:var(--success);}
.compass-cell.amber .compass-state{color:var(--amber);}
.compass-cell.danger .compass-state{color:var(--danger);}

/* FILTER BAR */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.filter-chip{padding:5px 12px;border-radius:var(--r-sm);font-size:12.5px;border:1px solid var(--border);background:var(--card);color:var(--text-muted);cursor:pointer;font-weight:500;transition:all 0.12s;}
.filter-chip:hover{background:var(--card-soft);color:var(--text);}
.filter-chip.active{background:var(--primary-light);color:var(--primary);border-color:var(--primary-border);}
.filter-count{margin-left:auto;font-size:11.5px;color:var(--text-dim);font-family:var(--mono);}
.expand-actions{margin-left:auto;display:flex;gap:6px;}

/* GRID */
.grid-2col{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;}
.main-col{display:flex;flex-direction:column;gap:20px;min-width:0;}
.side-col{display:flex;flex-direction:column;gap:16px;position:sticky;top:24px;}

/* FACETS */
.facets-section{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
.facets-section-head{padding:16px 20px;border-bottom:1px solid var(--border);}
.facets-section-title{font-size:13px;font-weight:600;letter-spacing:0.02em;text-transform:uppercase;color:var(--text-muted);}
.facets-section-sub{font-size:12.5px;color:var(--text-muted);margin-top:3px;line-height:1.5;}
.facets-list{padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px;}
.facet{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-md);overflow:hidden;border-left:3px solid var(--border);transition:all 0.15s;scroll-margin-top:20px;}
.facet.success{border-left-color:var(--success);}
.facet.amber{border-left-color:var(--amber);}
.facet.danger{border-left-color:var(--danger);}
.facet.neutral{border-left-color:var(--text-dim);}
.facet.pulse{animation:facetPulse 1.2s ease;}
@keyframes facetPulse{0%{box-shadow:0 0 0 0 rgba(67,56,202,0.4);}70%{box-shadow:0 0 0 12px rgba(67,56,202,0);}100%{box-shadow:0 0 0 0 rgba(67,56,202,0);}}
.facet-head{width:100%;padding:13px 16px;text-align:left;display:flex;align-items:center;gap:12px;background:transparent;transition:background 0.1s;}
.facet-head:hover{background:var(--card-soft);}
.facet-num{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-dim);width:22px;flex-shrink:0;}
.facet-icon{font-size:15px;flex-shrink:0;}
.facet-label{flex:1;font-size:13.5px;font-weight:500;color:var(--text);min-width:0;line-height:1.35;}
.facet-state{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;flex-shrink:0;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.facet-state.success{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);}
.facet-state.amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.facet-state.danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);}
.facet-state.neutral{background:var(--card-soft);color:var(--text-muted);border:1px solid var(--border);}
.facet-chev{color:var(--text-dim);transition:transform 0.15s;font-size:11px;flex-shrink:0;}
.facet.open .facet-chev{transform:rotate(180deg);}
.facet-body{display:none;padding:0 16px 16px 50px;}
.facet.open .facet-body{display:block;}
.facet-summary{font-size:12.5px;color:var(--text-secondary);line-height:1.55;padding:10px 12px;background:var(--card-soft);border-radius:var(--r-xs);margin-bottom:12px;border:1px solid var(--border);}
.facet-facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-bottom:12px;}
.facet-fact{display:flex;gap:8px;font-size:12px;align-items:baseline;}
.facet-fact-label{color:var(--text-muted);min-width:120px;flex-shrink:0;}
.facet-fact-value{color:var(--text);font-weight:500;word-break:break-word;}
.facet-fact-value.mono{font-family:var(--mono);font-size:11px;}
.facet-evidence{margin-top:10px;padding-top:12px;border-top:1px solid var(--border);}
.facet-evidence-title{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:8px;}
.ev-item{display:flex;gap:10px;font-size:12px;align-items:flex-start;margin-bottom:6px;}
.ev-item:last-child{margin-bottom:0;}
.ev-ref{font-family:var(--mono);font-size:10.5px;color:var(--primary);background:var(--primary-light);padding:1px 6px;border-radius:3px;flex-shrink:0;margin-top:1px;}
.ev-summary{color:var(--text-muted);line-height:1.5;}
.facet-next{margin-top:12px;padding:10px 14px;background:var(--primary-light);border:1px dashed var(--primary-border);border-radius:var(--r-xs);font-size:12.5px;color:var(--text);line-height:1.55;display:flex;gap:10px;align-items:flex-start;}
.facet-next strong{color:var(--primary);font-weight:600;flex-shrink:0;}
.facet.danger .facet-next{background:var(--danger-bg);border-color:var(--danger-border);}
.facet.danger .facet-next strong{color:var(--danger);}

/* SECTIONS */
.section{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);}
.section-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.section-title{font-size:13px;font-weight:600;letter-spacing:0.02em;text-transform:uppercase;color:var(--text-muted);}
.section-sub{font-size:12.5px;color:var(--text-muted);margin-top:3px;line-height:1.5;}
.section-pad{padding:20px 22px;}

/* TESTSPEC */
.testspec-card{background:var(--card-soft);border:1px solid var(--border);border-radius:var(--r-sm);padding:16px;margin-bottom:14px;}
.testspec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.testspec-version{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);}
.testspec-digest{font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-top:3px;word-break:break-all;}
.testspec-status{font-size:11px;font-weight:600;padding:3px 10px;border-radius:5px;white-space:nowrap;}
.testspec-status.success{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);}
.testspec-status.amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.testspec-status.danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);}
.testspec-status.neutral{background:var(--card-soft);color:var(--text-muted);border:1px solid var(--border);}

.approval-chain{display:flex;flex-direction:column;gap:0;padding:8px 0 4px;}
.approval-step{display:flex;align-items:flex-start;gap:12px;padding:8px 0;position:relative;}
.approval-step:not(:last-child)::before{content:'';position:absolute;left:9px;top:26px;bottom:-8px;width:2px;background:var(--border);z-index:0;}
.approval-step.done:not(:last-child)::before{background:var(--success);}
.approval-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;z-index:1;position:relative;}
.approval-icon.done{background:var(--success);color:white;border:1px solid var(--success);}
.approval-icon.active{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);animation:approvalPulse 1.5s ease-in-out infinite;}
@keyframes approvalPulse{0%,100%{box-shadow:0 0 0 0 rgba(181,71,8,0.3);}50%{box-shadow:0 0 0 6px rgba(181,71,8,0);}}
.approval-icon.pending{background:var(--card);color:var(--text-dim);border:1px solid var(--border);}
.approval-icon.blocked{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);}
.approval-body{flex:1;min-width:0;padding-top:1px;}
.approval-title{font-size:12.5px;font-weight:500;color:var(--text);margin-bottom:2px;}
.approval-step.pending .approval-title{color:var(--text-dim);}
.approval-step.blocked .approval-title{color:var(--danger);}
.approval-meta{font-size:11px;color:var(--text-muted);font-family:var(--mono);}

.result-block{padding:14px 16px;border-radius:var(--r-sm);border:1px solid var(--border);}
.result-block.success{background:var(--success-bg);border-color:var(--success-border);}
.result-block.amber{background:var(--amber-bg);border-color:var(--amber-border);}
.result-block.danger{background:var(--danger-bg);border-color:var(--danger-border);}
.result-block.neutral{background:var(--card-soft);}
.result-title{font-weight:600;font-size:13.5px;margin-bottom:5px;display:flex;align-items:center;gap:8px;}
.result-block.success .result-title{color:var(--success);}
.result-block.amber .result-title{color:var(--amber);}
.result-block.danger .result-title{color:var(--danger);}
.result-block.neutral .result-title{color:var(--text);}
.result-detail{font-size:12.5px;color:var(--text-muted);line-height:1.55;}

/* RESPONSE TIMELINE */
.response-timeline{position:relative;padding-left:26px;}
.response-timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border);}
.response-step{position:relative;padding:10px 0 14px;}
.response-step:last-child{padding-bottom:0;}
.response-step::before{content:'';position:absolute;left:-26px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--border-hover);}
.response-step.done::before{background:var(--success);border-color:var(--success);}
.response-step.active::before{background:var(--amber-bg);border-color:var(--amber);animation:approvalPulse 1.5s ease-in-out infinite;}
.response-step.pending::before{background:var(--card);border-color:var(--border);}
.response-step-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:2px;flex-wrap:wrap;}
.response-step-title{font-weight:500;font-size:13px;color:var(--text);}
.response-step.done .response-step-title{color:var(--success);}
.response-step.active .response-step-title{color:var(--amber);font-weight:600;}
.response-step.pending .response-step-title{color:var(--text-dim);}
.response-step-time{font-family:var(--mono);font-size:11px;color:var(--text-muted);}
.response-step-detail{font-size:12px;color:var(--text-muted);line-height:1.55;}

/* FRAMEWORKS */
.frameworks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
.framework-card{background:var(--card-soft);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;}
.framework-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;}
.framework-ref{font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-bottom:6px;}
.framework-note{font-size:11px;color:var(--text-dim);font-style:italic;line-height:1.4;}

/* HISTORY */
.history-list{display:flex;flex-direction:column;gap:0;}
.history-item{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--border);font-size:12.5px;align-items:baseline;}
.history-item:last-child{border-bottom:none;}
.history-time{font-family:var(--mono);font-size:11px;color:var(--text-muted);flex-shrink:0;min-width:150px;}
.history-what{flex:1;color:var(--text);line-height:1.5;}
.history-by{color:var(--text-muted);font-size:11.5px;flex-shrink:0;}

/* SIDE CARDS */
.side-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 20px;}
.side-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:12px;}
.next-action{background:linear-gradient(135deg,var(--primary-light) 0%,var(--card) 100%);border:1px solid var(--primary-border);}
.next-action.success{background:linear-gradient(135deg,var(--success-bg) 0%,var(--card) 100%);border-color:var(--success-border);}
.next-action.danger{background:linear-gradient(135deg,var(--danger-bg) 0%,var(--card) 100%);border-color:var(--danger-border);}
.next-action-eyebrow{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--primary);margin-bottom:8px;}
.next-action.success .next-action-eyebrow{color:var(--success);}
.next-action.danger .next-action-eyebrow{color:var(--danger);}
.next-action-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.35;}
.next-action-detail{font-size:12.5px;color:var(--text-secondary);line-height:1.55;margin-bottom:14px;}
.next-action-btn{width:100%;padding:9px 12px;background:var(--primary);color:white;border-radius:8px;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.15s;}
.next-action-btn:hover{background:var(--primary-hover);}
.next-action.success .next-action-btn{background:var(--success);}
.next-action.success .next-action-btn:hover{background:#055a37;}
.next-action.danger .next-action-btn{background:var(--danger);}
.next-action.danger .next-action-btn:hover{background:#8f1c13;}

.meta-list{display:flex;flex-direction:column;gap:10px;}
.meta-row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;align-items:baseline;}
.meta-label{color:var(--text-muted);flex-shrink:0;}
.meta-value{color:var(--text);font-weight:500;text-align:right;word-break:break-word;}
.meta-value.mono{font-family:var(--mono);font-size:11.5px;}

.side-actions{display:flex;flex-direction:column;gap:8px;}
.side-action{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--card);text-align:left;transition:all 0.12s;font-size:13px;color:var(--text);}
.side-action:hover{border-color:var(--primary);background:var(--primary-light);}
.side-action:disabled{opacity:0.5;cursor:not-allowed;}
.side-action:disabled:hover{border-color:var(--border);background:var(--card);}
.side-action-icon{font-size:14px;flex-shrink:0;}
.side-action-body{flex:1;min-width:0;}
.side-action-title{font-weight:500;font-size:13px;}
.side-action-detail{font-size:11.5px;color:var(--text-muted);margin-top:1px;line-height:1.4;}
.side-action-arrow{color:var(--text-dim);font-size:13px;flex-shrink:0;}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,41,0.5);opacity:0;pointer-events:none;transition:opacity 0.2s;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.open{opacity:1;pointer-events:auto;}
.modal{background:var(--card);border-radius:var(--r-lg);max-width:560px;width:100%;box-shadow:var(--sh-4);transform:scale(0.96);transition:transform 0.2s;overflow:hidden;}
.modal-backdrop.open .modal{transform:scale(1);}
.modal-head{padding:22px 26px 14px;}
.modal-title{font-size:17px;font-weight:600;margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--text-muted);line-height:1.55;}
.modal-body{padding:18px 26px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:13px;line-height:1.6;}
.modal-foot{padding:14px 26px;display:flex;gap:8px;justify-content:flex-end;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:white;padding:11px 20px;border-radius:var(--r-sm);font-size:13px;z-index:100;box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:all 0.2s;max-width:520px;text-align:center;line-height:1.5;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* CALLOUT */
.callout{padding:14px 18px;border-radius:var(--r-sm);font-size:13px;line-height:1.55;}
.callout-info{background:var(--primary-light);border:1px solid var(--primary-border);color:var(--text);}
.callout-info strong{color:var(--primary);font-weight:600;}
.callout-warn{background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber);}

/* PRINT */
@media print{
  body{background:white;}
  .page{padding:0;max-width:none;}
  .header-right,.side-col,.modal-backdrop,.toast,.facet-head,.scenario-tabs,.filter-bar,.expand-actions{display:none !important;}
  .facet .facet-body{display:block !important;padding:16px !important;}
  .facet .facet-chev{display:none;}
  .facet{page-break-inside:avoid;}
}

/* RESPONSIVE */
@media (max-width:1200px){
  .grid-2col{grid-template-columns:minmax(0,1fr);}
  .side-col{position:static;display:grid;grid-template-columns:repeat(2,1fr);}
}
@media (max-width:1100px){
  .compass{grid-template-columns:repeat(6,1fr);}
  .compass-cell{min-height:64px;}
}
@media (max-width:900px){
  .page{padding:16px;}
  .compass{grid-template-columns:repeat(4,1fr);}
  .control-summary-stats{grid-template-columns:1fr 1fr;}
  .facet-facts{grid-template-columns:1fr;gap:6px;}
  .facet-body{padding-left:16px;}
  .side-col{grid-template-columns:1fr;}
  .frameworks-grid{grid-template-columns:1fr;}
  .scenario-tab{font-size:12px;padding:6px 10px;}
}
@media (max-width:600px){
  h1{font-size:20px;}
  .control-title{font-size:16px;}
  .compass{grid-template-columns:repeat(3,1fr);}
  .compass-label{font-size:9px;}
  .facet-state{max-width:120px;font-size:10px;}
  .history-item{flex-direction:column;gap:4px;align-items:flex-start;}
  .history-time{min-width:auto;}
  .approval-step{padding:6px 0;}
  .control-summary{padding:18px 20px;}
}
</style>

/* ═══════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════ */

const state = {
  scenario: 'mixed',
  filter: 'all',
  openFacets: new Set(['target-integration','monitoring','test-replay'])
};

function currentScenario() { return SCENARIOS[state.scenario]; }

/* ═══════════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════════ */

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),3200);
}

function setScenario(id){
  state.scenario = id;
  state.filter = 'all';
  // Auto-open first non-success facet
  const sc = currentScenario();
  const firstIssue = sc.facets.find(f => f.tone !== 'success');
  state.openFacets = new Set(firstIssue ? [firstIssue.id] : []);
  render();
  document.getElementById('main-content').scrollIntoView({behavior:'smooth',block:'start'});
}

function jumpToFacet(facetId){
  state.openFacets.add(facetId);
  render();
  // Scroll to facet after render
  setTimeout(()=>{
    const el = document.getElementById('facet-'+facetId);
    if(el){
      el.scrollIntoView({behavior:'smooth',block:'center'});
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
      setTimeout(()=>el.classList.remove('pulse'), 1300);
    }
  }, 30);
}

function toggleFacet(facetId){
  if(state.openFacets.has(facetId)) state.openFacets.delete(facetId);
  else state.openFacets.add(facetId);
  render();
}

function expandAll(){
  const sc = currentScenario();
  state.openFacets = new Set(sc.facets.map(f=>f.id));
  render();
}

function collapseAll(){
  state.openFacets = new Set();
  render();
}

/* ═══════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════ */

function render(){
  renderTabs();
  const sc = currentScenario();
  document.getElementById('main-content').innerHTML = `
    ${renderControlSummary(sc)}
    ${renderCompass(sc)}
    <div class="filter-bar">
      <button class="filter-chip ${state.filter==='all'?'active':''}" onclick="state.filter='all';render()">All facets (${sc.facets.length})</button>
      <button class="filter-chip ${state.filter==='qualified'?'active':''}" onclick="state.filter='qualified';render()">Qualified (${sc.facets.filter(f=>f.tone==='success').length})</button>
      <button class="filter-chip ${state.filter==='attention'?'active':''}" onclick="state.filter='attention';render()">Needs attention (${sc.facets.filter(f=>f.tone==='amber'||f.tone==='danger').length})</button>
      <button class="filter-chip ${state.filter==='na'?'active':''}" onclick="state.filter='na';render()">Not applicable (${sc.facets.filter(f=>f.tone==='neutral').length})</button>
      <div class="expand-actions">
        <button class="btn btn-ghost btn-sm" onclick="expandAll()">Expand all</button>
        <button class="btn btn-ghost btn-sm" onclick="collapseAll()">Collapse all</button>
      </div>
    </div>
    <div class="grid-2col">
      <div class="main-col">
        ${renderFacetsSection(sc)}
        ${sc.testSpec ? renderTestSpec(sc.testSpec) : ''}
        ${renderResponse(sc.response)}
        ${renderFrameworks(sc.frameworks)}
        ${renderHistory(sc.history)}
      </div>
      <aside class="side-col">
        ${renderNextAction(sc.nextAction)}
        ${renderMetadata(sc)}
        ${renderQuickActions(sc)}
      </aside>
    </div>
  `;
}

function renderTabs(){
  const el = document.getElementById('scenario-tabs');
  el.innerHTML = Object.values(SCENARIOS).map(s => `
    <button class="scenario-tab ${s.id===state.scenario?'active':''}" onclick="setScenario('${s.id}')">
      <span class="tab-dot ${s.tone}"></span>${esc(s.tabLabel)}
    </button>
  `).join('');
}

function renderControlSummary(sc){
  return `
    <div class="control-summary ${sc.tone}">
      <div class="control-summary-top">
        <div class="control-summary-left">
          <div class="control-id-label">${esc(sc.controlId)} · ${esc(sc.family)}</div>
          <div class="control-title">${esc(sc.title)}</div>
          <div class="control-summary-desc">${esc(sc.summary)}</div>
        </div>
        <div class="control-verdict-badge ${sc.tone}">
          ${sc.qualified}/12 facets qualified
          ${sc.attention ? ` · ${sc.attention} need attention` : ''}
          ${sc.blocked ? ` · ${sc.blocked} blocked` : ''}
        </div>
      </div>
      <div class="control-summary-stats">
        <div class="summary-stat">
          <div class="summary-stat-label">Qualified</div>
          <div class="summary-stat-value qualified">${sc.qualified} of 12</div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">Need attention</div>
          <div class="summary-stat-value attention">${sc.attention}</div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">Blocked</div>
          <div class="summary-stat-value blocked">${sc.blocked}</div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">Owner</div>
          <div class="summary-stat-value" style="font-size:12px;">${esc(sc.owner)}</div>
        </div>
      </div>
    </div>
  `;
}

function renderCompass(sc){
  return `
    <div class="compass-wrap">
      <div class="compass-head">
        <div class="compass-title">12-facet operational lifecycle</div>
        <div class="compass-legend">
          <span class="legend-item"><span class="legend-swatch success"></span>Qualified</span>
          <span class="legend-item"><span class="legend-swatch amber"></span>Attention</span>
          <span class="legend-item"><span class="legend-swatch danger"></span>Blocked / failed</span>
          <span class="legend-item"><span class="legend-swatch neutral"></span>Not applicable</span>
        </div>
      </div>
      <div class="compass">
        ${sc.facets.map((f, i) => `
          <button class="compass-cell ${f.tone}" onclick="jumpToFacet('${f.id}')" title="${esc(f.label)}">
            <span class="compass-num">${String(i+1).padStart(2,'0')}</span>
            <span class="compass-icon">${f.icon}</span>
            <span class="compass-label">${esc(f.label.split('·')[0].trim())}</span>
            <span class="compass-state">${esc(f.state)}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function renderFacetsSection(sc){
  let facets = sc.facets;
  if (state.filter === 'qualified') facets = facets.filter(f => f.tone === 'success');
  else if (state.filter === 'attention') facets = facets.filter(f => f.tone === 'amber' || f.tone === 'danger');
  else if (state.filter === 'na') facets = facets.filter(f => f.tone === 'neutral');

  return `
    <div class="facets-section">
      <div class="facets-section-head">
        <div class="facets-section-title">12 operational facets</div>
        <div class="facets-section-sub">Each facet is qualified independently — by a different source, actor, and time basis. A control with ${sc.qualified}/12 facets qualified is not "${Math.round(sc.qualified/12*100)}% passed" — it is in a specific operational state that depends on which facets. Click any facet to expand.</div>
      </div>
      <div class="facets-list">
        ${facets.length ? facets.map(f => renderFacet(f, sc.facets.indexOf(f))).join('') : '<div style="text-align:center;padding:32px 20px;color:var(--text-muted);font-size:13px;">No facets match this filter.</div>'}
      </div>
    </div>
  `;
}

function renderFacet(f, index){
  const open = state.openFacets.has(f.id);
  const stateLabel = f.state;
  return `
    <div class="facet ${f.tone} ${open?'open':''}" id="facet-${f.id}">
      <button class="facet-head" onclick="toggleFacet('${f.id}')">
        <span class="facet-num">${String(index+1).padStart(2,'0')}</span>
        <span class="facet-icon">${f.icon}</span>
        <span class="facet-label">${esc(f.label)}</span>
        <span class="facet-state ${f.tone}">${esc(stateLabel)}</span>
        <span class="facet-chev">▼</span>
      </button>
      <div class="facet-body">
        <div class="facet-summary">${esc(f.summary)}</div>
        <div class="facet-facts">
          ${f.facts.map(x => `
            <div class="facet-fact">
              <span class="facet-fact-label">${esc(x.l)}</span>
              <span class="facet-fact-value ${x.m?'mono':''}">${esc(x.v)}</span>
            </div>
          `).join('')}
        </div>
        ${f.evidence && f.evidence.length ? `
          <div class="facet-evidence">
            <div class="facet-evidence-title">Evidence references (${f.evidence.length})</div>
            ${f.evidence.map(ev => `
              <div class="ev-item">
                <span class="ev-ref">${esc(ev.ref)}</span>
                <span class="ev-summary">${esc(ev.s)}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
        ${f.next ? `
          <div class="facet-next">
            <strong>Next step:</strong>
            <span>${esc(f.next.text)}</span>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function renderTestSpec(ts){
  return `
    <div class="section">
      <div class="section-head">
        <div>
          <div class="section-title">TestSpec & execution</div>
          <div class="section-sub">Versioned, digest-bound. Test approval ≠ deployment approval. Approval is required before execution.</div>
        </div>
      </div>
      <div class="section-pad">
        <div class="testspec-card">
          <div class="testspec-head">
            <div>
              <div class="testspec-version">${esc(ts.version)}</div>
              <div class="testspec-digest">${esc(ts.digest)}</div>
            </div>
            <span class="testspec-status ${ts.tone}">${esc(ts.status)}</span>
          </div>
          <div class="approval-chain">
            ${ts.chain.map(step => `
              <div class="approval-step ${step.status}">
                <div class="approval-icon ${step.status}">${step.status==='done'?'✓':step.status==='active'?'●':step.status==='blocked'?'×':'·'}</div>
                <div class="approval-body">
                  <div class="approval-title">${esc(step.title)}</div>
                  <div class="approval-meta">${esc(step.by)} · ${esc(step.at)}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="result-block ${ts.result.tone}">
          <div class="result-title">
            ${ts.result.tone==='success'?'✓':ts.result.tone==='danger'?'⚠':ts.result.tone==='amber'?'◐':'·'}
            ${esc(ts.result.label)}
          </div>
          <div class="result-detail">${esc(ts.result.detail)}</div>
        </div>
      </div>
    </div>
  `;
}

function renderResponse(resp){
  if (!resp.hasResponse) {
    return `
      <div class="section">
        <div class="section-head">
          <div>
            <div class="section-title">Response & retest workflow</div>
            <div class="section-sub">Notification delivery ≠ ACK ≠ remediation ≠ RETEST_VERIFIED. Each state is tracked independently.</div>
          </div>
        </div>
        <div class="section-pad">
          <div class="callout callout-info" style="font-size:13px;">
            ${esc(resp.note)}
          </div>
        </div>
      </div>
    `;
  }

  return `
    <div class="section">
      <div class="section-head">
        <div>
          <div class="section-title">Response & retest workflow</div>
          <div class="section-sub">Notification delivery ≠ ACK ≠ remediation ≠ RETEST_VERIFIED. Only RETEST_VERIFIED clears the revalidation block.</div>
        </div>
        <span class="chip chip-${resp.tone}">${resp.steps.filter(s=>s.status==='done').length}/${resp.steps.length} complete</span>
      </div>
      <div class="section-pad">
        <div class="response-timeline">
          ${resp.steps.map(step => `
            <div class="response-step ${step.status}">
              <div class="response-step-head">
                <span class="response-step-title">${esc(step.title)}</span>
                <span class="response-step-time">${esc(step.time)}</span>
              </div>
              <div class="response-step-detail">${esc(step.detail)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderFrameworks(frameworks){
  if (!frameworks || !frameworks.length) return '';
  return `
    <div class="section">
      <div class="section-head">
        <div>
          <div class="section-title">Related frameworks</div>
          <div class="section-sub">Mappings provide context. Mapping ≠ applicability ≠ assessed obligation ≠ certified compliance.</div>
        </div>
      </div>
      <div class="section-pad">
        <div class="frameworks-grid">
          ${frameworks.map(f => `
            <div class="framework-card">
              <div class="framework-name">${esc(f.name)}</div>
              <div class="framework-ref">${esc(f.ref)}</div>
              <div class="framework-note">${esc(f.note)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderHistory(history){
  if (!history || !history.length) return '';
  return `
    <div class="section">
      <div class="section-head">
        <div>
          <div class="section-title">Change history</div>
          <div class="section-sub">Every configuration, authorization, execution and response event is recorded with actor and time.</div>
        </div>
      </div>
      <div class="section-pad">
        <div class="history-list">
          ${history.map(h => `
            <div class="history-item">
              <span class="history-time">${esc(h.time)}</span>
              <span class="history-what">${esc(h.what)}</span>
              <span class="history-by">${esc(h.by)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderNextAction(na){
  if (!na) return '';
  return `
    <div class="side-card next-action ${na.tone}">
      <div class="next-action-eyebrow">Next best action</div>
      <div class="next-action-title">${esc(na.title)}</div>
      <div class="next-action-detail">${esc(na.detail)}</div>
      <button class="next-action-btn" onclick="handleNextAction('${na.action}')">${esc(na.cta)}</button>
    </div>
  `;
}

function renderMetadata(sc){
  return `
    <div class="side-card">
      <div class="side-title">Control metadata</div>
      <div class="meta-list">
        <div class="meta-row"><span class="meta-label">Control ID</span><span class="meta-value mono">${esc(sc.controlId)}</span></div>
        <div class="meta-row"><span class="meta-label">Objective</span><span class="meta-value" style="text-align:right;font-size:12px;">${esc(sc.title)}</span></div>
        <div class="meta-row"><span class="meta-label">Family</span><span class="meta-value">${esc(sc.family)}</span></div>
        <div class="meta-row"><span class="meta-label">Owner</span><span class="meta-value" style="font-size:12px;">${esc(sc.owner)}</span></div>
        <div class="meta-row"><span class="meta-label">Version</span><span class="meta-value mono" style="font-size:11px;">${esc(sc.version)}</span></div>
        <div class="meta-row"><span class="meta-label">System</span><span class="meta-value">Support Agent v2</span></div>
      </div>
    </div>
  `;
}

function renderQuickActions(sc){
  const canRunTest = !!(sc.testSpec && sc.testSpec.status === 'EXECUTED');
  const canConfigure = sc.tone !== 'danger' || state.scenario === 'failed';
  return `
    <div class="side-card">
      <div class="side-title">Actions</div>
      <div class="side-actions">
        <button class="side-action" onclick="previewConfigure()">
          <span class="side-action-icon">⚙️</span>
          <div class="side-action-body">
            <div class="side-action-title">Configure</div>
            <div class="side-action-detail">Open policy editor (preview)</div>
          </div>
          <span class="side-action-arrow">→</span>
        </button>
        <button class="side-action" ${!canRunTest?'disabled':''} onclick="${canRunTest?'previewRunTest()':'toast(\'Test execution blocked — see test facet for details\')'}">
          <span class="side-action-icon">🧪</span>
          <div class="side-action-body">
            <div class="side-action-title">Run test</div>
            <div class="side-action-detail">${canRunTest?'Executes TestSpec (preview)':'Blocked by activation or approval'}</div>
          </div>
          <span class="side-action-arrow">→</span>
        </button>
        <button class="side-action" onclick="previewExport()">
          <span class="side-action-icon">↓</span>
          <div class="side-action-body">
            <div class="side-action-title">Export receipt</div>
            <div class="side-action-detail">Full control receipt (preview)</div>
          </div>
          <span class="side-action-arrow">→</span>
        </button>
        <button class="side-action" onclick="previewAuditLog()">
          <span class="side-action-icon">📋</span>
          <div class="side-action-body">
            <div class="side-action-title">Open audit log</div>
            <div class="side-action-detail">Full event history</div>
          </div>
          <span class="side-action-arrow">→</span>
        </button>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════
   ACTION HANDLERS
   ═══════════════════════════════════════════════ */

function handleNextAction(action){
  const sc = currentScenario();
  if (action === 'receipt') {
    previewExport();
  } else if (action === 'config') {
    previewConfigure();
  } else if (action === 'assign') {
    openModal({
      title:'Assign a reviewer',
      sub:'This is a preview. Real reviewer assignment requires authenticated write, an eligible org member, and SoD validation (reviewer ≠ requester).',
      body:`
        <div style="font-size:13px;line-height:1.6;">
          <div style="margin-bottom:12px;"><strong>Request:</strong> Configuration v13-draft for ${esc(sc.controlId)} on Support Agent v2</div>
          <div style="margin-bottom:12px;"><strong>Requester:</strong> bob.kumar@example.com</div>
          <div style="margin-bottom:12px;"><strong>Required:</strong> A reviewer different from the requester (separation of duties)</div>
          <div style="padding:10px 12px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--r-xs);font-size:12px;color:var(--amber);">
            <strong>Note:</strong> In production this opens a reviewer picker filtered to eligible org members with appropriate roles. The reviewer is notified in-app, and can then open the exact decision packet to approve, reject, or request changes.
          </div>
        </div>
      `,
      buttons:[
        {label:'Cancel',style:'ghost',action:closeModal},
        {label:'Preview only — not executed',style:'primary',disabled:true}
      ]
    });
  } else if (action === 'response') {
    openModal({
      title:'Open response workflow',
      sub:'This is a preview. The full response timeline is visible in the section below — this modal would open a dedicated workflow view.',
      body:`
        <div style="font-size:13px;line-height:1.6;">
          <div style="margin-bottom:8px;"><strong>Incident:</strong> INC-2026-10-17-003</div>
          <div style="margin-bottom:8px;"><strong>Current step:</strong> Remediation in progress (step 5 of 7)</div>
          <div style="margin-bottom:8px;"><strong>Owner:</strong> bob.kumar@example.com (assigned)</div>
          <div style="margin-bottom:8px;"><strong>ETA:</strong> 2026-10-17 18:00 UTC (code review in progress)</div>
          <div style="padding:10px 12px;background:var(--primary-light);border:1px solid var(--primary-border);border-radius:var(--r-xs);font-size:12px;color:var(--primary);">
            <strong>Required:</strong> Complete remediation → independent retest → RETEST_VERIFIED. Only RETEST_VERIFIED clears the revalidation block.
          </div>
        </div>
      `,
      buttons:[
        {label:'Close',style:'ghost',action:closeModal},
        {label:'Open workflow (preview)',style:'primary',disabled:true}
      ]
    });
  }
}

function previewConfigure(){
  const sc = currentScenario();
  openModal({
    title:'Open configuration editor',
    sub:'This is a preview. In production, this opens the versioned policy editor for this control.',
    body:`
      <div style="font-size:13px;line-height:1.6;">
        <div style="margin-bottom:8px;"><strong>Current configuration:</strong> ${sc.facets.find(f=>f.id==='configuration').state}</div>
        <div style="margin-bottom:8px;"><strong>Owner:</strong> ${esc(sc.owner)}</div>
        <div style="padding:10px 12px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--r-xs);font-size:12px;color:var(--amber);">
          <strong>Note:</strong> Editing creates a new draft. Config changes require approval by a named human before they affect enforcement or evaluation.
        </div>
      </div>
    `,
    buttons:[
      {label:'Cancel',style:'ghost',action:closeModal},
      {label:'Open editor (preview)',style:'primary',disabled:true}
    ]
  });
}

function previewRunTest(){
  const sc = currentScenario();
  openModal({
    title:'Run control test',
    sub:'This is a preview. In production, running a test requires an approved TestSpec, durable-store activation, and may produce a finding.',
    body:`
      <div style="font-size:13px;line-height:1.6;">
        <div style="margin-bottom:8px;"><strong>TestSpec:</strong> ${esc(sc.testSpec.version)}</div>
        <div style="margin-bottom:8px;"><strong>Approved by:</strong> bob.kumar@example.com</div>
        <div style="margin-bottom:8px;"><strong>Current state:</strong> ${esc(sc.testSpec.status)}</div>
        <div style="padding:10px 12px;background:var(--primary-light);border:1px solid var(--primary-border);border-radius:var(--r-xs);font-size:12px;color:var(--primary);">
          <strong>What would happen:</strong> The engine would re-execute the TestSpec against a fresh frozen evidence basis, produce a result (NO_FINDING_OBSERVED, DETECTED_FINDING, or COVERAGE_INSUFFICIENT), confirm the replay digest, and store an immutable receipt.
        </div>
      </div>
    `,
    buttons:[
      {label:'Cancel',style:'ghost',action:closeModal},
      {label:'Run test (preview)',style:'primary',disabled:true}
    ]
  });
}

function previewExport(){
  const sc = currentScenario();
  openModal({
    title:'Export control receipt',
    sub:'This is a preview. In production, this produces a signed PDF containing all twelve facets, TestSpec, execution result, and response history.',
    body:`
      <div style="font-size:13px;line-height:1.6;">
        <div style="margin-bottom:8px;"><strong>Control:</strong> ${esc(sc.controlId)} · ${esc(sc.title)}</div>
        <div style="margin-bottom:8px;"><strong>Facets qualified:</strong> ${sc.qualified} of 12</div>
        <div style="margin-bottom:8px;"><strong>Frozen at:</strong> 2026-10-17 14:22 UTC</div>
        <div style="padding:10px 12px;background:var(--primary-light);border:1px solid var(--primary-border);border-radius:var(--r-xs);font-size:12px;color:var(--primary);">
          <strong>Receipt includes:</strong> per-facet state and evidence references, TestSpec approval chain, execution result and replay digest, response workflow timeline, framework mappings (labeled as context, not certification).
        </div>
      </div>
    `,
    buttons:[
      {label:'Cancel',style:'ghost',action:closeModal},
      {label:'Export PDF (preview)',style:'primary',disabled:true}
    ]
  });
}

function previewAuditLog(){
  openModal({
    title:'Open audit log',
    sub:'This is a preview. In production, this opens the full append-only event log for this control.',
    body:`
      <div style="font-size:13px;line-height:1.6;">
        <div style="margin-bottom:8px;"><strong>Events in the last 90 days:</strong> ${currentScenario().history.length} shown above, more in full log</div>
        <div style="margin-bottom:8px;"><strong>Includes:</strong> configuration changes, approvals, deployments, test executions, response events, revocations</div>
        <div style="padding:10px 12px;background:var(--primary-light);border:1px solid var(--primary-border);border-radius:var(--r-xs);font-size:12px;color:var(--primary);">
          <strong>Note:</strong> The audit log is append-only and digest-bound. Records cannot be deleted or modified — only appended.
        </div>
      </div>
    `,
    buttons:[
      {label:'Close',style:'ghost',action:closeModal}
    ]
  });
}

/* ═══════════════════════════════════════════════
   MODAL CHROME
   ═══════════════════════════════════════════════ */

function openModal({title,sub,body,buttons}){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-sub').textContent=sub;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-foot').innerHTML=buttons.map(b=>
    `<button class="btn btn-${b.style==='primary'?'primary':b.style==='ghost'?'ghost':'secondary'}" ${b.disabled?'disabled style="opacity:0.5;cursor:not-allowed;"':''} onclick="${b.disabled?'':(b.action===closeModal?'closeModal()':b.action)}">${esc(b.label)}</button>`
  ).join('');
  document.getElementById('modal-backdrop').classList.add('open');
}

function closeModal(){
  document.getElementById('modal-backdrop').classList.remove('open');
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && document.getElementById('modal-backdrop').classList.contains('open')){
    closeModal();
  }
});

/* ═══════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════ */

render();
</script>

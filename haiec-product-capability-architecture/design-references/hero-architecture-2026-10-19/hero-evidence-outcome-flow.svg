<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img" aria-labelledby="ft fd"><title id="ft">HAIEC Evidence, Authority and Outcome Flow</title><desc id="fd">Illustrative flow from request through AI agent, tools, effective identity, possible action and effect, with five separate evidence planes and explicit evidence frontier. A causal path is not necessarily executable or observed.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08172b"/><stop offset="1" stop-color="#0a1030"/></linearGradient><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#172e53"/><stop offset="1" stop-color="#161e45"/></linearGradient><radialGradient id="halo"><stop stop-color="#325bc0" stop-opacity=".25"/><stop offset="1" stop-color="#325bc0" stop-opacity="0"/></radialGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#385a83" stroke-opacity=".13" stroke-width="1"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="12"/></filter><style><![CDATA[.f{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.cap{cursor:pointer}.cap:focus .cap-rect,.cap:hover .cap-rect{stroke-width:3;filter:drop-shadow(0 0 8px rgba(93,196,255,.27))}.small{font-size:14px;font-weight:450}.tag{font-size:14px;font-weight:650;letter-spacing:.12em}]]></style></defs><g class="f"><rect x="0" y="0" width="1440" height="830" rx="0" fill="url(#bg)" stroke="none" /><rect x="0" y="0" width="1440" height="830" rx="0" fill="url(#grid)" stroke="none" /><text x="42" y="53" fill="#f2f7ff" font-size="29" font-weight="790" >HAIEC / ACTION → AUTHORITY → EVIDENCE</text><text x="42" y="84" fill="#a5c2d9" font-size="17" font-weight="480" >Follow the consequential path. Stop where the available proof stops.</text><text x="42" y="125" fill="#66cafa" font-size="13" font-weight="740" letter-spacing=".12em">ILLUSTRATIVE BUSINESS ACTION</text><rect x="42" y="145" width="261" height="175" rx="16" fill="#0d2039" stroke="#43c2ff" stroke-width="1.8"/><text x="59" y="181" fill="#43c2ff" font-size="17" font-weight="750" >01</text><text x="59" y="219" fill="#e8f6ff" font-size="22" font-weight="765" >Customer request</text><text x="59" y="251" fill="#c9dbeb" font-size="15" font-weight="480" >Influence or declared intent</text><text x="59" y="292" fill="#43c2ff" font-size="13" font-weight="540" >Does not establish permission</text><path d="M303 230 L319 230" stroke="#9bc9e5" stroke-width="2.5" fill="none" stroke-dasharray="4 3"/><path d="M319 230 l-8 -5 v10 Z" fill="#9bc9e5"/><rect x="323" y="145" width="261" height="175" rx="16" fill="#0d2039" stroke="#b09bff" stroke-width="1.8"/><text x="340" y="181" fill="#b09bff" font-size="17" font-weight="750" >02</text><text x="340" y="219" fill="#e8f6ff" font-size="22" font-weight="765" >AI agent</text><text x="340" y="251" fill="#c9dbeb" font-size="15" font-weight="480" >Selected goal and tools</text><text x="340" y="292" fill="#b09bff" font-size="13" font-weight="540" >Model-visible ≠ invoked</text><path d="M584 230 L600 230" stroke="#9bc9e5" stroke-width="2.5" fill="none" stroke-dasharray="4 3"/><path d="M600 230 l-8 -5 v10 Z" fill="#9bc9e5"/><rect x="604" y="145" width="261" height="175" rx="16" fill="#0d2039" stroke="#59dacc" stroke-width="1.8"/><text x="621" y="181" fill="#59dacc" font-size="17" font-weight="750" >03</text><text x="621" y="219" fill="#e8f6ff" font-size="22" font-weight="765" >Tool / API</text><text x="621" y="251" fill="#c9dbeb" font-size="15" font-weight="480" >Handler and operation</text><text x="621" y="292" fill="#59dacc" font-size="13" font-weight="540" >Registered ≠ reachable</text><path d="M865 230 L881 230" stroke="#9bc9e5" stroke-width="2.5" fill="none" stroke-dasharray="4 3"/><path d="M881 230 l-8 -5 v10 Z" fill="#9bc9e5"/><rect x="885" y="145" width="261" height="175" rx="16" fill="#0d2039" stroke="#ffc26b" stroke-width="1.8"/><text x="902" y="181" fill="#ffc26b" font-size="17" font-weight="750" >04</text><text x="902" y="219" fill="#e8f6ff" font-size="22" font-weight="765" >Service identity</text><text x="902" y="251" fill="#c9dbeb" font-size="15" font-weight="480" >Actual grants and scope</text><text x="902" y="292" fill="#ffc26b" font-size="13" font-weight="540" >Policy ≠ effective access</text><path d="M1146 230 L1162 230" stroke="#9bc9e5" stroke-width="2.5" fill="none" stroke-dasharray="4 3"/><path d="M1162 230 l-8 -5 v10 Z" fill="#9bc9e5"/><rect x="1166" y="145" width="261" height="175" rx="16" fill="#0d2039" stroke="#fb869d" stroke-width="1.8"/><text x="1183" y="181" fill="#fb869d" font-size="17" font-weight="750" >05</text><text x="1183" y="219" fill="#e8f6ff" font-size="22" font-weight="765" >Business effect</text><text x="1183" y="251" fill="#c9dbeb" font-size="15" font-weight="480" >Possible downstream change</text><text x="1183" y="292" fill="#fb869d" font-size="13" font-weight="540" >Possible ≠ observed</text><rect x="42" y="347" width="1356" height="81" rx="16" fill="#112747" stroke="#2c83b6" /><text x="67" y="380" fill="#ddf4ff" font-size="19" font-weight="755" >WHAT DOES HAIEC QUALIFY?</text><text x="68" y="407" fill="#adcae6" font-size="17" font-weight="480" >Source identity · path reachability · specific action/resource relationship · evaluation time · gaps &amp; limitations</text><text x="42" y="465" fill="#b69aff" font-size="14" font-weight="750" letter-spacing=".13em">FIVE DISTINCT EVIDENCE PLANES</text><rect x="42" y="484" width="261" height="95" rx="13" fill="#131d3d" stroke="#7fc9ff" /><text x="57" y="516" fill="#7fc9ff" font-size="18" font-weight="730" >Requested</text><text x="57" y="544" fill="#c4d4e8" font-size="14" font-weight="460" >Declared or submitted</text><text x="57" y="563" fill="#9aacbf" font-size="12.4" font-weight="430" >Proof may be unavailable</text><rect x="323" y="484" width="261" height="95" rx="13" fill="#131d3d" stroke="#c3a6ff" /><text x="338" y="516" fill="#c3a6ff" font-size="18" font-weight="730" >Policy Authorized</text><text x="338" y="544" fill="#c4d4e8" font-size="14" font-weight="460" >Explicit intended allowance</text><text x="338" y="563" fill="#9aacbf" font-size="12.4" font-weight="430" >Proof may be unavailable</text><rect x="604" y="484" width="261" height="95" rx="13" fill="#131d3d" stroke="#ffc677" /><text x="619" y="516" fill="#ffc677" font-size="18" font-weight="730" >Effectively Granted</text><text x="619" y="544" fill="#c4d4e8" font-size="14" font-weight="460" >Connected identity and IAM</text><text x="619" y="563" fill="#9aacbf" font-size="12.4" font-weight="430" >Proof may be unavailable</text><rect x="885" y="484" width="261" height="95" rx="13" fill="#131d3d" stroke="#4ad8c6" /><text x="900" y="516" fill="#4ad8c6" font-size="18" font-weight="730" >Code Capable</text><text x="900" y="544" fill="#c4d4e8" font-size="14" font-weight="460" >Supported implemented behavior</text><text x="900" y="563" fill="#9aacbf" font-size="12.4" font-weight="430" >Proof may be unavailable</text><rect x="1166" y="484" width="261" height="95" rx="13" fill="#131d3d" stroke="#ff8fa5" /><text x="1181" y="516" fill="#ff8fa5" font-size="18" font-weight="730" >Observed</text><text x="1181" y="544" fill="#c4d4e8" font-size="14" font-weight="460" >Qualified runtime event</text><text x="1181" y="563" fill="#9aacbf" font-size="12.4" font-weight="430" >Proof may be unavailable</text><rect x="42" y="604" width="869" height="132" rx="17" fill="#161e42" stroke="#9c82ea" /><text x="68" y="641" fill="#eeeaff" font-size="23" font-weight="770" >EVIDENCE FRONTIER</text><text x="68" y="674" fill="#c9c6eb" font-size="17" font-weight="480" >Established · Partial · Candidate · Unknown · Not assessed</text><text x="68" y="705" fill="#c1bde4" font-size="14" font-weight="460" >No inferred violation, pass or runtime effect from missing evidence.</text><rect x="930" y="604" width="468" height="132" rx="17" fill="#2b1d27" stroke="#f5a76a" /><text x="953" y="641" fill="#ffdfb0" font-size="21" font-weight="750" >HUMAN &amp; TARGET OPERATIONS</text><text x="953" y="672" fill="#f8d4bb" font-size="16" font-weight="490" >Approval ≠ permission grant</text><text x="953" y="700" fill="#e6bbae" font-size="13.5" font-weight="440" >Protection only with proven target integration</text><text x="42" y="778" fill="#69d3ff" font-size="13" font-weight="740" letter-spacing=".13em">DECISION SUPPORT</text><text x="250" y="778" fill="#d6e7fa" font-size="16" font-weight="480" >Action map  →  scoped assurance  →  human review when applicable  →  receipts and verification</text><text x="42" y="815" fill="#90a8c1" font-size="13.5" font-weight="440" >ILLUSTRATIVE · Not evidence of actual target-side denial or confirmed business effect</text></g></svg>
" y="724" font-size="15" font-weight="520" fill="#394f6d" >AI Ops · Security</text><rect x="552" y="688" width="305" height="94" rx="10" fill="#ffffff" stroke="#c7d5e5" stroke-width="1.35"/><text x="565" y="724" font-size="15" font-weight="520" fill="#394f6d" >Review actual runtime signals</text><rect x="865" y="688" width="327" height="94" rx="10" fill="#ffffff" stroke="#c7d5e5" stroke-width="1.35"/><text x="878" y="724" font-size="15" font-weight="520" fill="#394f6d" >Qualified telemetry when wired</text><rect x="1200" y="688" width="304" height="94" rx="10" fill="#ffffff" stroke="#c7d5e5" stroke-width="1.35"/><text x="1213" y="724" font-size="15" font-weight="520" fill="#394f6d" >Health, observations, drift</text><rect x="36" y="790" width="290" height="94" rx="10" fill="#f6f9ff" stroke="#c7d5e5" stroke-width="1.35"/><text x="49" y="826" font-size="17" font-weight="720" fill="#214a78" >Controls &amp; Change</text><text x="49" y="859" font-size="12" font-weight="570" fill="#6a88a6" >07 · independent operation</text><rect x="333" y="790" width="211" height="94" rx="10" fill="#f6f9ff" stroke="#c7d5e5" stroke-width="1.35"/><text x="346" y="826" font-size="15" font-weight="520" fill="#394f6d" >Assurance · Compliance</text><rect x="552" y="790" width="305" height="94" rx="10" fill="#f6f9ff" stroke="#c7d5e5" stroke-width="1.35"/><text x="565" y="826" font-size="15" font-weight="520" fill="#394f6d" >Evaluate applicable controls</text><rect x="865" y="790" width="327" height="94" rx="10" fill="#f6f9ff" stroke="#c7d5e5" stroke-width="1.35"/><text x="878" y="826" font-size="15" font-weight="520" fill="#394f6d" >Selected control evidence</text><rect x="1200" y="790" width="304" height="94" rx="10" fill="#f6f9ff" stroke="#c7d5e5" stroke-width="1.35"/><text x="1213" y="826" font-size="15" font-weight="520" fill="#394f6d" >Mapped results and deltas</text><rect x="36" y="892" width="290" height="94" rx="10" fill="#ffffff" stroke="#c7d5e5" stroke-width="1.35"/><text x="49" y="928" font-size="17" font-weight="720" fill="#214a78" >Reports &amp; Verify</text><text x="49" y="961" font-size="12" font-weight="570" fill="#6a88a6" >08 · independent operation</text><rect x="333" y="892" width="211" height="94" rx="10" fill="#ffffff" stroke="#c7d5e5" stroke-width="1.35"/><text x="346" y="928" font-size="15" font-weight="520" fill="#394f6d" >Executive · Auditor</text><rect x="552" y="892" width="305" height="94" rx="10" fill="#ffffff" stroke="#c7d5e5" stroke-width="1.35"/><text x="565" y="928" font-size="15" font-weight="520" fill="#394f6d" >Explain evidence-based outcomes</text><rect x="865" y="892" width="327" height="94" rx="10" fill="#ffffff" stroke="#c7d5e5" stroke-width="1.35"/><text x="878" y="928" font-size="15" font-weight="520" fill="#394f6d" >Evaluations and receipts</text><rect x="1200" y="892" width="304" height="94" rx="10" fill="#ffffff" stroke="#c7d5e5" stroke-width="1.35"/><text x="1213" y="928" font-size="15" font-weight="520" fill="#394f6d" >Report basis, gaps, receipts</text><rect x="36" y="1020" width="1468" height="76" rx="14" fill="#edf6ff" stroke="#c6daed" stroke-width="1.35"/><text x="59" y="1052" font-size="16" font-weight="750" fill="#295a89" >OPTIONAL, NOT UNIVERSAL:</text><text x="307" y="1052" font-size="15" font-weight="485" fill="#4c6681" >Telemetry, IAM, guardrails, kill switches and specialized controls require relevant integrations and evidence.</text><text x="59" y="1081" font-size="14" font-weight="520" fill="#68809b" >The table describes availability by workflow, not eight mandatory execution stages.</text></svg>
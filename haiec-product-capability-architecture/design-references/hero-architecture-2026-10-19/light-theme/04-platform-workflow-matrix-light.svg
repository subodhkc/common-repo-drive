<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1130" viewBox="0 0 1540 1130" role="img" aria-labelledby="title description"><title id="title">HAIEC  /  Product Capability &amp; Workflow Matrix</title><desc id="description">Illustrative product design reference, not a live evaluated customer system.</desc><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif} .small{font-size:14px}</style><rect x="0" y="0" width="1540" height="1130" rx="0" fill="#fbfdff" stroke="#fbfdff" stroke-width="1.35"/><text x="36" y="50" font-size="33" font-weight="780" fill="#102449" >HAIEC  /  Product Capability &amp; Workflow Matrix</text><text x="36" y="79" font-size="17" font-weight="475" fill="#566f8d" >Who uses which workflow, the evidence it needs and the bounded results it can produce.</text><rect x="36" y="111" width="290" height="58" rx="11" fill="#e5f2ff" stroke="#bdd4e8" stroke-width="1.35"/><text x="49" y="148" font-size="15" font-weight="730" fill="#234e7b" >WORKFLOW / JOB</text><rect x="333" y="111" width="211" height="58" rx="11" fill="#e5f2ff" stroke="#bdd4e8" stroke-width="1.35"/><text x="346" y="148" font-size="15" font-weight="730" fill="#234e7b" >WHO</text><rect x="552" y="111" width="305" height="58" rx="11" fill="#e5f2ff" stroke="#bdd4e8" stroke-width="1.35"/><text x="565" y="148" font-size="15" font-weight="730" fill="#234e7b" >CORE GOAL</text><rect x="865" y="111" width="327" height="58" rx="11" fill="#e5f2ff" stroke="#bdd4e8" stroke-width="1.35"/><text x="878" y="148" font-size="15" font-weight="730" fill="#234e7b" >TYPICAL INPUT</text><rect x="1200" y="111" width="304" height="58" rx="11" fill="#e5f2ff" stroke="#bdd4e8" stroke-width="1.35"/><text x="1213" y="148" font-size="15" font-weight="730" fill="#234e7b" >OUTPUT / BOUNDARY</text><rect x="36" y="178" width="290" height="94" rx="10" fill="#f6f9ff" stroke="#c7d5e5" stroke-width="1.35"/><text x="49" y="214" font-size="17" font-weight="720" fill="#214a78" >Connect &a
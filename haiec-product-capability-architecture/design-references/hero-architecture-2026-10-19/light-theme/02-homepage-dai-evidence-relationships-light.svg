<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title description"><title id="title">HAIEC  /  Delegated Action Integrity</title><desc id="description">DAI is a deterministic comparison over qualified facts. Evidence gaps and unknowns remain visible.</desc><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif} .small{font-size:14px}</style><rect x="0" y="0" width="1440" height="880" rx="0" fill="#fbfdff" stroke="#fbfdff" stroke-width="1.35"/><text x="36" y="50" font-size="33" font-weight="780" fill="#102449" >HAIEC  /  Delegated Action Integrity</text><text x="36" y="79" font-size="17" font-weight="475" fill="#566f8d" >Five independent evidence planes explain what is requested, allowed, granted, capable and observed.</text><rect x="38" y="119" width="1364" height="115" rx="20" fill="#eef6ff" stroke="#9dc7ea" stroke-width="1.35"/><text x="65" y="160" font-size="24" font-weight="760" fill="#102449" >EVIDENCE-BOUND AI SYSTEM</text><text x="66" y="195" font-size="18" font-weight="480" fill="#3e628a" >Agent · requested action · tool invocation · service identity · possible downstream effect</text><text x="38" y="277" font-size="14" font-weight="740" fill="#2c6c9b" letter-spacing="1.7">THE FIVE EVIDENCE PLANES</text><rect x="38" y="294" width="258" height="139" rx="15" fill="#fff" stroke="#bed0e4" stroke-width="1.35"/><text x="52" y="326" font-size="19" font-weight="730" fill="#102449" >Requested</text><text x="52" y="360" font-size="14" font-weight="475" fill="#546c86" >The action, tool and scope</text><text x="52" y="382" font-size="14" font-weight="475" fill="#546c86" >the agent was asked to use</text><rect x="52" y="401" width="94" height="20" rx="9" fill="#edf4fa" stroke="#e0eaf3" stroke-width="1.35"/><text x="61" y="415" font-size="10" font-weight="760" fill="#6c849c" >MAY BE UNKNOWN</text><rect x="319" y="294" width="258" height="139" rx="15" fill="#fff" stroke="#bed0e4" stroke-width="1.35"/><text x="333" y="326" font-size="19" font-weight="730" fill="#102449" >Policy Authorized</text><text x="333" y="360" font-size="14" font-weight="475" fill="#546c86" >Policy and human-approved</text><text x="333" y="382" font-size="14" font-weight="475" fill="#546c86" >boundaries (when established)</text><rect x="333" y="401" width="94" height="20" rx="9" fill="#edf4fa" stroke="#e0eaf3" stroke-width="1.35"/><text x="342" y="415" font-size="10" font-weight="760" fill="#6c849c" >MAY BE UNKNOWN</text><rect x="600" y="294" width="258" height="139" rx="15" fill="#fff" stroke="#bed0e4" stroke-width="1.35"/><text x="614" y="326" font-size="19" font-weight="730" fill="#102449" >Effectively Granted</text><text x="614" y="360" font-size="14" font-weight="475" fill="#546c86" >Connected identity, roles</text><text x="614" y="382" font-size="14" font-weight="475" fill="#546c86" >and current access facts</text><rect x="614" y="401" width="94" height="20" rx="9" fill="#edf4fa" stroke="#e0eaf3" stroke-width="1.35"/><text x="623" y="415" font-size="10" font-weight="760" fill="#6c849c" >MAY BE UNKNOWN</text><rect x="881" y="294" width="258" height="139" rx="15" fill="#fff" stroke="#bed0e4" stroke-width="1.35"/><text x="895" y="326" font-size="19" font-weight="730" fill="#102449" >Code Capable</text><text x="895" y="360" font-size="14" font-weight="475" fill="#546c86" >Code and tool behavior</text><text x="895" y="382" font-size="14" font-weight="475" fill="#546c86" >supported by source evidence</text><rect x="895" y="401" width="94" height="20" rx="9" fill="#edf4fa" stroke="#e0eaf3" stroke-width="1.35"/><text x="904" y="415" font-size="10" font-weight="760" fill="#6c849c" >MAY BE UNKNOWN</text><rect x="1162" y="294" width="258" height="139" rx="15" fill="#fff" stroke="#bed0e4" stroke-width="1.35"/><text x="1176" y="326" font-size="19" font-weight="730" fill="#102449" >Observed</text><text x="1176" y="360" font-size="14" font-weight="475" fill="#546c86" >Qualified runtime events</text><text x="1176" y="382" font-size="14" font-weight="475" fill="#546c86" >and action/effect records</text><rect x="1176" y="401" width="94" height="20" rx="9" fill="#edf4fa" stroke="#e0eaf3" stroke-width="1.35"/><text x="1185" y="415" font-size="10" font-weight="760" fill="#6c849c" >MAY BE UNKNOWN</text><rect x="38" y="459" width="1364" height="124" rx="17" fill="#eaf0ff" stroke="#a7bce4" stroke-width="1.35"/><text x="66" y="499" font-size="24" font-weight="755" fill="#102449" >DETERMINISTIC DAI COMPARISON</text><text x="66" y="535" font-size="18" font-weight="475" fill="#466382" >What is supported? What differs? Which delegated action or effect remains unverified?</text><text x="66" y="563" font-size="14" font-weight="635" fill="#506b92" >Unknown, unassessed and partial evidence are not silently upgraded to PASS.</text><rect x="38" y="614" width="425" height="114" rx="16" fill="#f6fafc" stroke="#b5cbd9" stroke-width="1.35"/><text x="58" y="650" font-size="20" font-weight="720" fill="#102449" >Human review</text><text x="58" y="683" font-size="14" font-weight="480" fill="#587088" >Scoped approval, rejection or escalation</text><rect x="503" y="614" width="425" height="114" rx="16" fill="#f6fafc" stroke="#b5cbd9" stroke-width="1.35"/><text x="523" y="650" font-size="20" font-weight="720" fill="#102449" >Operating boundaries</text><text x="523" y="683" font-size="14" font-weight="480" fill="#587088" >Applicable policy constraints and recorded decisions</text><rect x="968" y="614" width="425" height="114" rx="16" fill="#f6fafc" stroke="#b5cbd9" stroke-width="1.35"/><text x="988" y="650" font-size="20" font-weight="720" fill="#102449" >Action evidence</text><text x="988" y="683" font-size="14" font-weight="480" fill="#587088" >Evaluated source, observation and proof frontier</text><rect x="38" y="750" width="1364" height="82" rx="13" fill="#fff9ee" stroke="#e3c799" stroke-width="1.35"/><text x="60" y="782" font-size="18" font-weight="710" fill="#805d21" >IMPORTANT: DECISION ≠ EFFECTIVE PERMISSION ≠ RUNTIME ENFORCEMENT</text><text x="60" y="810" font-size="15" font-weight="475" fill="#92723f" >Protection requires separately verified target integration and observed mediation receipts.</text><text x="38" y="863" font-size="12.8" font-weight="480" fill="#667d95" >ILLUSTRATIVE REFERENCE  ·  No particular KestrelVoice agent or authorization state is implied</text></svg>
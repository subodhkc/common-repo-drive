<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="905" viewBox="0 0 1440 905" role="img" aria-labelledby="title description"><title id="title">HAIEC  /  Evidence, Authority &amp; Outcome Flow</title><desc id="description">Illustrative product design reference, not a live evaluated customer system.</desc><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif} .small{font-size:14px}</style><rect x="0" y="0" width="1440" height="905" rx="0" fill="#fbfdff" stroke="#fbfdff" stroke-width="1.35"/><text x="36" y="50" font-size="33" font-weight="780" fill="#102449" >HAIEC  /  Evidence, Authority &amp; Outcome Flow</text><text x="36" y="79" font-size="17" font-weight="475" fill="#566f8d" >Sources are qualified before scoped evaluations; human decisions and target operations remain separate.</text><rect x="38" y="112" width="1364" height="158" rx="17" fill="#f3f9ff" stroke="#c3d4e9" stroke-width="1.35"/><text x="62" y="145" font-size="21" font-weight="735" fill="#102449" >01 / SOURCE INPUTS</text><text x="62" y="173" font-size="15.5" font-weight="465" fill="#506f8a" >Independent connections; no single connector is universally required</text><rect x="62" y="194" width="414" height="56" rx="11" fill="#fff" stroke="#bed0e2" stroke-width="1.35"/><text x="76" y="228" font-size="16.5" font-weight="650" fill="#102449" >Repository / CI / local scan</text><rect x="507" y="194" width="414" height="56" rx="11" fill="#fff" stroke="#bed0e2" stroke-width="1.35"/><text x="521" y="228" font-size="16.5" font-weight="650" fill="#102449" >Runtime telemetry (if connected)</text><rect x="952" y="194" width="414" height="56" rx="11" fill="#fff" stroke="#bed0e2" stroke-width="1.35"/><text x="966" y="228" font-size="16.5" font-weight="650" fill="#102449" >IAM &amp; human context</text><rect x="38" y="294" width="1364" height="158" rx="17" fill="#f7f5ff" stroke="#c3d4e9" stroke-width="1.35"/><text x="62" y="327" font-size="21" font-weight="735" fill="#102449" >02 / EVIDENCE QUALIFICATION</text><text x="62" y="355" font-size="15.5" font-weight="465" fill="#506f8a" >Accepted records are not automatically assurance facts</text><rect x="62" y="376" width="414" height="56" rx="11" fill="#fff" stroke="#bed0e2" stroke-width="1.35"/><text x="76" y="410" font-size="16.5" font-weight="650" fill="#102449" >Source identity and provenance</text><rect x="507" y="376" width="414" height="56" rx="11" fill="#fff" stroke="#bed0e2" stroke-width="1.35"/><text x="521" y="410" font-size="16.5" font-weight="650" fill="#102449" >Agent, tool and action paths</text><rect x="952" y="376" width="414" height="56" rx="11" fill="#fff" stroke="#bed0e2" stroke-width="1.35"/><text x="966" y="410" font-size="16.5" font-weight="650" fill="#102449" >Five separate evidence planes</text><rect x="38" y="478" width="1364" height="158" rx="17" fill="#f3f9ff" stroke="#c3d4e9" stroke-width="1.35"/><text x="62" y="511" font-size="21" font-weight="735" fill="#102449" >03 / OPTIONAL CUSTOMER QUESTIONS</text><text x="62" y="539" font-size="15.5" font-weight="465" fill="#506f8a" >Select only applicable analyses and decisions</text><rect x="62" y="560" width="414" height="56" rx="11" fill="#fff" stroke="#bed0e2" stroke-width="1.35"/><text x="76" y="594" font-size="16.5" font-weight="650" fill="#102449" >Code &amp; reachability evaluation</text><rect x="507" y="560" width="414" height="56" rx="11" fill="#fff" stroke="#bed0e2" stroke-width="1.35"/><text x="521" y="594" font-size="16.5" font-weight="650" fill="#102449" >DAI / controls / changes</text><rect x="952" y="560" width="414" height="56" rx="11" fill="#fff" stroke="#bed0e2" stroke-width="1.35"/><text x="966" y="594" font-size="16.5" font-weight="650" fill="#102449" >Human decision or monitoring</text><rect x="38" y="662" width="1364" height="158" rx="17" fill="#f7f5ff" stroke="#c3d4e9" stroke-width="1.35"/><text x="62" y="695" font-size="21" font-weight="735" fill="#102449" >04 / SCOPED OUTPUTS</text><text x="62" y="723" font-size="15.5" font-weight="465" fill="#506f8a" >Publish evaluated facts and limitations, not presumed outcomes</text><rect x="62" y="744" width="414" height="56" rx="11" fill="#fff" stroke="#bed0e2" stroke-width="1.35"/><text x="76" y="778" font-size="16.5" font-weight="650" fill="#102449" >Capability and evidence views</text><rect x="507" y="744" width="414" height="56" rx="11" fill="#fff" stroke="#bed0e2" stroke-width="1.35"/><text x="521" y="778" font-size="16.5" font-weight="650" fill="#102449" >Bounded decision receipts</text><rect x="952" y="744" width="414" height="56" rx="11" fill="#fff" stroke="#bed0e2" stroke-width="1.35"/><text x="966" y="778" font-size="16.5" font-weight="650" fill="#102449" >Reports, provenance &amp; gaps</text><text x="41" y="858" font-size="15" font-weight="590" fill="#756d84" >Unassessed remains unassessed. Human approval and policy review do not demonstrate a deployed target-side guard.</text><text x="41" y="886" font-size="13" font-weight="460" fill="#6d829c" >ILLUSTRATIVE ARCHITECTURE · Selected workflows are independent; connecting every source is not a prerequisite.</text></svg>
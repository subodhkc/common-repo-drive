<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 685" width="960" height="685" role="img" aria-labelledby="hero-title hero-desc"><title id="hero-title">HAIEC — AI System Workspace and six equal product capabilities</title><desc id="hero-desc">Light-theme homepage architecture. An AI System Workspace connects to six equally prominent independently selectable capabilities: Discover, Evaluate, Authorize, Monitor, Protect and Verify. All rely on qualified evidence and apply only when prerequisites are met. The diagram is illustrative, not proof of runtime protection.</desc><rect x="0" y="0" width="960" height="685" rx="25" fill="#f7fbff" stroke="#e1ecf5" stroke-width="1.5"/><text x="30" y="55" font-family="Inter,system-ui,Arial,sans-serif" font-size="20" font-weight="790" fill="#10335b" >ONE PLATFORM. SIX INDEPENDENT CAPABILITIES.</text><text x="30" y="86" font-family="Inter,system-ui,Arial,sans-serif" font-size="15" font-weight="480" fill="#597893" >Evidence, authority and consequential actions — without guessing what is unknown.</text><rect x="30" y="110" width="900" height="99" rx="17" fill="#e6f2ff" stroke="#a8c8e7" stroke-width="1.5"/><text x="52" y="148" font-family="Inter,system-ui,Arial,sans-serif" font-size="25" font-weight="765" fill="#16314f" >AI SYSTEM WORKSPACE</text><text x="52" y="180" font-family="Inter,system-ui,Arial,sans-serif" font-size="17" font-weight="485" fill="#476c91" >Systems   •   Connections   •   Capability Map   •   Evaluations   •   Decisions</text><text x="30" y="239" font-family="Inter,system-ui,Arial,sans-serif" font-size="14" font-weight="760" fill="#3575a7" letter-spacing="1.1">CHOOSE THE QUESTION THAT MATTERS</text><rect x="30" y="256" width="287" height="113" rx="16" fill="#fff" stroke="#b1c7dd" stroke-width="1.5"/><rect x="47" y="273" width="42" height="42" rx="12" fill="#eaf3fd" stroke="#bed6ea" stroke-width="1.5"/><text x="55" y="301" font-family="Inter,system-ui,Arial,sans-serif" font-size="19" font-weight="780" fill="#366ba1" >01</text><text x="100" y="303" font-family="Inter,system-ui,Arial,sans-serif" font-size="22" font-weight="740" fill="#16314f" >Discover</text><text x="48" y="338" font-family="Inter,system-ui,Arial,sans-serif" font-size="15" font-weight="480" fill="#5a738e" >Map agents and tools</text><rect x="336" y="256" width="287" height="113" rx="16" fill="#fff" stroke="#b1c7dd" stroke-width="1.5"/><rect x="353" y="273" width="42" height="42" rx="12" fill="#eaf3fd" stroke="#bed6ea" stroke-width="1.5"/><text x="361" y="301" font-family="Inter,system-ui,Arial,sans-serif" font-size="19" font-weight="780" fill="#366ba1" >02</text><text x="406" y="303" font-family="Inter,system-ui,Arial,sans-serif" font-size="22" font-weight="740" fill="#16314f" >Evaluate</text><text x="354" y="338" font-family="Inter,system-ui,Arial,sans-serif" font-size="15" font-weight="480" fill="#5a738e" >Compare qualified evidence</text><rect x="642" y="256" width="287" height="113" rx="16" fill="#fff" stroke="#b1c7dd" stroke-width="1.5"/><rect x="659" y="273" width="42" height="42" rx="12" fill="#eaf3fd" stroke="#bed6ea" stroke-width="1.5"/><text x="667" y="301" font-family="Inter,system-ui,Arial,sans-serif" font-size="19" font-weight="780" fill="#366ba1" >03</text><text x="712" y="303" font-family="Inter,system-ui,Arial,sans-serif" font-size="22" font-weight="740" fill="#16314f" >Authorize</text><text x="660" y="338" font-family="Inter,system-ui,Arial,sans-serif" font-size="15" font-weight="480" fill="#5a738e" >Record human decisions</text><rect x="30" y="388" width="287" height="113" rx="16" fill="#fff" stroke="#b1c7dd" stroke-width="1.5"/><rect x="47" y="405" width="42" height="42" rx="12" fill="#eaf3fd" stroke="#bed6ea" stroke-width="1.5"/><text x="55" y="433" font-family="Inter,system-ui,Arial,sans-serif" font-size="19" font-weight="780" fill="#366ba1" >04</text><text x="100" y="435" font-family="Inter,system-ui,Arial,sans-serif" font-size="22" font-weight="740" fill="#16314f" >Monitor</text><text x="48" y="470" font-family="Inter,system-ui,Arial,sans-serif" font-size="15" font-weight="480" fill="#5a738e" >Observe connected signals</text><rect x="336" y="388" width="287" height="113" rx="16" fill="#fff" stroke="#b1c7dd" stroke-width="1.5"/><rect x="353" y="405" width="42" height="42" rx="12" fill="#eaf3fd" stroke="#bed6ea" stroke-width="1.5"/><text x="361" y="433" font-family="Inter,system-ui,Arial,sans-serif" font-size="19" font-weight="780" fill="#366ba1" >05</text><text x="406" y="435" font-family="Inter,system-ui,Arial,sans-serif" font-size="22" font-weight="740" fill="#16314f" >Protect</text><text x="354" y="470" font-family="Inter,system-ui,Arial,sans-serif" font-size="15" font-weight="480" fill="#5a738e" >Mediate only if integrated</text><rect x="642" y="388" width="287" height="113" rx="16" fill="#fff" stroke="#b1c7dd" stroke-width="1.5"/><rect x="659" y="405" width="42" height="42" rx="12" fill="#eaf3fd" stroke="#bed6ea" stroke-width="1.5"/><text x="667" y="433" font-family="Inter,system-ui,Arial,sans-serif" font-size="19" font-weight="780" fill="#366ba1" >06</text><text x="712" y="435" font-family="Inter,system-ui,Arial,sans-serif" font-size="22" font-weight="740" fill="#16314f" >Verify</text><text x="660" y="470" font-family="Inter,system-ui,Arial,sans-serif" font-size="15" font-weight="480" fill="#5a738e" >Report exact proof &amp; gaps</text><rect x="30" y="531" width="900" height="92" rx="15" fill="#f0f0ff" stroke="#b6bfed" stroke-width="1.5"/><text x="50" y="566" font-family="Inter,system-ui,Arial,sans-serif" font-size="22" font-weight="725" fill="#16314f" >SHARED DETERMINISTIC EVIDENCE CORE</text><text x="50" y="597" font-family="Inter,system-ui,Arial,sans-serif" font-size="15" font-weight="475" fill="#4f648b" >Source qualification  •  Five planes  •  Provenance  •  Explicit evidence frontier</text><text x="31" y="659" font-family="Inter,system-ui,Arial,sans-serif" font-size="13" font-weight="500" fill="#71869d" >Illustrative · Each capabili
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-labelledby="title description"><title id="title">HAIEC  /  Product Architecture &amp; Capability Engine</title><desc id="description">Illustrative product design reference, not a live evaluated customer system.</desc><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif} .small{font-size:14px}</style><rect x="0" y="0" width="1440" height="970" rx="0" fill="#fbfdff" stroke="#fbfdff" stroke-width="1.35"/><text x="36" y="50" font-size="33" font-weight="780" fill="#102449" >HAIEC  /  Product Architecture &amp; Capability Engine</text><text x="36" y="79" font-size="17" font-weight="475" fill="#566f8d" >Four explanation domains, not a mandatory execution pipeline or four new product pillars.</text><rect x="38" y="120" width="1364" height="164" rx="17" fill="#f1f8ff" stroke="#bbd0e6" stroke-width="1.35"/><text x="58" y="152" font-size="20" font-weight="760" fill="#1a4e80" >SOURCE &amp; DISCOVERY</text><text x="58" y="180" font-size="14.5" font-weight="480" fill="#59758d" >Use whichever authorized sources the selected question requires</text><rect x="58" y="204" width="410" height="59" rx="11" fill="#fff" stroke="#c3d4e5" stroke-width="1.35"/><text x="75" y="240" font-size="16" font-weight="610" fill="#102449" >Code and repository context</text><rect x="502" y="204" width="410" height="59" rx="11" fill="#fff" stroke="#c3d4e5" stroke-width="1.35"/><text x="519" y="240" font-size="16" font-weight="610" fill="#102449" >Runtime and identity signals</text><rect x="946" y="204" width="410" height="59" rx="11" fill="#fff" stroke="#c3d4e5" stroke-width="1.35"/><text x="963" y="240" font-size="16" font-weight="610" fill="#102449" >Agent/tool inventory and mapping</text><rect x="38" y="313" width="1364" height="164" rx="17" fill="#f7f5ff" stroke="#bbd0e6" stroke-width="1.35"/><text x="58" y="345" font-size="20" font-weight="760" fill="#1a4e80" >CORE ASSURANCE</text><text x="58" y="373" font-size="14.5" font-weight="480" fill="#59758d" >Normalize and qualify facts, then evaluate what the evidence supports</text><rect x="58" y="397" width="410" height="59" rx="11" fill="#fff" stroke="#c3d4e5" stroke-width="1.35"/><text x="75" y="433" font-size="16" font-weight="610" fill="#102449" >Evidence planes and provenance</text><rect x="502" y="397" width="410" height="59" rx="11" fill="#fff" stroke="#c3d4e5" stroke-width="1.35"/><text x="519" y="433" font-size="16" font-weight="610" fill="#102449" >DAI and effect comparison</text><rect x="946" y="397" width="410" height="59" rx="11" fill="#fff" stroke="#c3d4e5" stroke-width="1.35"/><text x="963" y="433" font-size="16" font-weight="610" fill="#102449" >Reachability and specific controls</text><rect x="38" y="506" width="1364" height="164" rx="17" fill="#f1f8ff" stroke="#bbd0e6" stroke-width="1.35"/><text x="58" y="538" font-size="20" font-weight="760" fill="#1a4e80" >GOVERN &amp; OPERATE</text><text x="58" y="566" font-size="14.5" font-weight="480" fill="#59758d" >Human authority, monitoring and protection are distinct</text><rect x="58" y="590" width="410" height="59" rx="11" fill="#fff" stroke="#c3d4e5" stroke-width="1.35"/><text x="75" y="626" font-size="16" font-weight="610" fill="#102449" >Approved operating envelopes</text><rect x="502" y="590" width="410" height="59" rx="11" fill="#fff" stroke="#c3d4e5" stroke-width="1.35"/><text x="519" y="626" font-size="16" font-weight="610" fill="#102449" >Observed monitoring when connected</text><rect x="946" y="590" width="410" height="59" rx="11" fill="#fff" stroke="#c3d4e5" stroke-width="1.35"/><text x="963" y="626" font-size="16" font-weight="610" fill="#102449" >Target protection only if verified</text><rect x="38" y="699" width="1364" height="164" rx="17" fill="#f7f5ff" stroke="#bbd0e6" stroke-width="1.35"/><text x="58" y="731" font-size="20" font-weight="760" fill="#1a4e80" >VERIFY &amp; REPORT</text><text x="58" y="759" font-size="14.5" font-weight="480" fill="#59758d" >Evidence-bound outputs for the selected workflow</text><rect x="58" y="783" width="410" height="59" rx="11" fill="#fff" stroke="#c3d4e5" stroke-width="1.35"/><text x="75" y="819" font-size="16" font-weight="610" fill="#102449" >Canonical evaluation reports</text><rect x="502" y="783" width="410" height="59" rx="11" fill="#fff" stroke="#c3d4e5" stroke-width="1.35"/><text x="519" y="819" font-size="16" font-weight="610" fill="#102449" >Human decision receipts</text><rect x="946" y="783" width="410" height="59" rx="11" fill="#fff" stroke="#c3d4e5" stroke-width="1.35"/><text x="963" y="819" font-size="16" font-weight="610" fill="#102449" >Source and proof limitations</text><rect x="38" y="885" width="1364" height="46" rx="11" fill="#fff9ed" stroke="#ecd4a9" stroke-width="1.35"/><text x="59" y="914" font-size="16" font-weight="650" fill="#845d24" >Sources ≠ facts  ·  Policy ≠ effective grant  ·  DAI ≠ universal protection  ·  Unknown ≠ PASS</text><text x="39" y="953" font-size="13" font-weight="480" fill="#7286a0" >ILLUSTRATIVE REFERENCE  ·  Exact status depends on the authorized AI System and its sources</text></svg>
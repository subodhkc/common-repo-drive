<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="835" viewBox="0 0 1440 835" role="img" aria-labelledby="title description"><title id="title">HAIEC  /  Unified Architecture</title><desc id="description">The same six product capabilities are equally prominent. Inputs and evidence needs are conditional. Protect requires real target integration.</desc><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif} .small{font-size:14px}</style><rect x="0" y="0" width="1440" height="835" rx="0" fill="#fbfdff" stroke="#fbfdff" stroke-width="1.35"/><text x="36" y="50" font-size="33" font-weight="780" fill="#102449" >HAIEC  /  Unified Architecture</text><text x="36" y="79" font-size="17" font-weight="475" fill="#566f8d" >One workspace. Six equally weighted capabilities. Qualified evidence at the center.</text><text x="38" y="124" font-size="13" font-weight="740" fill="#2c6c9b" letter-spacing="2">CUSTOMER ROLES</text><rect x="38" y="138" width="260" height="63" rx="12" fill="#f2f7fe" stroke="#b7cde5" stroke-width="1.35"/><text x="54" y="165" font-size="17" font-weight="695" fill="#102449" >Developers</text><text x="54" y="188" font-size="13" font-weight="465" fill="#526b84" >Source &amp; build</text><rect x="319" y="138" width="260" height="63" rx="12" fill="#f2f7fe" stroke="#b7cde5" stroke-width="1.35"/><text x="335" y="165" font-size="17" font-weight="695" fill="#102449" >Security / AI Ops</text><text x="335" y="188" font-size="13" font-weight="465" fill="#526b84" >Operational risk</text><rect x="600" y="138" width="260" height="63" rx="12" fill="#f2f7fe" stroke="#b7cde5" stroke-width="1.35"/><text x="616" y="165" font-size="17" font-weight="695" fill="#102449" >Governance &amp; Risk</text><text x="616" y="188" font-size="13" font-weight="465" fill="#526b84" >Policy &amp; accountability</text><rect x="881" y="138" width="260" height="63" rx="12" fill="#f2f7fe" stroke="#b7cde5" stroke-width="1.35"/><text x="897" y="165" font-size="17" 
d source scope</text><rect x="270" y="413" width="211" height="132" rx="16" fill="#fff" stroke="#a7bfd7" stroke-width="1.35"/><rect x="285" y="429" width="32" height="32" rx="9" fill="#e4effc" stroke="#adc7e5" stroke-width="1.35"/><text x="295" y="453" font-size="14" font-weight="780" fill="#315e96" >02</text><text x="286" y="484" font-size="22" font-weight="730" fill="#102449" >Evaluate</text><text x="286" y="513" font-size="13" font-weight="480" fill="#516f89" >Deterministic assurance</text><text x="286" y="532" font-size="12.5" font-weight="450" fill="#71879c" >DAI and evidence gaps</text><rect x="502" y="413" width="211" height="132" rx="16" fill="#fff" stroke="#a7bfd7" stroke-width="1.35"/><rect x="517" y="429" width="32" height="32" rx="9" fill="#e4effc" stroke="#adc7e5" stroke-width="1.35"/><text x="527" y="453" font-size="14" font-weight="780" fill="#315e96" >03</text><text x="518" y="484" font-size="22" font-weight="730" fill="#102449" >Authorize</text><text x="518" y="513" font-size="13" font-weight="480" fill="#516f89" >Policy &amp; human decisions</text><text x="518" y="532" font-size="12.5" font-weight="450" fill="#71879c" >Scoped approval records</text><rect x="734" y="413" width="211" height="132" rx="16" fill="#fff" stroke="#a7bfd7" stroke-width="1.35"/><rect x="749" y="429" width="32" height="32" rx="9" fill="#e4effc" stroke="#adc7e5" stroke-width="1.35"/><text x="759" y="453" font-size="14" font-weight="780" fill="#315e96" >04</text><text x="750" y="484" font-size="22" font-weight="730" fill="#102449" >Monitor</text><text x="750" y="513" font-size="13" font-weight="480" fill="#516f89" >Connected runtime signals</text><text x="750" y="532" font-size="12.5" font-weight="450" fill="#71879c" >Drift and change evidence</text><rect x="966" y="413" width="211" height="132" rx="16" fill="#fff" stroke="#a7bfd7" stroke-width="1.35"/><rect x="981" y="429" width="32" height="32" rx="9" fill="#e4effc" stroke="#adc7e5" stroke-width="1.35"/><text x="991" y="453" font-size="14" font-weight="780" fill="#315e96" >05</text><text x="982" y="484" font-size="22" font-weight="730" fill="#102449" >Protect</text><text x="982" y="513" font-size="13" font-weight="480" fill="#516f89" >Mediation when integrated</text><text x="982" y="532" font-size="12.5" font-weight="450" fill="#71879c" >Proven target receipt only</text><rect x="1198" y="413" width="211" height="132" rx="16" fill="#fff" stroke="#a7bfd7" stroke-width="1.35"/><rect x="1213" y="429" width="32" height="32" rx="9" fill="#e4effc" stroke="#adc7e5" stroke-width="1.35"/><text x="1223" y="453" font-size="14" font-weight="780" fill="#315e96" >06</text><text x="1214" y="484" font-size="22" font-weight="730" fill="#102449" >Verify</text><text x="1214" y="513" font-size="13" font-weight="480" fill="#516f89" >Reports and provenance</text><text x="1214" y="532" font-size="12.5" font-weight="450" fill="#71879c" >Bounded proof and limits</text><rect x="38" y="576" width="1364" height="107" rx="18" fill="#eef0ff" stroke="#aab7ec" stroke-width="1.35"/><text x="63" y="613" font-size="24" font-weight="740" fill="#102449" >SHARED DETERMINISTIC EVIDENCE &amp; ASSURANCE CORE</text><text x="64" y="644" font-size="16" font-weight="460" fill="#526b8a" >Source identity  •  Tenant scope  •  Qualification  •  Five separate evidence planes  •  Provenance  •  Exact evaluation basis</text><text x="38" y="713" font-size="13" font-weight="740" fill="#2c6c9b" letter-spacing="1.6">OUTPUTS BY APPLICABLE WORKFLOW</text><rect x="38" y="730" width="427" height="55" rx="13" fill="#f5f9ff" stroke="#bed2e5" stroke-width="1.35"/><text x="53" y="762" font-size="17" font-weight="655" fill="#102449" >Capability and action maps</text><rect x="503" y="730" width="427" height="55" rx="13" fill="#f5f9ff" stroke="#bed2e5" stroke-width="1.35"/><text x="518" y="762" font-size="17" font-weight="655" fill="#102449" >Scoped human decision records</text><rect x="968" y="730" width="427" height="55" rx="13" fill="#f5f9ff" stroke="#bed2e5" stroke-width="1.35"/><text x="983" y="762" font-size="17" font-weight="655" fill="#102449" >Evidence-backed reports &amp; receipts</text><text x="38" y="813" font-size="13" font-weight="450" fill="#71849c" >ILLUSTRATIVE  ·  A capability is not an observed action  ·  Human approval does not prove native enforcement</text></svg>
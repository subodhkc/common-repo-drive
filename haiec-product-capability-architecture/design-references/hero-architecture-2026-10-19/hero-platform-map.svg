<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img" aria-labelledby="pt pd"><title id="pt">HAIEC Unified Architecture — independent customer capabilities over a qualified evidence core</title><desc id="pd">Four customer audiences use a shared AI System Workspace. Six independently selectable capabilities Discover, Evaluate, Authorize, Monitor, Protect and Verify use canonical evidence qualification. Separate outcomes include maps, decisions and verification. The illustration does not represent an executed customer scan or universal enforcement.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08172b"/><stop offset="1" stop-color="#0a1030"/></linearGradient><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#172e53"/><stop offset="1" stop-color="#161e45"/></linearGradient><radialGradient id="halo"><stop stop-color="#325bc0" stop-opacity=".25"/><stop offset="1" stop-color="#325bc0" stop-opacity="0"/></radialGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#385a83" stroke-opacity=".13" stroke-width="1"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="12"/></filter><style><![CDATA[.f{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.cap{cursor:pointer}.cap:focus .cap-rect,.cap:hover .cap-rect{stroke-width:3;filter:drop-shadow(0 0 8px rgba(93,196,255,.27))}.small{font-size:14px;font-weight:450}.tag{font-size:14px;font-weight:650;letter-spacing:.12em}]]></style></defs><g class="f"><rect x="0" y="0" width="1440" height="830" rx="0" fill="url(#bg)" stroke="none" /><rect x="0" y="0" width="1440" height="830" rx="0" fill="url(#grid)" stroke="none" /><circle cx="720" cy="480" r="440" fill="url(#halo)"/><text x="42" y="52" fill="#f1f7ff" font-size="30" font-weight="790" >HAIEC / UNIFIED PRODUCT ARCHITECTURE</text><text x="42" y="82" fill="#a6c3dd" font-size="17" font-weight="450" >One workspace · six independent capabilities · deterministic, qualified evidence</text><text x="42" y="119" fill="#67cffa" font-size="13" font-weight="720" letter-spacing=".13em">WHO USES HAIEC</text><rect x="42" y="132" width="325" height="67" rx="12" fill="#0a2847" stroke="#237ab7" /><text x="60" y="160" fill="#ebf6ff" font-size="18" font-weight="735" >Developers</text><text x="60" y="183" fill="#95bcd6" font-size="13" font-weight="450" >Code &amp; source context</text><rect x="391" y="132" width="325" height="67" rx="12" fill="#0a2847" stroke="#237ab7" /><text x="409" y="160" fill="#ebf6ff" font-size="18" font-weight="735" >Security / AI Ops</text><text x="409" y="183" fill="#95bcd6" font-size="13" font-weight="450" >Risk &amp; operational evidence</text><rect x="740" y="132" width="325" height="67" rx="12" fill="#0a2847" stroke="#237ab7" /><text x="758" y="160" fill="#ebf6ff" font-size="18" font-weight="735" >Governance / Risk</text><text x="758" y="183" fill="#95bcd6" font-size="13" font-weight="450" >Authority &amp; decisions</text><rect x="1089" y="132" width="325" height="67" rx="12" fill="#0a2847" stroke="#237ab7" /><text x="1107" y="160" fill="#ebf6ff" font-size="18" font-weight="735" >Executives / Auditors</text><text x="1107" y="183" fill="#95bcd6" font-size="13" font-weight="450" >Proof &amp; reporting</text><path d="M720 201 L720 216" stroke="#84bff2" stroke-width="2.5" fill="none" stroke-dasharray="4 5"/><rect x="42" y="219" width="1356" height="116" rx="20" fill="url(#panel)" stroke="#9567fb" stroke-width="2"/><text x="72" y="258" fill="#f2edff" font-size="25" font-weight="770" >AI SYSTEM WORKSPACE</text><text x="73" y="289" fill="#bfd0e9" font-size="18" font-weight="450" >Systems    ·    Connections    ·    Capability Map    ·    Authority    ·    Evaluations    ·    Decisions</text><rect x="1115" y="238" width="245" height="66" rx="12" fill="#152a49" stroke="#4c729a" /><text x="1136" y="264" fill="#c9eafa" font-size="17" font-weight="700" >Start with what you have</text><text x="1136" y="285" fill="#a3c0d8" font-size="14" font-weight="480" >Goal · system · or evidence</text><text x="42" y="368" fill="#65d9ff" font-size="13" font-weight="750" letter-spacing=".14em">SELECT A CAPABILITY</text><text x="236" y="368" fill="#b6cde2" font-size="14" font-weight="450" >Each path has its own prerequisites; this is not a required sequence.</text><path d="M720 336 L720 389" stroke="#bba5ff" stroke-width="2" fill="none" stroke-dasharray="5 7"/><path d="M155 389 L1285 389" stroke="#769bc6" stroke-width="2" fill="none" stroke-dasharray="5 7"/><path d="M149 389 L149 412" stroke="#34bafa" stroke-width="1.8" fill="none" stroke-dasharray="5 7"/><g class="cap" data-cap="discover" tabindex="0" role="button" aria-label="Discover: Identify supported capabilities, reachability and evidence gaps."><rect x="42" y="412" width="212" height="119" rx="15" fill="#0a1b32" stroke="#34bafa" class="cap-rect" stroke-width="1.7"/><rect x="54" y="425" width="36" height="36" rx="11" fill="#34bafa" stroke="none" opacity=".18"/><text x="64" y="451" fill="#34bafa" font-size="26" font-weight="750" >◎</text><text x="58" y="488" fill="#34bafa" font-size="22" font-weight="750" >Discover</text><text x="58" y="514" fill="#b8cfe5" font-size="12.4" font-weight="450" >Systems · agents · tools</text></g><path d="M381 389 L381 412" stroke="#b08cff" stroke-width="1.8" fill="none" stroke-dasharray="5 7"/><g class="cap" data-cap="evaluate" tabindex="0" role="button" aria-label="Evaluate: Deterministic, source-qualified security and authority evaluation."><rect x="274" y="412" width="212" height="119" rx="15" fill="#0a1b32" stroke="#b08cff" class="cap-rect" stroke-width="1.7"/><rect x="286" y="425" width="36" height="36" rx="11" fill="#b08cff" stroke="none" opacity=".18"/><text x="296" y="451" fill="#b08cff" font-size="26" font-weight="750" >◇</text><text x="290" y="488" fill="#b08cff" font-size="22" font-weight="750" >Evaluate</text><text x="290" y="514" fill="#b8cfe5" font-size="12.4" font-weight="450" >Assurance · DAI · checks</text></g><path d="M613 389 L613 412" stroke="#ffc16e" stroke-width="1.8" fill="none" stroke-dasharray="5 7"/><g class="cap" data-cap="authorize" tabindex="0" role="button" aria-label="Authorize: Record scoped policy decisions and accountable human review."><rect x="506" y="412" width="212" height="119" rx="15" fill="#0a1b32" stroke="#ffc16e" class="cap-rect" stroke-width="1.7"/><rect x="518" y="425" width="36" height="36" rx="11" fill="#ffc16e" stroke="none" opacity=".18"/><text x="528" y="451" fill="#ffc16e" font-size="26" font-weight="750" >✓</text><text x="522" y="488" fill="#ffc16e" font-size="22" font-weight="750" >Authorize</text><text x="522" y="514" fill="#b8cfe5" font-size="12.4" font-weight="450" >Boundaries · human decisions</text></g><path d="M845 389 L845 412" stroke="#48d6c5" stroke-width="1.8" fill="none" stroke-dasharray="5 7"/><g class="cap" data-cap="monitor" tabindex="0" role="button" aria-label="Monitor: Observe change only where relevant signals are connected and qualified."><rect x="738" y="412" width="212" height="119" rx="15" fill="#0a1b32" stroke="#48d6c5" class="cap-rect" stroke-width="1.7"/><rect x="750" y="425" width="36" height="36" rx="11" fill="#48d6c5" stroke="none" opacity=".18"/><text x="760" y="451" fill="#48d6c5" font-size="26" font-weight="750" >⌁</text><text x="754" y="488" fill="#48d6c5" font-size="22" font-weight="750" >Monitor</text><text x="754" y="514" fill="#b8cfe5" font-size="12.4" font-weight="450" >Telemetry · change · drift</text></g><path d="M1077 389 L1077 412" stroke="#fb8098" stroke-width="1.8" fill="none" stroke-dasharray="5 7"/><g class="cap" data-cap="protect" tabindex="0" role="button" aria-label="Protect: Actual in-path protection requires a separately proven target adapter."><rect x="970" y="412" width="212" height="119" rx="15" fill="#0a1b32" stroke="#fb8098" class="cap-rect" stroke-width="1.7"/><rect x="982" y="425" width="36" height="36" rx="11" fill="#fb8098" stroke="none" opacity=".18"/><text x="992" y="451" fill="#fb8098" font-size="26" font-weight="750" >⬡</text><text x="986" y="488" fill="#fb8098" font-size="22" font-weight="750" >Protect</text><text x="986" y="514" fill="#b8cfe5" font-size="12.4" font-weight="450" >Guards · mediation when wired</text></g><path d="M1309 389 L1309 412" stroke="#79e3a9" stroke-width="1.8" fill="none" stroke-dasharray="5 7"/><g class="cap" data-cap="verify" tabindex="0" role="button" aria-label="Verify: Reconcile evaluated evidence, limitations, receipts and reports."><rect x="1202" y="412" width="212" height="119" rx="15" fill="#0a1b32" stroke="#79e3a9" class="cap-rect" stroke-width="1.7"/><rect x="1214" y="425" width="36" height="36" rx="11" fill="#79e3a9" stroke="none" opacity=".18"/><text x="1224" y="451" fill="#79e3a9" font-size="26" font-weight="750" >▤</text><text x="1218" y="488" fill="#79e3a9" font-size="22" font-weight="750" >Verify</text><text x="1218" y="514" fill="#b8cfe5" font-size="12.4" font-weight="450" >Reports · receipts · proof</text></g><text x="42" y="570" fill="#a898ff" font-size="13" font-weight="750" letter-spacing=".13em">SHARED EVIDENCE FOUNDATION</text><rect x="42" y="584" width="1356" height="98" rx="20" fill="#1a214d" stroke="#8c6ce8" stroke-width="2"/><text x="74" y="624" fill="#f0ecff" font-size="26" font-weight="780" >DETERMINISTIC EVIDENCE &amp; ASSURANCE CORE</text><text x="75" y="655" fill="#bfc7f0" font-size="16.5" font-weight="475" >Tenant binding  ·  Source identity  ·  Evidence qualification  ·  Provenance  ·  Exact evaluation basis  ·  Explicit unknowns</text><path d="M149 533 L149 582" stroke="#34bafa" stroke-width="1.8" fill="none" stroke-dasharray="4 7"/><path d="M381 533 L381 582" stroke="#b08cff" stroke-width="1.8" fill="none" stroke-dasharray="4 7"/><path d="M613 533 L613 582" stroke="#ffc16e" stroke-width="1.8" fill="none" stroke-dasharray="4 7"/><path d="M845 533 L845 582" stroke="#48d6c5" stroke-width="1.8" fill="none" stroke-dasharray="4 7"/><path d="M1077 533 L1077 582" stroke="#fb8098" stroke-width="1.8" fill="none" stroke-dasharray="4 7"/><path d="M1309 533 L1309 582" stroke="#79e3a9" stroke-width="1.8" fill="none" stroke-dasharray="4 7"/><text x="42" y="715" fill="#6ad6ff" font-size="13" font-weight="740" letter-spacing=".13em">SCOPED OUTPUTS</text><rect x="42" y="725" width="428" height="58" rx="12" fill="#11243a" stroke="#34bafa" /><text x="59" y="759" fill="#e7f2ff" font-size="17.5" font-weight="680" >Action &amp; capability evidence</text><rect x="507" y="725" width="428" height="58" rx="12" fill="#11243a" stroke="#ffc16e" /><text x="524" y="759" fill="#e7f2ff" font-size="17.5" font-weight="680" >Assurance &amp; human decisions</text><rect x="972" y="725" width="428" height="58" rx="12" fill="#11243a" stroke="#79e3a9" /><text x="989" y="759" fill="#e7f2ff" font-size="17.5" font-weight="680" >Reports, receipts &amp; limitations</text><text x="42" y="815" fill="#91a9c3" font-size="13.5" font-weight="450" >ILLUSTRATIVE REFERENCE · Source capability is not observed execution · Approval is not native enforcement · Unknown stays unknown</text></g></svg>
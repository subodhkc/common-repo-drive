<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1310" viewBox="0 0 1800 1310" role="img" aria-labelledby="d2-title d2-desc"><title id="d2-title">HAIEC D2 — Evidence, Assurance and Operational Trust Boundaries</title><desc id="d2-desc">Separate customer sources, authorized intake, qualified evidence, deterministic evaluations, approvals, monitoring and compliance. Target-native enforcement resides outside the HAIEC assessment boundary and requires verified customer integration. Availability varies by connector; not all workflows form a sequential pipeline.</desc><defs><linearGradient id="d2-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#112940"/></linearGradient><linearGradient id="d2-evidence" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#103f4d"/><stop offset="1" stop-color="#153954"/></linearGradient></defs><rect x="0" y="0" width="1800" height="1310" rx="0" fill="url(#d2-bg)" stroke="none" stroke-width="0" /><text x="68" y="58" font-size="17" font-weight="750" fill="#79cee9" text-anchor="start">HAIEC  /  ENGINEERING REFERENCE ARCHITECTURE</text><text x="68" y="115" font-size="38" font-weight="780" fill="#f8fbff" text-anchor="start">Evidence is qualified. Decisions are scoped. Enforcement is separate.</text><text x="68" y="148" font-size="19" font-weight="400" fill="#b8cce0" text-anchor="start">One shared evidence foundation supports selected assurance, governance and operational jobs without requiring every integration.</text><rect x="1577" y="62" width="157" height="29" rx="14" fill="#203950" stroke="none" stroke-width="0" /><text x="1655.5" y="82" font-size="13" font-weight="750" fill="#b5ecff" text-anchor="middle">D2 / TRUST</text><text x="68" y="200" font-size="17" font-weight="750" fill="#86cde8" text-anchor="start">01  OPTIONAL EVIDENCE SOURCES — CUSTOMER / PROVIDER BOUNDARY</text><rect x="62" y="218" width="1672" height="206" rx="18" fill="#11283f" stroke="#47647b" stroke-width="1.4" stroke-dasharray="9 7"/><rect x="81" y="242" width="534" height="74" rx="11" fill="#19344d" stroke="#69c3f1" stroke-width="1.1" /><text x="98" y="270" font-size="18" font-weight="700" fill="#f8fbff" text-anchor="start">GITHUB &amp; SOURCE</text><text x="316" y="270" font-size="14" font-weight="400" fill="#cbdbea" text-anchor="start">GitHub App / source scans</text><text x="98" y="297" font-size="14" font-weight="400" fill="#9ab3cb" text-anchor="start">Local + CI are limited preview</text><rect x="635" y="242" width="534" height="74" rx="11" fill="#19344d" stroke="#8fbfff" stroke-width="1.1" /><text x="652" y="270" font-size="18" font-weight="700" fill="#f8fbff" text-anchor="start">IDE / API / MCP</text><text x="870" y="270" font-size="14" font-weight="400" fill="#cbdbea" text-anchor="start">Authorized reads and writes</text><text x="652" y="297" font-size="14" font-weight="400" fill="#9ab3cb" text-anchor="start">Scope- and tenant-bound</text><rect x="1189" y="242" width="534" height="74" rx="11" fill="#19344d" stroke="#66d8c6" stroke-width="1.1" /><text x="1206" y="270" font-size="18" font-weight="700" fill="#f8fbff" text-anchor="start">TELEMETRY</text><text x="1424" y="270" font-size="14" font-weight="400" fill="#cbdbea" text-anchor="start">OTLP / structured events</text><text x="1206" y="297" font-size="14" font-weight="400" fill="#9ab3cb" text-anchor="start">Only connected, admitted sources</text><rect x="81" y="327" width="534" height="74" rx="11" fill="#19344d" stroke="#e9b975" stroke-width="1.1" /><text x="98" y="355" font-size="18" font-weight="700" fill="#f8fbff" text-anchor="start">IAM / PROVIDERS</text><text x="316" y="355" font-size="14" font-weight="400" fill="#cbdbea" text-anchor="start">Policy, identity, usage context</text><text x="98" y="382" font-size="14" font-weight="400" fill="#9ab3cb" text-anchor="start">Partial grant and admin scope</text><rect x="635" y="327" width="534" height="74" rx="11" fill="#19344d" stroke="#cba1ff" stroke-width="1.1" /><text x="652" y="355" font-size="18" font-weight="700" fill="#f8fbff" text-anchor="start">HUMAN EVIDENCE</text><text x="870" y="355" font-size="14" font-weight="400" fill="#cbdbea" text-anchor="start">Declared intent, policy, uploads</text><text x="652" y="382" font-size="14" font-weight="400" fill="#9ab3cb" text-anchor="start">Approval != third-party proof</text><rect x="1189" y="327" width="534" height="74" rx="11" fill="#19344d" stroke="#f0a39d" stroke-width="1.1" /><text x="1206" y="355" font-size="18" font-weight="700" fill="#f8fbff" text-anchor="start">FORENSICS / LAB</text><text x="1424" y="355" font-size="14" font-weight="400" fill="#cbdbea" text-anchor="start">LogSense / synthetic fixtures</text><text x="1206" y="382" font-size="14" font-weight="400" fill="#9ab3cb" text-anchor="start">Candidate or explicitly simulated</text><path d="M 906 425 L 906 452" stroke="#78cbd8" stroke-width="2" stroke-dasharray="6 5" fill="none"/><text x="68" y="481" font-size="17" font-weight="750" fill="#86cde8" text-anchor="start">02  HAIEC INTAKE, TRUST CHECKS &amp; EVIDENCE QUALIFICATION</text><rect x="62" y="502" width="535" height="120" rx="15" fill="#17314b" stroke="#54738e" stroke-width="1.4" /><text x="85" y="535" font-size="19" font-weight="750" fill="#f8fbff" text-anchor="start">AUTHENTICATE &amp; BIND</text><text x="85" y="565" font-size="16" font-weight="400" fill="#bad0e1" text-anchor="start">Org / system / principal / permission</text><text x="85" y="591" font-size="16" font-weight="400" fill="#bad0e1" text-anchor="start">Consent, source ownership, redaction</text><rect x="630" y="502" width="535" height="120" rx="15" fill="#17314b" stroke="#54738e" stroke-width="1.4" /><text x="653" y="535" font-size="19" font-weight="750" fill="#f8fbff" text-anchor="start">ADMIT &amp; CLASSIFY</text><text x="653" y="565" font-size="16" font-weight="400" fill="#bad0e1" text-anchor="start">Schema, source type, timestamp</text><text x="653" y="591" font-size="16" font-weight="400" fill="#bad0e1" text-anchor="start">Received != evaluated</text><rect x="1198" y="502" width="535" height="120" rx="15" fill="#17314b" stroke="#54738e" stroke-width="1.4" /><text x="1221" y="535" font-size="19" font-weight="750" fill="#f8fbff" text-anchor="start">QUALIFY EVIDENCE</text><text x="1221" y="565" font-size="16" font-weight="400" fill="#bad0e1" text-anchor="start">Basis, applicability, provenance</text><text x="1221" y="591" font-size="16" font-weight="400" fill="#bad0e1" text-anchor="start">Partial / unassessed remain visible</text><path d="M 906 626 L 906 648" stroke="#83e2d5" stroke-width="2" stroke-dasharray="6 5" fill="none"/><rect x="62" y="650" width="1672" height="118" rx="18" fill="url(#d2-evidence)" stroke="#62cabc" stroke-width="2" /><text x="95" y="687" font-size="25" font-weight="780" fill="#f0fdfa" text-anchor="start">CANONICAL EVIDENCE CORE  /  qualified, tenant-bound, versioned</text><text x="95" y="720" font-size="17" font-weight="400" fill="#b5e5e3" text-anchor="start">Source identity and provenance  ·  Accepted and qualified assertions  ·  Evaluation snapshot basis  ·  Evidence frontier</text><rect x="1525" y="671" width="166" height="29" rx="14" fill="#203950" stroke="none" stroke-width="0" /><text x="1608" y="691" font-size="13" font-weight="750" fill="#a2f4e8" text-anchor="middle">SHARED</text><text x="68" y="819" font-size="17" font-weight="750" fill="#86cde8" text-anchor="start">03  INDEPENDENT USE CASES — EACH HAS ITS OWN CONDITIONS</text><rect x="62" y="839" width="407" height="174" rx="16" fill="#142b43" stroke="#ba9aff" stroke-width="1.5" /><rect x="80" y="859" width="5" height="132" rx="3" fill="#ba9aff" stroke="#ba9aff" stroke-width="0" /><text x="99" y="876" font-size="18" font-weight="750" fill="#f8fbff" text-anchor="start">DETERMINISTIC ASSURANCE</text><text x="99" y="907" font-size="15" font-weight="400" fill="#bdd0e1" text-anchor="start">Selected AI/AppSec/control analysis</text><text x="99" y="933" font-size="15" font-weight="400" fill="#bdd0e1" text-anchor="start">Five planes and DAI comparisons</text><text x="99" y="959" font-size="15" font-weight="400" fill="#bdd0e1" text-anchor="start">Bounded findings and dispositions</text><rect x="484" y="839" width="407" height="174" rx="16" fill="#142b43" stroke="#ffc877" stroke-width="1.5" /><rect x="502" y="859" width="5" height="132" rx="3" fill="#ffc877" stroke="#ffc877" stroke-width="0" /><text x="521" y="876" font-size="18" font-weight="750" fill="#f8fbff" text-anchor="start">GOVERN &amp; AUTHORIZE</text><text x="521" y="907" font-size="15" font-weight="400" fill="#bdd0e1" text-anchor="start">Versioned policy / Operating Envelope</text><text x="521" y="933" font-size="15" font-weight="400" fill="#bdd0e1" text-anchor="start">Human approvals, expiry, SoD</text><text x="521" y="959" font-size="15" font-weight="400" fill="#bdd0e1" text-anchor="start">Approval != target permission</text><rect x="906" y="839" width="407" height="174" rx="16" fill="#142b43" stroke="#77e3c1" stroke-width="1.5" /><rect x="924" y="859" width="5" height="132" rx="3" fill="#77e3c1" stroke="#77e3c1" stroke-width="0" /><text x="943" y="876" font-size="18" font-weight="750" fill="#f8fbff" text-anchor="start">MONITOR &amp; INVESTIGATE</text><text x="943" y="907" font-size="15" font-weight="400" fill="#bdd0e1" text-anchor="start">Source health, baselines, anomalies</text><text x="943" y="933" font-size="15" font-weight="400" fill="#bdd0e1" text-anchor="start">Qualified observations and deltas</text><text x="943" y="959" font-size="15" font-weight="400" fill="#bdd0e1" text-anchor="start">Alert != effect prevention</text><rect x="1328" y="839" width="407" height="174" rx="16" fill="#142b43" stroke="#92c5ff" stroke-width="1.5" /><rect x="1346" y="859" width="5" height="132" rx="3" fill="#92c5ff" stroke="#92c5ff" stroke-width="0" /><text x="1365" y="876" font-size="18" font-weight="750" fill="#f8fbff" text-anchor="start">CONTROLS &amp; COMPLIANCE</text><text x="1365" y="907" font-size="15" font-weight="400" fill="#bdd0e1" text-anchor="start">Applicable mapped requirements</text><text x="1365" y="933" font-size="15" font-weight="400" fill="#bdd0e1" text-anchor="start">Control TestSpecs and proof</text><text x="1365" y="959" font-size="15" font-weight="400" fill="#bdd0e1" text-anchor="start">Mapping != certification</text><text x="68" y="1062" font-size="17" font-weight="750" fill="#86cde8" text-anchor="start">04  OUTPUTS AND OPTIONAL EXTERNAL ACTUATION — NOT AUTOMATIC PIPELINE STAGES</text><rect x="62" y="1080" width="535" height="132" rx="16" fill="#172e45" stroke="#85c9fd" stroke-width="1.5" /><text x="84" y="1119" font-size="20" font-weight="750" fill="#f8fbff" text-anchor="start">PROOF &amp; REPORTING</text><text x="84" y="1151" font-size="16" font-weight="400" fill="#c2d3e0" text-anchor="start">Evaluation-bound findings, coverage</text><text x="84" y="1176" font-size="16" font-weight="400" fill="#c2d3e0" text-anchor="start">Receipts, packages, verification</text><rect x="630" y="1080" width="535" height="132" rx="16" fill="#172e45" stroke="#77dbc7" stroke-width="1.5" /><text x="652" y="1119" font-size="20" font-weight="750" fill="#f8fbff" text-anchor="start">CHANGE INTELLIGENCE</text><text x="652" y="1151" font-size="16" font-weight="400" fill="#c2d3e0" text-anchor="start">Consequence Delta, Compliance Twin</text><text x="652" y="1176" font-size="16" font-weight="400" fill="#c2d3e0" text-anchor="start">Comparable before/after evidence</text><rect x="1198" y="1080" width="535" height="132" rx="16" fill="#172e45" stroke="#ffba89" stroke-width="1.5" stroke-dasharray="9 6"/><text x="1220" y="1119" font-size="20" font-weight="750" fill="#f8fbff" text-anchor="start">TARGET-NATIVE ENFORCEMENT</text><text x="1220" y="1151" font-size="16" font-weight="400" fill="#c2d3e0" text-anchor="start">Customer PEP / gateway / guard</text><text x="1220" y="1176" font-size="16" font-weight="400" fill="#c2d3e0" text-anchor="start">Only when verified and authorized</text><path d="M 1439 1014 L 1439 1073" stroke="#ffba89" stroke-width="2" stroke-dasharray="3 8" fill="none"/><text x="1442" y="1046" font-size="12" font-weight="400" fill="#fbc89f" text-anchor="start">conditional only</text><rect x="62" y="1231" width="1672" height="51" rx="12" fill="#112239" stroke="#37556c" stroke-width="1" /><text x="86" y="1263" font-size="15" font-weight="640" fill="#c3d4e5" text-anchor="start">TRUST RULES:  Connected != qualified   |   Assessment BLOCK != CI gate or target deny   |   Approval != execution   |   No native adapter = NOT_WIRED</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1190" viewBox="0 0 1800 1190" role="img" aria-labelledby="d3-title d3-desc"><title id="d3-title">HAIEC D3 — Agent Action, Authority and Evidence Frontier Map</title><desc id="d3-desc">Illustrative agent to capability to tool to resource to consequence topology, with unknown proof boundary explicitly marked. Five requested, policy authorized, effectively granted, code capable and observed evidence facets are independent. Delegated Action Integrity compares nine dimensions when eligible, not a sixth evidence plane. This sample is fictional and not a live HAIEC trace or verified tenant result.</desc><defs><linearGradient id="d3-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081628"/><stop offset="1" stop-color="#132a40"/></linearGradient></defs><rect x="0" y="0" width="1800" height="1190" rx="0" fill="url(#d3-bg)" stroke="none" stroke-width="0" /><text x="66" y="58" font-size="17" font-weight="750" fill="#85d3ef" text-anchor="start">HAIEC  /  ACTION &amp; AUTHORITY PROOF</text><text x="66" y="111" font-size="39" font-weight="760" fill="#f8fbff" text-anchor="start">From agent intent to consequence — without inventing the missing links.</text><text x="66" y="147" font-size="19" font-weight="400" fill="#b2c7db" text-anchor="start">Use the real HAIEC Action Map / AgentTrace projection for customer-specific edges; this diagram only explains how to read one.</text><rect x="1541" y="66" width="192" height="31" rx="15" fill="#203a53" stroke="none" stroke-width="0" /><text x="1637" y="87" font-size="13" font-weight="700" fill="#d6eef7" text-anchor="middle">D3  /  SCHEMATIC</text><rect x="62" y="186" width="1674" height="70" rx="13" fill="#2e293d" stroke="#b994ee" stroke-width="1.5" /><text x="87" y="212" font-size="16" font-weight="750" fill="#e2cafd" text-anchor="start">ILLUSTRATIVE TOPOLOGY — NOT A LIVE EVALUATION</text><text x="87" y="239" font-size="15" font-weight="400" fill="#e2d2f4" text-anchor="start">All named nodes and relationships below are fictional examples. In production, solid evidence edges require exact canonical relations and source identity.</text><text x="66" y="303" font-size="17" font-weight="750" fill="#82d2ea" text-anchor="start">01  POTENTIAL ACTION PATH  /  RELATIONSHIPS REQUIRE DISTINCT EVIDENCE</text><rect x="62" y="325" width="310" height="167" rx="16" fill="#182e47" stroke="#6cc4e9" stroke-width="1.7" /><rect x="80" y="345" width="6" height="127" rx="3" fill="#6cc4e9" stroke="#6cc4e9" stroke-width="0" /><text x="103" y="360" font-size="15" font-weight="750" fill="#6cc4e9" text-anchor="start">AGENT / IDENTITY</text><text x="103" y="399" font-size="21" font-weight="700" fill="#f7fbff" text-anchor="start">Support agent</text><text x="103" y="433" font-size="15" font-weight="400" fill="#aec4d8" text-anchor="start">Which principal?</text><text x="103" y="457" font-size="15" font-weight="400" fill="#aec4d8" text-anchor="start">Which session / tenant?</text><rect x="402" y="325" width="310" height="167" rx="16" fill="#182e47" stroke="#ba9ef4" stroke-width="1.7" /><rect x="420" y="345" width="6" height="127" rx="3" fill="#ba9ef4" stroke="#ba9ef4" stroke-width="0" /><text x="443" y="360" font-size="15" font-weight="750" fill="#ba9ef4" text-anchor="start">CAPABILITY</text><text x="443" y="399" font-size="21" font-weight="700" fill="#f7fbff" text-anchor="start">Update customer case</text><text x="443" y="433" font-size="15" font-weight="400" fill="#aec4d8" text-anchor="start">Declared action class</text><text x="443" y="457" font-size="15" font-weight="400" fill="#aec4d8" text-anchor="start">Not a delegated grant</text><rect x="742" y="325" width="310" height="167" rx="16" fill="#182e47" stroke="#f1c987" stroke-width="1.7" /><rect x="760" y="345" width="6" height="127" rx="3" fill="#f1c987" stroke="#f1c987" stroke-width="0" /><text x="783" y="360" font-size="15" font-weight="750" fill="#f1c987" text-anchor="start">TOOL OR API</text><text x="783" y="399" font-size="21" font-weight="700" fill="#f7fbff" text-anchor="start">Tool invocation</text><text x="783" y="433" font-size="15" font-weight="400" fill="#aec4d8" text-anchor="start">Tool name / handler</text><text x="783" y="457" font-size="15" font-weight="400" fill="#aec4d8" text-anchor="start">Exact operation needed</text><rect x="1082" y="325" width="310" height="167" rx="16" fill="#182e47" stroke="#f3a99e" stroke-width="1.7" /><rect x="1100" y="345" width="6" height="127" rx="3" fill="#f3a99e" stroke="#f3a99e" stroke-width="0" /><text x="1123" y="360" font-size="15" font-weight="750" fill="#f3a99e" text-anchor="start">RESOURCE TARGET</text><text x="1123" y="399" font-size="21" font-weight="700" fill="#f7fbff" text-anchor="start">Customer record</text><text x="1123" y="433" font-size="15" font-weight="400" fill="#aec4d8" text-anchor="start">Target ownership unknown</text><text x="1123" y="457" font-size="15" font-weight="400" fill="#aec4d8" text-anchor="start">Effective permission unknown</text><rect x="1422" y="325" width="310" height="167" rx="16" fill="#182e47" stroke="#72dac4" stroke-width="1.7" /><rect x="1440" y="345" width="6" height="127" rx="3" fill="#72dac4" stroke="#72dac4" stroke-width="0" /><text x="1463" y="360" font-size="15" font-weight="750" fill="#72dac4" text-anchor="start">POTENTIAL EFFECT</text><text x="1463" y="399" font-size="21" font-weight="700" fill="#f7fbff" text-anchor="start">Record modified</text><text x="1463" y="433" font-size="15" font-weight="400" fill="#aec4d8" text-anchor="start">Actual mutation unproved</text><text x="1463" y="457" font-size="15" font-weight="400" fill="#aec4d8" text-anchor="start">Separate readback required</text><path d="M 372 410 H 402" fill="none" stroke="#8ba8c1" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/><path d="M 712 410 H 742" fill="none" stroke="#8ba8c1" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/><path d="M 1052 410 H 1082" fill="none" stroke="#f3af8c" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/><path d="M 1392 410 H 1422" fill="none" stroke="#8ba8c1" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/><rect x="1020" y="501" width="177" height="31" rx="15" fill="#203a53" stroke="none" stroke-width="0" /><text x="1108.5" y="522" font-size="13" font-weight="700" fill="#ffc27f" text-anchor="middle">PROOF FRONTIER</text><path d="M 1082 493 V 476" fill="none" stroke="#ffc27f" stroke-width="2.2" stroke-dasharray="3 5" stroke-linecap="round"/><text x="66" y="546" font-size="17" font-weight="750" fill="#82d2ea" text-anchor="start">02  FIVE INDEPENDENT EVIDENCE PLANES  /  NO SYNTHETIC PASS STATES</text><rect x="62" y="570" width="310" height="141" rx="13" fill="#182f47" stroke="#93dbf5" stroke-width="1.2" /><text x="79" y="599" font-size="16" font-weight="750" fill="#93dbf5" text-anchor="start">REQUESTED</text><text x="79" y="636" font-size="15" font-weight="650" fill="#ebf3fd" text-anchor="start">Stated desired action</text><text x="79" y="674" font-size="15" font-weight="600" fill="#d6ad85" text-anchor="start">Declared; not verified</text><text x="79" y="697" font-size="12" font-weight="400" fill="#93aac0" text-anchor="start">Not a pass / fail assertion</text><rect x="402" y="570" width="310" height="141" rx="13" fill="#182f47" stroke="#ffd08c" stroke-width="1.2" /><text x="419" y="599" font-size="16" font-weight="750" fill="#ffd08c" text-anchor="start">POLICY AUTHORIZED</text><text x="419" y="636" font-size="15" font-weight="650" fill="#ebf3fd" text-anchor="start">Approved business boundary</text><text x="419" y="674" font-size="15" font-weight="600" fill="#d6ad85" text-anchor="start">Not supplied in example</text><text x="419" y="697" font-size="12" font-weight="400" fill="#93aac0" text-anchor="start">Not a pass / fail assertion</text><rect x="742" y="570" width="310" height="141" rx="13" fill="#182f47" stroke="#c7a8ff" stroke-width="1.2" /><text x="759" y="599" font-size="16" font-weight="750" fill="#c7a8ff" text-anchor="start">EFFECTIVELY GRANTED</text><text x="759" y="636" font-size="15" font-weight="650" fill="#ebf3fd" text-anchor="start">Target/provider privileges</text><text x="759" y="674" font-size="15" font-weight="600" fill="#d6ad85" text-anchor="start">Not established</text><text x="759" y="697" font-size="12" font-weight="400" fill="#93aac0" text-anchor="start">Not a pass / fail assertion</text><rect x="1082" y="570" width="310" height="141" rx="13" fill="#182f47" stroke="#9ebffb" stroke-width="1.2" /><text x="1099" y="599" font-size="16" font-weight="750" fill="#9ebffb" text-anchor="start">CODE CAPABLE</text><text x="1099" y="636" font-size="15" font-weight="650" fill="#ebf3fd" text-anchor="start">Reachable implementation path</text><text x="1099" y="674" font-size="15" font-weight="600" fill="#d6ad85" text-anchor="start">Not assessed in example</text><text x="1099" y="697" font-size="12" font-weight="400" fill="#93aac0" text-anchor="start">Not a pass / fail assertion</text><rect x="1422" y="570" width="310" height="141" rx="13" fill="#182f47" stroke="#7ae1c5" stroke-width="1.2" /><text x="1439" y="599" font-size="16" font-weight="750" fill="#7ae1c5" text-anchor="start">OBSERVED</text><text x="1439" y="636" font-size="15" font-weight="650" fill="#ebf3fd" text-anchor="start">Recorded activity / effect</text><text x="1439" y="674" font-size="15" font-weight="600" fill="#d6ad85" text-anchor="start">No authenticated witness</text><text x="1439" y="697" font-size="12" font-weight="400" fill="#93aac0" text-anchor="start">Not a pass / fail assertion</text><rect x="62" y="749" width="905" height="232" rx="17" fill="#192b42" stroke="#ac92e1" stroke-width="1.6" /><text x="87" y="791" font-size="19" font-weight="760" fill="#dcc8ff" text-anchor="start">03  DELEGATED ACTION INTEGRITY</text><text x="87" y="819" font-size="16" font-weight="400" fill="#c5d2e4" text-anchor="start">Separate nine-dimension authority comparison; not a sixth plane.</text><rect x="87" y="842" width="255" height="32" rx="7" fill="#2c354d" stroke="#746592" stroke-width="0.9" /><text x="99" y="864" font-size="14" font-weight="690" fill="#e7dafa" text-anchor="start">OPERATION</text><rect x="367" y="842" width="255" height="32" rx="7" fill="#2c354d" stroke="#746592" stroke-width="0.9" /><text x="379" y="864" font-size="14" font-weight="690" fill="#e7dafa" text-anchor="start">TARGET</text><rect x="647" y="842" width="255" height="32" rx="7" fill="#2c354d" stroke="#746592" stroke-width="0.9" /><text x="659" y="864" font-size="14" font-weight="690" fill="#e7dafa" text-anchor="start">SCOPE</text><rect x="87" y="884" width="255" height="32" rx="7" fill="#2c354d" stroke="#746592" stroke-width="0.9" /><text x="99" y="906" font-size="14" font-weight="690" fill="#e7dafa" text-anchor="start">MAGNITUDE</text><rect x="367" y="884" width="255" height="32" rx="7" fill="#2c354d" stroke="#746592" stroke-width="0.9" /><text x="379" y="906" font-size="14" font-weight="690" fill="#e7dafa" text-anchor="start">DURATION</text><rect x="647" y="884" width="255" height="32" rx="7" fill="#2c354d" stroke="#746592" stroke-width="0.9" /><text x="659" y="906" font-size="14" font-weight="690" fill="#e7dafa" text-anchor="start">APPROVAL</text><rect x="87" y="926" width="255" height="32" rx="7" fill="#2c354d" stroke="#746592" stroke-width="0.9" /><text x="99" y="948" font-size="14" font-weight="690" fill="#e7dafa" text-anchor="start">DATA CLASS</text><rect x="367" y="926" width="255" height="32" rx="7" fill="#2c354d" stroke="#746592" stroke-width="0.9" /><text x="379" y="948" font-size="14" font-weight="690" fill="#e7dafa" text-anchor="start">ENVIRONMENT</text><rect x="647" y="926" width="255" height="32" rx="7" fill="#2c354d" stroke="#746592" stroke-width="0.9" /><text x="659" y="948" font-size="14" font-weight="690" fill="#e7dafa" text-anchor="start">GEOGRAPHY</text><rect x="994" y="749" width="742" height="232" rx="17" fill="#182f47" stroke="#4d9bb1" stroke-width="1.6" /><text x="1019" y="791" font-size="19" font-weight="760" fill="#9ce8ed" text-anchor="start">04  WHAT HAIEC MAY CONCLUDE</text><text x="1019" y="826" font-size="16" font-weight="400" fill="#c7dae9" text-anchor="start">Qualified relation: show basis, scan/evaluation and ID.</text><text x="1019" y="855" font-size="16" font-weight="400" fill="#c7dae9" text-anchor="start">Evidence gap: stop at the first unestablished join.</text><text x="1019" y="884" font-size="16" font-weight="400" fill="#c7dae9" text-anchor="start">Delegation missing: NOT_ASSESSED, not a violation.</text><text x="1019" y="913" font-size="16" font-weight="400" fill="#c7dae9" text-anchor="start">Source reachability != execution or target effect.</text><text x="1019" y="942" font-size="16" font-weight="400" fill="#c7dae9" text-anchor="start">Human approval != mediation or native enforcement.</text><rect x="62" y="1006" width="1674" height="94" rx="16" fill="#123c49" stroke="#60bdbb" stroke-width="1.6" /><text x="85" y="1041" font-size="20" font-weight="740" fill="#e9feff" text-anchor="start">REAL CUSTOMER VIEWS MUST USE THE CANONICAL PROJECTOR</text><text x="85" y="1072" font-size="16" font-weight="400" fill="#c2e9e9" text-anchor="start">Action Map / AgentTrace  ·  exact relation + joined source  ·  CURRENT versus EVALUATED basis  ·  first unresolved continuation  ·  export via MCP/REST</text><text x="66" y="1150" font-size="15" font-weight="400" fill="#b0c3d5" text-anchor="start">LEGEND: dashed = illustrative / unestablished  ·  amber = evidence needed  ·  scoped green only with real supported proof  ·  no fictional cross-system delegated effects.</text></svg>
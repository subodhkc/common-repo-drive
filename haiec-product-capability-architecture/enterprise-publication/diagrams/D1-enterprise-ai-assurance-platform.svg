<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="d1-title d1-desc"><title id="d1-title">HAIEC D1 — Enterprise AI Assurance Platform</title><desc id="d1-desc">Three business pillars and six independently selectable customer jobs in a shared system workspace. Qualified evidence and deterministic assessment underpin applicable workflows. Security testing, monitoring, protection and governance have distinct prerequisites; the diagram is conceptual, not live customer evidence.</desc><defs><linearGradient id="d1-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#122c43"/></linearGradient><linearGradient id="d1-spine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#123b53"/><stop offset="1" stop-color="#1b2f54"/></linearGradient></defs><rect x="0" y="0" width="1600" height="1020" rx="0" fill="url(#d1-bg)" stroke="none" stroke-width="0" /><text x="70" y="61" font-size="17" font-weight="750" fill="#72c9e8" text-anchor="start">HAIEC  /  ENTERPRISE AI ASSURANCE</text><text x="70" y="114" font-size="40" font-weight="760" fill="#f8fbff" text-anchor="start">One platform. Six independent ways to establish trust.</text><text x="70" y="151" font-size="20" font-weight="400" fill="#adc2d6" text-anchor="start">Understand AI capability, assess consequential risk, and govern decisions with evidence.</text><rect x="1330" y="70" width="192" height="30" rx="15" fill="#213c55" stroke="none" stroke-width="0" /><text x="1426" y="91" font-size="13" font-weight="700" fill="#dcf7ff" text-anchor="middle">D1  /  PLATFORM</text><rect x="65" y="192" width="1470" height="84" rx="18" fill="#172b42" stroke="#42627b" stroke-width="1.5" /><text x="91" y="226" font-size="15" font-weight="750" fill="#79d8ea" text-anchor="start">START ANYWHERE</text><text x="290" y="225" font-size="18" font-weight="700" fill="#f6f8ff" text-anchor="start">Select an AI system</text><text x="290" y="251" font-size="15" font-weight="400" fill="#9fb5c9" text-anchor="start">Existing estate or selected agent</text><path d="M 626 216 L 626 253" stroke="#3e617a" stroke-width="1" stroke-dasharray="4 5" fill="none"/><text x="688" y="225" font-size="18" font-weight="700" fill="#f6f8ff" text-anchor="start">Choose an objective</text><text x="688" y="251" font-size="15" font-weight="400" fill="#9fb5c9" text-anchor="start">Security, approval, operations</text><path d="M 1024 216 L 1024 253" stroke="#3e617a" stroke-width="1" stroke-dasharray="4 5" fill="none"/><text x="1086" y="225" font-size="18" font-weight="700" fill="#f6f8ff" text-anchor="start">Connect evidence</text><text x="1086" y="251" font-size="15" font-weight="400" fill="#9fb5c9" text-anchor="start">Repository, telemetry, records</text><text x="70" y="313" font-size="15" font-weight="750" fill="#7ebfdd" text-anchor="start">THREE PRODUCT PILLARS</text><rect x="65" y="330" width="470" height="97" rx="16" fill="#152c46" stroke="#38bdf8" stroke-width="1.6" /><rect x="85" y="349" width="6" height="57" rx="3" fill="#38bdf8" stroke="#38bdf8" stroke-width="0" /><text x="109" y="373" font-size="23" font-weight="750" fill="#38bdf8" text-anchor="start">UNDERSTAND</text><text x="109" y="400" font-size="15" font-weight="400" fill="#cfdbeb" text-anchor="start">Establish systems, actions, dependencies</text><rect x="565" y="330" width="470" height="97" rx="16" fill="#152c46" stroke="#b794ff" stroke-width="1.6" /><rect x="585" y="349" width="6" height="57" rx="3" fill="#b794ff" stroke="#b794ff" stroke-width="0" /><text x="609" y="373" font-size="23" font-weight="750" fill="#b794ff" text-anchor="start">ASSURE</text><text x="609" y="400" font-size="15" font-weight="400" fill="#cfdbeb" text-anchor="start">Test security and compare evidence</text><rect x="1065" y="330" width="470" height="97" rx="16" fill="#152c46" stroke="#4adeb8" stroke-width="1.6" /><rect x="1085" y="349" width="6" height="57" rx="3" fill="#4adeb8" stroke="#4adeb8" stroke-width="0" /><text x="1109" y="373" font-size="23" font-weight="750" fill="#4adeb8" text-anchor="start">GOVERN &amp; OPERATE</text><text x="1109" y="400" font-size="15" font-weight="400" fill="#cfdbeb" text-anchor="start">Decide, observe and verify controls</text><text x="70" y="472" font-size="16" font-weight="750" fill="#dbeafe" text-anchor="start">CHOOSE A CUSTOMER JOB — NOT A REQUIRED SIX-STEP PIPELINE</text><rect x="65" y="492" width="470" height="132" rx="16" fill="#12263d" stroke="#36516b" stroke-width="1.5" /><rect x="80" y="509" width="5" height="98" rx="3" fill="#4ec7ee" stroke="#4ec7ee" stroke-width="0" /><text x="101" y="536" font-size="24" font-weight="700" fill="#f8fbff" text-anchor="start">DISCOVER</text><text x="101" y="566" font-size="16" font-weight="400" fill="#b6c7d8" text-anchor="start">AI estate, agents, tools, action paths</text><text x="101" y="591" font-size="16" font-weight="400" fill="#b6c7d8" text-anchor="start">Which consequential capabilities exist?</text><rect x="459" y="508" width="56" height="30" rx="15" fill="#253b53" stroke="none" stroke-width="0" /><text x="487" y="529" font-size="13" font-weight="700" fill="#d5e9f7" text-anchor="middle">01</text><rect x="565" y="492" width="470" height="132" rx="16" fill="#12263d" stroke="#36516b" stroke-width="1.5" /><rect x="580" y="509" width="5" height="98" rx="3" fill="#b794ff" stroke="#b794ff" stroke-width="0" /><text x="601" y="536" font-size="24" font-weight="700" fill="#f8fbff" text-anchor="start">EVALUATE</text><text x="601" y="566" font-size="16" font-weight="400" fill="#b6c7d8" text-anchor="start">AI AppSec, MCP, controls, DAI</text><text x="601" y="591" font-size="16" font-weight="400" fill="#b6c7d8" text-anchor="start">What does qualified evidence establish?</text><rect x="959" y="508" width="56" height="30" rx="15" fill="#253b53" stroke="none" stroke-width="0" /><text x="987" y="529" font-size="13" font-weight="700" fill="#d5e9f7" text-anchor="middle">02</text><rect x="1065" y="492" width="470" height="132" rx="16" fill="#12263d" stroke="#36516b" stroke-width="1.5" /><rect x="1080" y="509" width="5" height="98" rx="3" fill="#ffca80" stroke="#ffca80" stroke-width="0" /><text x="1101" y="536" font-size="24" font-weight="700" fill="#f8fbff" text-anchor="start">AUTHORIZE</text><text x="1101" y="566" font-size="16" font-weight="400" fill="#b6c7d8" text-anchor="start">Operating Envelope, scoped human review</text><text x="1101" y="591" font-size="16" font-weight="400" fill="#b6c7d8" text-anchor="start">Who may approve this action or release?</text><rect x="1459" y="508" width="56" height="30" rx="15" fill="#253b53" stroke="none" stroke-width="0" /><text x="1487" y="529" font-size="13" font-weight="700" fill="#d5e9f7" text-anchor="middle">03</text><rect x="65" y="642" width="470" height="132" rx="16" fill="#12263d" stroke="#36516b" stroke-width="1.5" /><rect x="80" y="659" width="5" height="98" rx="3" fill="#6ee7bf" stroke="#6ee7bf" stroke-width="0" /><text x="101" y="686" font-size="24" font-weight="700" fill="#f8fbff" text-anchor="start">MONITOR</text><text x="101" y="716" font-size="16" font-weight="400" fill="#b6c7d8" text-anchor="start">Source health, behavior, drift and usage</text><text x="101" y="741" font-size="16" font-weight="400" fill="#b6c7d8" text-anchor="start">What changed, and can we observe it?</text><rect x="459" y="658" width="56" height="30" rx="15" fill="#253b53" stroke="none" stroke-width="0" /><text x="487" y="679" font-size="13" font-weight="700" fill="#d5e9f7" text-anchor="middle">04</text><rect x="565" y="642" width="470" height="132" rx="16" fill="#12263d" stroke="#36516b" stroke-width="1.5" /><rect x="580" y="659" width="5" height="98" rx="3" fill="#fb91a7" stroke="#fb91a7" stroke-width="0" /><text x="601" y="686" font-size="24" font-weight="700" fill="#f8fbff" text-anchor="start">PROTECT</text><text x="601" y="716" font-size="16" font-weight="400" fill="#b6c7d8" text-anchor="start">Guard decisions and native integration</text><text x="601" y="741" font-size="16" font-weight="400" fill="#b6c7d8" text-anchor="start">Can a real enforcement point intervene?</text><rect x="959" y="658" width="56" height="30" rx="15" fill="#253b53" stroke="none" stroke-width="0" /><text x="987" y="679" font-size="13" font-weight="700" fill="#d5e9f7" text-anchor="middle">05</text><rect x="1065" y="642" width="470" height="132" rx="16" fill="#12263d" stroke="#36516b" stroke-width="1.5" /><rect x="1080" y="659" width="5" height="98" rx="3" fill="#84c9ff" stroke="#84c9ff" stroke-width="0" /><text x="1101" y="686" font-size="24" font-weight="700" fill="#f8fbff" text-anchor="start">VERIFY</text><text x="1101" y="716" font-size="16" font-weight="400" fill="#b6c7d8" text-anchor="start">Control proof, receipts, compliance state</text><text x="1101" y="741" font-size="16" font-weight="400" fill="#b6c7d8" text-anchor="start">What can the enterprise substantiate?</text><rect x="1459" y="658" width="56" height="30" rx="15" fill="#253b53" stroke="none" stroke-width="0" /><text x="1487" y="679" font-size="13" font-weight="700" fill="#d5e9f7" text-anchor="middle">06</text><text x="70" y="826" font-size="16" font-weight="750" fill="#90dbf2" text-anchor="start">SHARED EVIDENCE AND ASSURANCE FOUNDATION</text><rect x="65" y="845" width="1470" height="102" rx="18" fill="url(#d1-spine)" stroke="#4f849e" stroke-width="1.5" /><text x="93" y="884" font-size="17" font-weight="700" fill="#f8fbff" text-anchor="start">SOURCE QUALIFICATION</text><text x="93" y="916" font-size="15" font-weight="400" fill="#aac7d9" text-anchor="start">Identity, tenant, coverage</text><path d="M 417 869 L 417 924" stroke="#5785a0" stroke-width="1.4" stroke-dasharray="4 7" fill="none"/><text x="453" y="884" font-size="17" font-weight="700" fill="#f8fbff" text-anchor="start">PROVENANCE &amp; HISTORY</text><text x="453" y="916" font-size="15" font-weight="400" fill="#aac7d9" text-anchor="start">As-of time, source, revision</text><path d="M 777 869 L 777 924" stroke="#5785a0" stroke-width="1.4" stroke-dasharray="4 7" fill="none"/><text x="813" y="884" font-size="17" font-weight="700" fill="#f8fbff" text-anchor="start">DETERMINISTIC RESULTS</text><text x="813" y="916" font-size="15" font-weight="400" fill="#aac7d9" text-anchor="start">Scoped evaluation, explicit unknowns</text><path d="M 1137 869 L 1137 924" stroke="#5785a0" stroke-width="1.4" stroke-dasharray="4 7" fill="none"/><text x="1173" y="884" font-size="17" font-weight="700" fill="#f8fbff" text-anchor="start">ACCOUNTABILITY</text><text x="1173" y="916" font-size="15" font-weight="400" fill="#aac7d9" text-anchor="start">Policy, human decisions, receipts</text><text x="68" y="986" font-size="14" font-weight="400" fill="#9bb2c7" text-anchor="start">ILLUSTRATIVE PRODUCT MAP  ·  Workflows remain independently accessible; enrolled sources, entitlements and enforcement differ by organization.</text></svg>
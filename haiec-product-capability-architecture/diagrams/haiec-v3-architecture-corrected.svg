<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1630 1360" role="img" aria-labelledby="title desc"><title id="title">HAIEC product capability architecture</title><desc id="desc">Proposed source-qualified diagrams showing independent HAIEC capability families, evidence and action readiness, and user paths. Not a live system assessment.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#486985"/></marker></defs><rect width="1630" height="1360" fill="#f8fbff"/><g font-family="Arial, Helvetica, sans-serif"><text x="46" y="65" font-size="36" font-weight="800" fill="#101e36" text-anchor="start">HAIEC Product Architecture &amp; Capability Engine</text><text x="46" y="97" font-size="19" font-weight="400" fill="#516986" text-anchor="start">Four capability domains. Independent entry points. One evidence-based foundation.</text><rect x="46" y="128" width="1538" height="56" rx="11" fill="#2167e9" stroke="#2167e9" stroke-width="1.5"/><text x="68" y="164" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">01  CONNECT &amp; DISCOVER</text><text x="1564" y="163" font-size="16" font-weight="500" fill="#ffffff" text-anchor="end">Authorized sources; choose only what is relevant</text><rect x="46" y="197" width="500.6666666666667" height="161" rx="10" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/><text x="65" y="229" font-size="19" font-weight="700" fill="#16243c" text-anchor="start">Connections and intake</text><circle cx="66" cy="257" r="3.5" fill="#2167e9"/><text x="80" y="261" font-size="16" font-weight="500" fill="#354966" text-anchor="start">GitHub, API, MCP and local preview</text><circle cx="66" cy="283" r="3.5" fill="#2167e9"/><text x="80" y="287" font-size="16" font-weight="500" fill="#354966" text-anchor="start">OTLP or structured runtime evidence</text><circle cx="66" cy="309" r="3.5" fill="#2167e9"/><text x="80" y="313" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Optional provider/IAM observation</text><rect x="558.6666666666667" y="197" width="500.6666666666667" height="161" rx="10" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/><text x="577.6666666666667" y="229" font-size="19" font-weight="700" fill="#16243c" text-anchor="start">Developer experience</text><circle cx="578.6666666666667" cy="257" r="3.5" fill="#2167e9"/><text x="592.6666666666667" y="261" font-size="16" font-weight="500" fill="#354966" text-anchor="start">IDE / MCP guided preflight</text><circle cx="578.6666666666667" cy="283" r="3.5" fill="#2167e9"/><text x="592.6666666666667" y="287" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Remote assurance; local preview limits</text><circle cx="578.6666666666667" cy="309" r="3.5" fill="#2167e9"/><text x="592.6666666666667" y="313" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Optional evidence and manifest templates</text><rect x="1071.3333333333335" y="197" width="500.6666666666667" height="161" rx="10" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/><text x="1090.3333333333335" y="229" font-size="19" font-weight="700" fill="#16243c" text-anchor="start">AI system explorer</text><circle cx="1091.3333333333335" cy="257" r="3.5" fill="#2167e9"/><text x="1105.3333333333335" y="261" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Inventory and agent/tool topology</text><circle cx="1091.3333333333335" cy="283" r="3.5" fill="#2167e9"/><text x="1105.3333333333335" y="287" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Action and capability path discovery</text><circle cx="1091.3333333333335" cy="309" r="3.5" fill="#2167e9"/><text x="1105.3333333333335" y="313" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Source / connector coverage states</text><rect x="46" y="430" width="1538" height="56" rx="11" fill="#7c3bed" stroke="#7c3bed" stroke-width="1.5"/><text x="68" y="466" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">02  EVALUATE &amp; ASSURE</text><text x="1564" y="465" font-size="16" font-weight="500" fill="#ffffff" text-anchor="end">Selected checks using qualified inputs</text><rect x="46" y="499" width="500.6666666666667" height="161" rx="10" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/><text x="65" y="531" font-size="19" font-weight="700" fill="#16243c" text-anchor="start">Canonical evidence planes</text><circle cx="66" cy="559" r="3.5" fill="#7c3bed"/><text x="80" y="563" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Requested and approved policy</text><circle cx="66" cy="585" r="3.5" fill="#7c3bed"/><text x="80" y="589" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Effective grant / code capable</text><circle cx="66" cy="611" r="3.5" fill="#7c3bed"/><text x="80" y="615" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Observed behavior — each independent</text><rect x="558.6666666666667" y="499" width="500.6666666666667" height="161" rx="10" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/><text x="577.6666666666667" y="531" font-size="19" font-weight="700" fill="#16243c" text-anchor="start">Deterministic analyses</text><circle cx="578.6666666666667" cy="559" r="3.5" fill="#7c3bed"/><text x="592.6666666666667" y="563" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Source, path, data/control flow</text><circle cx="578.6666666666667" cy="585" r="3.5" fill="#7c3bed"/><text x="592.6666666666667" y="589" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Nine-dimensional DAI comparisons</text><circle cx="578.6666666666667" cy="611" r="3.5" fill="#7c3bed"/><text x="592.6666666666667" y="615" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Effect witness and evidence frontiers</text><rect x="1071.3333333333335" y="499" width="500.6666666666667" height="161" rx="10" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/><text x="1090.3333333333335" y="531" font-size="19" font-weight="700" fill="#16243c" text-anchor="start">Controls and applicability</text><circle cx="1091.3333333333335" cy="559" r="3.5" fill="#7c3bed"/><text x="1105.3333333333335" y="563" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Profile-specific executable checks</text><circle cx="1091.3333333333335" cy="585" r="3.5" fill="#7c3bed"/><text x="1105.3333333333335" y="589" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Rule / producer readiness separated</text><circle cx="1091.3333333333335" cy="611" r="3.5" fill="#7c3bed"/><text x="1105.3333333333335" y="615" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Unknown is never promoted to pass</text><rect x="46" y="732" width="1538" height="56" rx="11" fill="#db7709" stroke="#db7709" stroke-width="1.5"/><text x="68" y="768" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">03  GOVERN &amp; OPERATE</text><text x="1564" y="767" font-size="16" font-weight="500" fill="#ffffff" text-anchor="end">Not a required step after scanning</text><rect x="46" y="801" width="500.6666666666667" height="161" rx="10" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/><text x="65" y="833" font-size="19" font-weight="700" fill="#16243c" text-anchor="start">Authority and decisions</text><circle cx="66" cy="861" r="3.5" fill="#db7709"/><text x="80" y="865" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Versioned approved Operating Envelope</text><circle cx="66" cy="887" r="3.5" fill="#db7709"/><text x="80" y="891" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Separate human deployment decision</text><circle cx="66" cy="913" r="3.5" fill="#db7709"/><text x="80" y="917" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Scoped expiration and revocation</text><rect x="558.6666666666667" y="801" width="500.6666666666667" height="161" rx="10" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/><text x="577.6666666666667" y="833" font-size="19" font-weight="700" fill="#16243c" text-anchor="start">Runtime monitoring</text><circle cx="578.6666666666667" cy="861" r="3.5" fill="#db7709"/><text x="592.6666666666667" y="865" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Source health and qualified signals</text><circle cx="578.6666666666667" cy="887" r="3.5" fill="#db7709"/><text x="592.6666666666667" y="891" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Evidence-bound drift and notifications</text><circle cx="578.6666666666667" cy="913" r="3.5" fill="#db7709"/><text x="592.6666666666667" y="917" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Observation does not imply enforcement</text><rect x="1071.3333333333335" y="801" width="500.6666666666667" height="161" rx="10" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/><text x="1090.3333333333335" y="833" font-size="19" font-weight="700" fill="#16243c" text-anchor="start">Protection when integrated</text><circle cx="1091.3333333333335" cy="861" r="3.5" fill="#db7709"/><text x="1105.3333333333335" y="865" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Guardrail decision and receipt ladder</text><circle cx="1091.3333333333335" cy="887" r="3.5" fill="#db7709"/><text x="1105.3333333333335" y="891" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Kill/recovery only at verified hook</text><circle cx="1091.3333333333335" cy="913" r="3.5" fill="#db7709"/><text x="1105.3333333333335" y="917" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Independent operational readiness</text><rect x="46" y="1034" width="1538" height="56" rx="11" fill="#048e73" stroke="#048e73" stroke-width="1.5"/><text x="68" y="1070" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">04  VERIFY &amp; REASSESS</text><text x="1564" y="1069" font-size="16" font-weight="500" fill="#ffffff" text-anchor="end">Outputs available per selected workflow</text><rect x="46" y="1103" width="500.6666666666667" height="161" rx="10" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/><text x="65" y="1135" font-size="19" font-weight="700" fill="#16243c" text-anchor="start">Evidence and reporting</text><circle cx="66" cy="1163" r="3.5" fill="#048e73"/><text x="80" y="1167" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Exact evaluation-bound reports</text><circle cx="66" cy="1189" r="3.5" fill="#048e73"/><text x="80" y="1193" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Passports and verification records</text><circle cx="66" cy="1215" r="3.5" fill="#048e73"/><text x="80" y="1219" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Hashes ≠ automatic immutability</text><rect x="558.6666666666667" y="1103" width="500.6666666666667" height="161" rx="10" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/><text x="577.6666666666667" y="1135" font-size="19" font-weight="700" fill="#16243c" text-anchor="start">Change intelligence</text><circle cx="578.6666666666667" cy="1163" r="3.5" fill="#048e73"/><text x="592.6666666666667" y="1167" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Consequence Delta / Compliance Twin</text><circle cx="578.6666666666667" cy="1189" r="3.5" fill="#048e73"/><text x="592.6666666666667" y="1193" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Runtime differential / new evidence</text><circle cx="578.6666666666667" cy="1215" r="3.5" fill="#048e73"/><text x="592.6666666666667" y="1219" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Only comparable snapshots</text><rect x="1071.3333333333335" y="1103" width="500.6666666666667" height="161" rx="10" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/><text x="1090.3333333333335" y="1135" font-size="19" font-weight="700" fill="#16243c" text-anchor="start">Organization-specific</text><circle cx="1091.3333333333335" cy="1163" r="3.5" fill="#048e73"/><text x="1105.3333333333335" y="1167" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Personas, plans and permissions</text><circle cx="1091.3333333333335" cy="1189" r="3.5" fill="#048e73"/><text x="1105.3333333333335" y="1193" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Industry profiles and controls</text><circle cx="1091.3333333333335" cy="1215" r="3.5" fill="#048e73"/><text x="1105.3333333333335" y="1219" font-size="16" font-weight="500" fill="#354966" text-anchor="start">Other modules stay optional</text><text x="46" y="1319" font-size="17" font-weight="500" fill="#576980" text-anchor="start">Product structure, not a mandated sequence. Customer enforcement requires integrated dispatch and qualified receipts.</text></g></svg>
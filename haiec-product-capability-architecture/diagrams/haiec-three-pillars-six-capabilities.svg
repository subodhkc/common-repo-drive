<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1100" role="img" aria-labelledby="title desc"><title id="title">HAIEC product capability architecture</title><desc id="desc">Proposed source-qualified diagrams showing independent HAIEC capability families, evidence and action readiness, and user paths. Not a live system assessment.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#6ee7f3"/></marker></defs><rect width="1760" height="1100" fill="#091626"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="62" font-size="37" font-weight="800" fill="#eaf7ff" text-anchor="start">HAIEC | Unified Product Architecture</text><text x="48" y="97" font-size="19" font-weight="500" fill="#a4c1d4" text-anchor="start">Three product pillars • Six optional workflows • One qualified evidence foundation</text><rect x="48" y="139" width="544" height="136" rx="14" fill="#132c45" stroke="#38bdf8" stroke-width="1.5"/><rect x="62" y="156" width="5" height="102" rx="2" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5"/><text x="81" y="183" font-size="21" font-weight="700" fill="#38bdf8" text-anchor="start">UNDERSTAND</text><text x="81" y="216" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Connections, inventory</text><text x="81" y="239" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Topology and action capability</text><rect x="616" y="139" width="544" height="136" rx="14" fill="#132c45" stroke="#c084fc" stroke-width="1.5"/><rect x="630" y="156" width="5" height="102" rx="2" fill="#c084fc" stroke="#c084fc" stroke-width="1.5"/><text x="649" y="183" font-size="21" font-weight="700" fill="#c084fc" text-anchor="start">ASSURE</text><text x="649" y="216" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Deterministic evaluations</text><text x="649" y="239" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">DAI, control proof, effect analysis</text><rect x="1184" y="139" width="544" height="136" rx="14" fill="#132c45" stroke="#2dd4bf" stroke-width="1.5"/><rect x="1198" y="156" width="5" height="102" rx="2" fill="#2dd4bf" stroke="#2dd4bf" stroke-width="1.5"/><text x="1217" y="183" font-size="21" font-weight="700" fill="#2dd4bf" text-anchor="start">GOVERN &amp; OPERATE</text><text x="1217" y="216" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Approvals, monitoring, protection</text><text x="1217" y="239" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Continuously verify change</text><text x="48" y="319" font-size="21" font-weight="700" fill="#eaf7ff" text-anchor="start">Choose a goal — modules are NOT required to execute in order</text><rect x="48" y="346" width="266" height="150" rx="14" fill="#132c45" stroke="#38bdf8" stroke-width="1.5"/><rect x="62" y="363" width="5" height="116" rx="2" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5"/><text x="81" y="390" font-size="21" font-weight="700" fill="#38bdf8" text-anchor="start">DISCOVER</text><text x="81" y="423" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Systems and agent graph</text><text x="81" y="446" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Repository/telemetry inventory</text><rect x="333" y="346" width="266" height="150" rx="14" fill="#132c45" stroke="#c084fc" stroke-width="1.5"/><rect x="347" y="363" width="5" height="116" rx="2" fill="#c084fc" stroke="#c084fc" stroke-width="1.5"/><text x="366" y="390" font-size="21" font-weight="700" fill="#c084fc" text-anchor="start">EVALUATE</text><text x="366" y="423" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Source, five planes, DAI</text><text x="366" y="446" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Applicable controls</text><rect x="618" y="346" width="266" height="150" rx="14" fill="#132c45" stroke="#fbbf24" stroke-width="1.5"/><rect x="632" y="363" width="5" height="116" rx="2" fill="#fbbf24" stroke="#fbbf24" stroke-width="1.5"/><text x="651" y="390" font-size="21" font-weight="700" fill="#fbbf24" text-anchor="start">AUTHORIZE</text><text x="651" y="423" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Operating Envelope</text><text x="651" y="446" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Human deployment decisions</text><rect x="903" y="346" width="266" height="150" rx="14" fill="#132c45" stroke="#2dd4bf" stroke-width="1.5"/><rect x="917" y="363" width="5" height="116" rx="2" fill="#2dd4bf" stroke="#2dd4bf" stroke-width="1.5"/><text x="936" y="390" font-size="21" font-weight="700" fill="#2dd4bf" text-anchor="start">MONITOR</text><text x="936" y="423" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Telemetry, changes, alerts</text><text x="936" y="446" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Qualified observed actions</text><rect x="1188" y="346" width="266" height="150" rx="14" fill="#132c45" stroke="#fb7185" stroke-width="1.5"/><rect x="1202" y="363" width="5" height="116" rx="2" fill="#fb7185" stroke="#fb7185" stroke-width="1.5"/><text x="1221" y="390" font-size="21" font-weight="700" fill="#fb7185" text-anchor="start">PROTECT</text><text x="1221" y="423" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Guardrails, dispatch mediation</text><text x="1221" y="446" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Kill Switch only if integrated</text><rect x="1473" y="346" width="266" height="150" rx="14" fill="#132c45" stroke="#86efac" stroke-width="1.5"/><rect x="1487" y="363" width="5" height="116" rx="2" fill="#86efac" stroke="#86efac" stroke-width="1.5"/><text x="1506" y="390" font-size="21" font-weight="700" fill="#86efac" text-anchor="start">VERIFY</text><text x="1506" y="423" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Reports, passport, receipt</text><text x="1506" y="446" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Compliance Twin and deltas</text><path d="M 880 503 V 556" stroke="#6ee7f3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="577" width="1662" height="192" rx="18" fill="#15253e" stroke="#7aa7d3" stroke-width="1.5"/><text x="879" y="615" font-size="24" font-weight="700" fill="#eaf7ff" text-anchor="middle">SHARED EVIDENCE &amp; DETERMINISTIC ASSURANCE FOUNDATION</text><rect x="68" y="640" width="387" height="111" rx="14" fill="#132c45" stroke="#38bdf8" stroke-width="1.5"/><rect x="82" y="657" width="5" height="77" rx="2" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5"/><text x="101" y="684" font-size="21" font-weight="700" fill="#38bdf8" text-anchor="start">QUALIFY</text><text x="101" y="717" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Source identity and admission</text><text x="101" y="740" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">No auto-trust</text><rect x="478" y="640" width="387" height="111" rx="14" fill="#132c45" stroke="#2dd4bf" stroke-width="1.5"/><rect x="492" y="657" width="5" height="77" rx="2" fill="#2dd4bf" stroke="#2dd4bf" stroke-width="1.5"/><text x="511" y="684" font-size="21" font-weight="700" fill="#2dd4bf" text-anchor="start">PROVENANCE</text><text x="511" y="717" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Time, source, digest, scope</text><text x="511" y="740" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Historical vs current</text><rect x="888" y="640" width="387" height="111" rx="14" fill="#132c45" stroke="#c084fc" stroke-width="1.5"/><rect x="902" y="657" width="5" height="77" rx="2" fill="#c084fc" stroke="#c084fc" stroke-width="1.5"/><text x="921" y="684" font-size="21" font-weight="700" fill="#c084fc" text-anchor="start">ORCHESTRATE</text><text x="921" y="717" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Only requested evaluations</text><text x="921" y="740" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">No duplicate engine</text><rect x="1298" y="640" width="387" height="111" rx="14" fill="#132c45" stroke="#fbbf24" stroke-width="1.5"/><rect x="1312" y="657" width="5" height="77" rx="2" fill="#fbbf24" stroke="#fbbf24" stroke-width="1.5"/><text x="1331" y="684" font-size="21" font-weight="700" fill="#fbbf24" text-anchor="start">EVALUATE</text><text x="1331" y="717" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Bounded deterministic truth</text><text x="1331" y="740" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Unknown remains unknown</text><text x="48" y="818" font-size="19" font-weight="700" fill="#fb7185" text-anchor="start">INDEPENDENT OPERATIONAL PATH</text><rect x="48" y="844" width="1662" height="175" rx="18" fill="#281c32" stroke="#fb7185" stroke-width="1.5"/><text x="79" y="885" font-size="21" font-weight="700" fill="#eaf7ff" text-anchor="start">Runtime monitoring, guardrail decision, and Kill Switch integration do not wait for an assurance audit.</text><text x="79" y="925" font-size="18" font-weight="500" fill="#a4c1d4" text-anchor="start">Action: scoped human/operator authority → actual dispatch integration → enforcement evidence → independent effect verification.</text><text x="79" y="961" font-size="18" font-weight="500" fill="#a4c1d4" text-anchor="start">Control readiness and availability differ by organization, system, entitlement and environment.</text><text x="48" y="1063" font-size="16" font-weight="500" fill="#a4c1d4" text-anchor="start">Illustrative architecture only. No universal permission, production protection, or zero-error guarantee.</text></g></svg>
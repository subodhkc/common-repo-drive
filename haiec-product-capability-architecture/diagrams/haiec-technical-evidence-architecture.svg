<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="ttl dsc"><title id="ttl">HAIEC | Evidence and Runtime Architecture</title><desc id="dsc">Technical diagram: inputs and qualified evidence feed selected deterministic evaluations; runtime protection is independent, DAI is an evaluation family not an enforcement system.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b1223"/><stop offset="100%" stop-color="#101b30"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#7dd3fc" stroke-width="1.5"/></marker></defs><rect width="1600" height="1050" fill="url(#bg)"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-weight="800" fill="#f8fafc" font-size="31">HAIEC | Evidence and Runtime Architecture</text><text x="44" y="86" fill="#91a4bc" font-size="16">Separate sources, canonical evaluation, governance decisions and actual enforcement.</text><text x="44" y="129" fill="#7dd3fc" font-size="17" font-weight="700">OPTIONAL INPUT SOURCES (NO SINGLE CONNECTOR REQUIRED)</text><g><rect x="44" y="145" width="242" height="90" rx="16" fill="#142238" stroke="#38bdf8" stroke-width="1.5"/><rect x="59" y="160" width="5" height="60" rx="2" fill="#38bdf8"/><text x="75" y="180" fill="#f8fafc" font-size="19" font-weight="700">Code</text><text x="75" y="205" fill="#b7c6d8" font-size="15">GitHub / CI / local scan</text></g><g><rect x="301" y="145" width="242" height="90" rx="16" fill="#142238" stroke="#38bdf8" stroke-width="1.5"/><rect x="316" y="160" width="5" height="60" rx="2" fill="#38bdf8"/><text x="332" y="180" fill="#f8fafc" font-size="19" font-weight="700">Runtime</text><text x="332" y="205" fill="#b7c6d8" font-size="15">OTLP / structured events</text></g><g><rect x="558" y="145" width="242" height="90" rx="16" fill="#142238" stroke="#38bdf8" stroke-width="1.5"/><rect x="573" y="160" width="5" height="60" rx="2" fill="#38bdf8"/><text x="589" y="180" fill="#f8fafc" font-size="19" font-weight="700">Identity</text><text x="589" y="205" fill="#b7c6d8" font-size="15">IAM / provider evidence</text></g><g><rect x="815" y="145" width="242" height="90" rx="16" fill="#142238" stroke="#38bdf8" stroke-width="1.5"/><rect x="830" y="160" width="5" height="60" rx="2" fill="#38bdf8"/><text x="846" y="180" fill="#f8fafc" font-size="19" font-weight="700">Human context</text><text x="846" y="205" fill="#b7c6d8" font-size="15">Requested / approved scope</text></g><g><rect x="1072" y="145" width="242" height="90" rx="16" fill="#142238" stroke="#38bdf8" stroke-width="1.5"/><rect x="1087" y="160" width="5" height="60" rx="2" fill="#38bdf8"/><text x="1103" y="180" fill="#f8fafc" font-size="19" font-weight="700">Forensics</text><text x="1103" y="205" fill="#b7c6d8" font-size="15">LogSense candidate data</text></g><g><rect x="1329" y="145" width="242" height="90" rx="16" fill="#142238" stroke="#f59e0b" stroke-width="1.5"/><rect x="1344" y="160" width="5" height="60" rx="2" fill="#f59e0b"/><text x="1360" y="180" fill="#f8fafc" font-size="19" font-weight="700">Demo inputs</text><text x="1360" y="205" fill="#b7c6d8" font-size="15">Labeled synthetic fixtures</text></g><text x="45" y="266" font-size="16" fill="#c4d6e5">Accepted records are not automatically qualified and connected credentials do not prove effective authority.</text><rect x="44" y="290" width="1510" height="92" rx="16" fill="#123442" stroke="#2dd4bf" stroke-width="2"/><text x="799" y="331" text-anchor="middle" font-size="25" fill="#f0fdfa" font-weight="700">Canonical Evidence Core</text><text x="799" y="357" text-anchor="middle" font-size="16" fill="#bbf7d0">Source identity • Qualification • Provenance • Tenant binding • Historical evaluation basis</text><text x="44" y="426" font-size="17" fill="#7dd3fc" font-weight="700">INDEPENDENT USE CASES — SELECTED ORCHESTRATION ONLY WHERE REQUIRED</text><g><rect x="44" y="448" width="355" height="126" rx="16" fill="#142238" stroke="#a78bfa" stroke-width="1.5"/><rect x="59" y="463" width="5" height="96" rx="2" fill="#a78bfa"/><text x="75" y="483" fill="#f8fafc" font-size="19" font-weight="700">Assurance run</text><text x="75" y="508" fill="#b7c6d8" font-size="15">Selected analyzers and evidence</text><text x="75" y="529" fill="#b7c6d8" font-size="15">Deterministic disposition</text><text x="75" y="550" fill="#b7c6d8" font-size="15">Agent Audit + five evidence planes</text></g><g><rect x="424" y="448" width="355" height="126" rx="16" fill="#142238" stroke="#f59e0b" stroke-width="1.5"/><rect x="439" y="463" width="5" height="96" rx="2" fill="#f59e0b"/><text x="455" y="483" fill="#f8fafc" font-size="19" font-weight="700">Authority and human review</text><text x="455" y="508" fill="#b7c6d8" font-size="15">Requested intent and policy</text><text x="455" y="529" fill="#b7c6d8" font-size="15">Approved Operating Envelope</text><text x="455" y="550" fill="#b7c6d8" font-size="15">Scoped deployment decisions</text></g><g><rect x="804" y="448" width="355" height="126" rx="16" fill="#142238" stroke="#fb7185" stroke-width="1.5"/><rect x="819" y="463" width="5" height="96" rx="2" fill="#fb7185"/><text x="835" y="483" fill="#f8fafc" font-size="19" font-weight="700">Operations and protection</text><text x="835" y="508" fill="#b7c6d8" font-size="15">Runtime telemetry and alerts</text><text x="835" y="529" fill="#b7c6d8" font-size="15">Guardrail decision / mediation</text><text x="835" y="550" fill="#b7c6d8" font-size="15">Kill Switch if actually integrated</text></g><g><rect x="1184" y="448" width="370" height="126" rx="16" fill="#142238" stroke="#22c55e" stroke-width="1.5"/><rect x="1199" y="463" width="5" height="96" rx="2" fill="#22c55e"/><text x="1215" y="483" fill="#f8fafc" font-size="19" font-weight="700">Compliance and controls</text><text x="1215" y="508" fill="#b7c6d8" font-size="15">Applicable framework controls</text><text x="1215" y="529" fill="#b7c6d8" font-size="15">Control tests and evidence</text><text x="1215" y="550" fill="#b7c6d8" font-size="15">Specialized industry profiles</text></g><text x="44" y="622" font-size="17" fill="#7dd3fc" font-weight="700">EVIDENCE-BASED ANALYSIS &amp; OUTPUTS</text><g><rect x="44" y="640" width="355" height="121" rx="16" fill="#142238" stroke="#a78bfa" stroke-width="1.5"/><rect x="59" y="655" width="5" height="91" rx="2" fill="#a78bfa"/><text x="75" y="675" fill="#f8fafc" font-size="19" font-weight="700">DAI + consequences</text><text x="75" y="700" fill="#b7c6d8" font-size="15">Nine-dimensional integrity</text><text x="75" y="721" fill="#b7c6d8" font-size="15">Qualified delegation comparison</text><text x="75" y="742" fill="#b7c6d8" font-size="15">Observed effect ≠ code reachability</text></g><g><rect x="424" y="640" width="355" height="121" rx="16" fill="#142238" stroke="#2dd4bf" stroke-width="1.5"/><rect x="439" y="655" width="5" height="91" rx="2" fill="#2dd4bf"/><text x="455" y="675" fill="#f8fafc" font-size="19" font-weight="700">Changes and Twin</text><text x="455" y="700" fill="#b7c6d8" font-size="15">Consequence Delta</text><text x="455" y="721" fill="#b7c6d8" font-size="15">Compliance Twin snapshots</text><text x="455" y="742" fill="#b7c6d8" font-size="15">Runtime differential comparisons</text></g><g><rect x="804" y="640" width="355" height="121" rx="16" fill="#142238" stroke="#38bdf8" stroke-width="1.5"/><rect x="819" y="655" width="5" height="91" rx="2" fill="#38bdf8"/><text x="835" y="675" fill="#f8fafc" font-size="19" font-weight="700">Reports and verification</text><text x="835" y="700" fill="#b7c6d8" font-size="15">Agent Audit / Master Report</text><text x="835" y="721" fill="#b7c6d8" font-size="15">Passports + evidence packages</text><text x="835" y="742" fill="#b7c6d8" font-size="15">Versioned digests and receipts</text></g><g><rect x="1184" y="640" width="370" height="121" rx="16" fill="#142238" stroke="#f59e0b" stroke-width="1.5"/><rect x="1199" y="655" width="5" height="91" rx="2" fill="#f59e0b"/><text x="1215" y="675" fill="#f8fafc" font-size="19" font-weight="700">Operational truth</text><text x="1215" y="700" fill="#b7c6d8" font-size="15">Monitoring ≠ enforcement</text><text x="1215" y="721" fill="#b7c6d8" font-size="15">Human approval ≠ dispatch grant</text><text x="1215" y="742" fill="#b7c6d8" font-size="15">No protection without receipts</text></g><path d="M 798 382 V 426" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="7 5"/><path d="M 44 590 H 1554" stroke="#2b4a62" stroke-width="1.5" stroke-dasharray="4 7"/><rect x="44" y="806" width="1510" height="161" rx="16" fill="#111e2e" stroke="#526780"/><text x="70" y="841" font-size="20" font-weight="700" fill="#f8fafc">Truth constraints (apply to every feature)</text><text x="74" y="880" font-size="15" fill="#cbd5e1">• UNKNOWN ≠ PASS</text><text x="450" y="880" font-size="15" fill="#cbd5e1">• Missing source ≠ no event</text><text x="826" y="880" font-size="15" fill="#cbd5e1">• Requested ≠ approved</text><text x="1202" y="880" font-size="15" fill="#cbd5e1">• IAM candidate ≠ effective grant</text><text x="74" y="911" font-size="15" fill="#cbd5e1">• Review ≠ runtime authorization</text><text x="450" y="911" font-size="15" fill="#cbd5e1">• Guardrail configured ≠ enforced</text><text x="826" y="911" font-size="15" fill="#cbd5e1">• Hash verified ≠ certified</text><text x="1202" y="911" font-size="15" fill="#cbd5e1">• Fixture ≠ production evidence</text><text x="45" y="1014" fill="#94a3b8" font-size="15">Not all workflows are entitled, configured or applicable for every organization. Actual running architecture is defined by canonical services.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img" aria-labelledby="ttl dsc"><title id="ttl">HAIEC | One Platform, Independent Workflows</title><desc id="dsc">Simplified product view showing independent customer objectives and one shared evidence-based assurance foundation; individual workflows are optional.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b1223"/><stop offset="100%" stop-color="#101b30"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#7dd3fc" stroke-width="1.5"/></marker></defs><rect width="1440" height="830" fill="url(#bg)"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-weight="800" fill="#f8fafc" font-size="31">HAIEC | One Platform, Independent Workflows</text><text x="44" y="86" fill="#91a4bc" font-size="16">Connect what you have. Evaluate the evidence that applies to your goal.</text><text x="44" y="135" fill="#7dd3fc" font-weight="700" font-size="17">CHOOSE YOUR VIEW</text><rect x="44" y="149" width="264" height="54" rx="12" fill="#213047" stroke="#405978"/><text x="176" y="184" fill="#e2e8f0" text-anchor="middle" font-weight="600" font-size="17">Developer</text><rect x="324" y="149" width="264" height="54" rx="12" fill="#213047" stroke="#405978"/><text x="456" y="184" fill="#e2e8f0" text-anchor="middle" font-weight="600" font-size="17">Security engineer</text><rect x="604" y="149" width="264" height="54" rx="12" fill="#213047" stroke="#405978"/><text x="736" y="184" fill="#e2e8f0" text-anchor="middle" font-weight="600" font-size="17">AI operator</text><rect x="884" y="149" width="264" height="54" rx="12" fill="#213047" stroke="#405978"/><text x="1016" y="184" fill="#e2e8f0" text-anchor="middle" font-weight="600" font-size="17">Governance owner</text><rect x="1164" y="149" width="264" height="54" rx="12" fill="#213047" stroke="#405978"/><text x="1296" y="184" fill="#e2e8f0" text-anchor="middle" font-weight="600" font-size="17">Executive / auditor</text><rect x="44" y="228" width="1352" height="98" rx="18" fill="#1a3650" stroke="#38bdf8" stroke-width="2"/><text x="720" y="270" fill="#f8fafc" text-anchor="middle" font-size="26" font-weight="700">AI System Workspace</text><text x="720" y="298" fill="#bfd2e1" text-anchor="middle" font-size="16">Systems • Connections • Capability Map • Authority • Evidence • Decisions • Changes</text><text x="44" y="365" fill="#7dd3fc" font-size="17" font-weight="700">START WITH YOUR OBJECTIVE — EACH WORKFLOW IS OPTIONAL</text><g><rect x="44" y="382" width="434" height="114" rx="16" fill="#142238" stroke="#38bdf8" stroke-width="1.5"/><rect x="59" y="397" width="5" height="84" rx="2" fill="#38bdf8"/><text x="75" y="417" fill="#f8fafc" font-size="19" font-weight="700">Discover</text><text x="75" y="442" fill="#b7c6d8" font-size="15">Systems, agents, tools</text><text x="75" y="463" fill="#b7c6d8" font-size="15">and consequential paths</text></g><g><rect x="505" y="382" width="434" height="114" rx="16" fill="#142238" stroke="#a78bfa" stroke-width="1.5"/><rect x="520" y="397" width="5" height="84" rx="2" fill="#a78bfa"/><text x="536" y="417" fill="#f8fafc" font-size="19" font-weight="700">Assure</text><text x="536" y="442" fill="#b7c6d8" font-size="15">Static analysis, five planes</text><text x="536" y="463" fill="#b7c6d8" font-size="15">and delegated action integrity</text></g><g><rect x="966" y="382" width="434" height="114" rx="16" fill="#142238" stroke="#f59e0b" stroke-width="1.5"/><rect x="981" y="397" width="5" height="84" rx="2" fill="#f59e0b"/><text x="997" y="417" fill="#f8fafc" font-size="19" font-weight="700">Govern</text><text x="997" y="442" fill="#b7c6d8" font-size="15">Boundaries, reviews</text><text x="997" y="463" fill="#b7c6d8" font-size="15">and deployment decisions</text></g><g><rect x="44" y="517" width="434" height="114" rx="16" fill="#142238" stroke="#22c55e" stroke-width="1.5"/><rect x="59" y="532" width="5" height="84" rx="2" fill="#22c55e"/><text x="75" y="552" fill="#f8fafc" font-size="19" font-weight="700">Monitor</text><text x="75" y="577" fill="#b7c6d8" font-size="15">Telemetry health, drift</text><text x="75" y="598" fill="#b7c6d8" font-size="15">and observed effects</text></g><g><rect x="505" y="517" width="434" height="114" rx="16" fill="#142238" stroke="#fb7185" stroke-width="1.5"/><rect x="520" y="532" width="5" height="84" rx="2" fill="#fb7185"/><text x="536" y="552" fill="#f8fafc" font-size="19" font-weight="700">Protect</text><text x="536" y="577" fill="#b7c6d8" font-size="15">Guardrails, mediation</text><text x="536" y="598" fill="#b7c6d8" font-size="15">and scoped Kill Switch</text></g><g><rect x="966" y="517" width="434" height="114" rx="16" fill="#142238" stroke="#2dd4bf" stroke-width="1.5"/><rect x="981" y="532" width="5" height="84" rx="2" fill="#2dd4bf"/><text x="997" y="552" fill="#f8fafc" font-size="19" font-weight="700">Verify</text><text x="997" y="577" fill="#b7c6d8" font-size="15">Controls, change history</text><text x="997" y="598" fill="#b7c6d8" font-size="15">and verifiable reports</text></g><text x="44" y="675" fill="#7dd3fc" font-weight="700" font-size="16">SHARED DETERMINISTIC FOUNDATION (NOT A REQUIRED ORDER)</text><rect x="44" y="692" width="1352" height="80" rx="17" stroke="#64748b" stroke-width="1.5" fill="#162034"/><text x="720" y="723" text-anchor="middle" font-weight="700" font-size="21" fill="#f8fafc">Qualified Evidence  +  Provenance  +  Scoped Evaluations</text><text x="720" y="751" text-anchor="middle" fill="#9fb3ca" font-size="16">Organization entitlement • User permission • Evidence readiness • Applicability • Explicit approvals</text><text x="44" y="807" fill="#94a3b8" font-size="14">Illustrative product architecture, not a live customer assessment or proof of runtime enforcement.</text></g></svg>
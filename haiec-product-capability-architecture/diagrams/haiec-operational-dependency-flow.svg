<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1820 1210" role="img" aria-labelledby="title desc"><title id="title">HAIEC product capability architecture</title><desc id="desc">Proposed source-qualified diagrams showing independent HAIEC capability families, evidence and action readiness, and user paths. Not a live system assessment.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#6ee7f3"/></marker></defs><rect width="1820" height="1210" fill="#091626"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="61" font-size="35" font-weight="800" fill="#eaf7ff" text-anchor="start">HAIEC | Operational Evidence, Authority &amp; Outcome Flow</text><text x="44" y="96" font-size="19" font-weight="500" fill="#a4c1d4" text-anchor="start">Illustrative dependency relationships; a user may begin at any eligible point.</text><text x="45" y="146" font-size="22" font-weight="700" fill="#7dd3fc" text-anchor="start">01  CHOOSE AN OUTCOME</text><rect x="44" y="166" width="336" height="110" rx="14" fill="#132c45" stroke="#38bdf8" stroke-width="1.5"/><rect x="58" y="183" width="5" height="76" rx="2" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5"/><text x="77" y="210" font-size="21" font-weight="700" fill="#38bdf8" text-anchor="start">SCAN</text><text x="77" y="243" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Source findings</text><rect x="399" y="166" width="336" height="110" rx="14" fill="#132c45" stroke="#c084fc" stroke-width="1.5"/><rect x="413" y="183" width="5" height="76" rx="2" fill="#c084fc" stroke="#c084fc" stroke-width="1.5"/><text x="432" y="210" font-size="21" font-weight="700" fill="#c084fc" text-anchor="start">AUTHORITY</text><text x="432" y="243" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Boundary review</text><rect x="754" y="166" width="336" height="110" rx="14" fill="#132c45" stroke="#fbbf24" stroke-width="1.5"/><rect x="768" y="183" width="5" height="76" rx="2" fill="#fbbf24" stroke="#fbbf24" stroke-width="1.5"/><text x="787" y="210" font-size="21" font-weight="700" fill="#fbbf24" text-anchor="start">COMPLIANCE</text><text x="787" y="243" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Control assessment</text><rect x="1109" y="166" width="336" height="110" rx="14" fill="#132c45" stroke="#2dd4bf" stroke-width="1.5"/><rect x="1123" y="183" width="5" height="76" rx="2" fill="#2dd4bf" stroke="#2dd4bf" stroke-width="1.5"/><text x="1142" y="210" font-size="21" font-weight="700" fill="#2dd4bf" text-anchor="start">MONITOR</text><text x="1142" y="243" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Runtime signals</text><rect x="1464" y="166" width="336" height="110" rx="14" fill="#132c45" stroke="#fb7185" stroke-width="1.5"/><rect x="1478" y="183" width="5" height="76" rx="2" fill="#fb7185" stroke="#fb7185" stroke-width="1.5"/><text x="1497" y="210" font-size="21" font-weight="700" fill="#fb7185" text-anchor="start">PROTECT</text><text x="1497" y="243" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Operational control</text><text x="45" y="321" font-size="22" font-weight="700" fill="#7dd3fc" text-anchor="start">02  VERIFY THE LOCAL PREREQUISITES FOR THAT OUTCOME</text><rect x="44" y="340" width="336" height="110" rx="14" fill="#132c45" stroke="#38bdf8" stroke-width="1.5"/><rect x="58" y="357" width="5" height="76" rx="2" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5"/><text x="77" y="384" font-size="21" font-weight="700" fill="#38bdf8" text-anchor="start">SOURCE</text><text x="77" y="417" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Repo/scan authorization</text><rect x="399" y="340" width="336" height="110" rx="14" fill="#132c45" stroke="#c084fc" stroke-width="1.5"/><rect x="413" y="357" width="5" height="76" rx="2" fill="#c084fc" stroke="#c084fc" stroke-width="1.5"/><text x="432" y="384" font-size="21" font-weight="700" fill="#c084fc" text-anchor="start">POLICY</text><text x="432" y="417" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Signed-off scope if needed</text><rect x="754" y="340" width="336" height="110" rx="14" fill="#132c45" stroke="#fbbf24" stroke-width="1.5"/><rect x="768" y="357" width="5" height="76" rx="2" fill="#fbbf24" stroke="#fbbf24" stroke-width="1.5"/><text x="787" y="384" font-size="21" font-weight="700" fill="#fbbf24" text-anchor="start">EVIDENCE</text><text x="787" y="417" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Applicable control artifacts</text><rect x="1109" y="340" width="336" height="110" rx="14" fill="#132c45" stroke="#2dd4bf" stroke-width="1.5"/><rect x="1123" y="357" width="5" height="76" rx="2" fill="#2dd4bf" stroke="#2dd4bf" stroke-width="1.5"/><text x="1142" y="384" font-size="21" font-weight="700" fill="#2dd4bf" text-anchor="start">TELEMETRY</text><text x="1142" y="417" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Collector and meaningful signals</text><rect x="1464" y="340" width="336" height="110" rx="14" fill="#132c45" stroke="#fb7185" stroke-width="1.5"/><rect x="1478" y="357" width="5" height="76" rx="2" fill="#fb7185" stroke="#fb7185" stroke-width="1.5"/><text x="1497" y="384" font-size="21" font-weight="700" fill="#fb7185" text-anchor="start">DISPATCH</text><text x="1497" y="417" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Actual hook and operator</text><text x="45" y="501" font-size="22" font-weight="700" fill="#7dd3fc" text-anchor="start">03  INDEPENDENT BACKEND SERVICES AND QUALIFIED EVIDENCE</text><rect x="44" y="523" width="835" height="168" rx="14" fill="#132c45" stroke="#38bdf8" stroke-width="1.5"/><rect x="58" y="540" width="5" height="134" rx="2" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5"/><text x="77" y="567" font-size="21" font-weight="700" fill="#38bdf8" text-anchor="start">Canonical Evidence + Qualified Sources</text><text x="77" y="600" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Source identity, tenant binding, provenance, basis and limitations</text><text x="77" y="623" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Source data never becomes approved delegation by itself</text><rect x="902" y="523" width="872" height="168" rx="14" fill="#132c45" stroke="#c084fc" stroke-width="1.5"/><rect x="916" y="540" width="5" height="134" rx="2" fill="#c084fc" stroke="#c084fc" stroke-width="1.5"/><text x="935" y="567" font-size="21" font-weight="700" fill="#c084fc" text-anchor="start">Selected Evaluations and Decision Owners</text><text x="935" y="600" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Audit Orchestrator + deterministic comparator + controls where selected</text><text x="935" y="623" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Independent human decisions and operational guards retain own owners</text><text x="45" y="739" font-size="22" font-weight="700" fill="#7dd3fc" text-anchor="start">04  WHAT USERS RECEIVE</text><rect x="44" y="761" width="424" height="145" rx="14" fill="#132c45" stroke="#38bdf8" stroke-width="1.5"/><rect x="58" y="778" width="5" height="111" rx="2" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5"/><text x="77" y="805" font-size="21" font-weight="700" fill="#38bdf8" text-anchor="start">FINDINGS</text><text x="77" y="838" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Paths, DAI, coverage</text><text x="77" y="861" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Unknowns and evidence needs</text><rect x="487" y="761" width="424" height="145" rx="14" fill="#132c45" stroke="#fbbf24" stroke-width="1.5"/><rect x="501" y="778" width="5" height="111" rx="2" fill="#fbbf24" stroke="#fbbf24" stroke-width="1.5"/><text x="520" y="805" font-size="21" font-weight="700" fill="#fbbf24" text-anchor="start">DECISIONS</text><text x="520" y="838" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Versioned authority and</text><text x="520" y="861" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">human scoped approvals</text><rect x="930" y="761" width="424" height="145" rx="14" fill="#132c45" stroke="#2dd4bf" stroke-width="1.5"/><rect x="944" y="778" width="5" height="111" rx="2" fill="#2dd4bf" stroke="#2dd4bf" stroke-width="1.5"/><text x="963" y="805" font-size="21" font-weight="700" fill="#2dd4bf" text-anchor="start">OBSERVATIONS</text><text x="963" y="838" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Health, drift, alerts</text><text x="963" y="861" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Gathered runtime evidence</text><rect x="1373" y="761" width="424" height="145" rx="14" fill="#132c45" stroke="#fb7185" stroke-width="1.5"/><rect x="1387" y="778" width="5" height="111" rx="2" fill="#fb7185" stroke="#fb7185" stroke-width="1.5"/><text x="1406" y="805" font-size="21" font-weight="700" fill="#fb7185" text-anchor="start">ENFORCEMENT</text><text x="1406" y="838" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">If target actually blocked</text><text x="1406" y="861" font-size="15" font-weight="500" fill="#a4c1d4" text-anchor="start">Receipt, effect confirmation</text><rect x="44" y="954" width="1730" height="167" rx="18" fill="#12263a" stroke="#526d87" stroke-width="1.5"/><text x="70" y="997" font-size="21" font-weight="700" fill="#eaf7ff" text-anchor="start">CROSS-CUTTING CONTROLS</text><text x="70" y="1030" font-size="17" font-weight="400" fill="#a4c1d4" text-anchor="start">User + tenant permissions  •  Entitlements  •  Assurance/industry applicability  •  Exact evaluation basis</text><text x="70" y="1057" font-size="17" font-weight="400" fill="#a4c1d4" text-anchor="start">Requested ≠ approved  •  Connected ≠ qualified  •  Code capable ≠ observed  •  Human approval ≠ enforced</text><text x="70" y="1084" font-size="17" font-weight="400" fill="#a4c1d4" text-anchor="start">Operating protections can be independent of Assurance; comparisons require comparable records and source freshness.</text><text x="44" y="1171" font-size="16" font-weight="500" fill="#a4c1d4" text-anchor="start">No universal run-all sequence. No 0% FAR or universal Kill Switch guarantee. Historical/demo outputs remain labeled.</text></g></svg>